# 「Tor 中繼地球儀」的回歸測試。
#
# 前四支驗的都是實際踩過的 bug，不是為了覆蓋率補的：捏合放開之後地球彈開、iOS Safari
# 在物件上點兩下觸發整頁放大、變電所容量計的刻度標籤在英文版擠成一團、關注區域對
# 有海外屬地的國家框出大半個地球。第五支驗工作坊導覽，那個功能的失敗方式全是安靜的：
# DOM id 打錯就是按了沒反應，i18n 少一條就是某個語系顯示 key 本身，兩種在本機都看不出來。
# 每一支都做過突變實驗，故意改壞被測程式確認會轉紅。
#
# 第六支驗事件穿透：可見的國家標籤設了 pointer-events: auto 才點得開卡片，代價是
# 它們會吃掉滑鼠事件，而操作原本掛在畫布上，游標壓在標籤上就縮放不了也拖不動。
#
# 第五支驗六角層。那一層的幾何在前端算、國碼在後端算，兩邊的頂點順序只要錯開一格，
# 結果就是每一格都有顏色但顏色屬於別的國家，畫面看起來完全正常。
#
# 手法是把函式從 atlas.js 原地抽出來注入假相依重放，或開 headless Chrome 量 DOM。
# 驗的是真程式碼，不是複製一份。所以只要有人改了 atlas.js 對應的地方，這裡就會知道。
#
# 這幾支的相依是 node 與（其中一支）google-chrome，ubuntu runner 兩個都內建。
# check_sub_gauge 找不到 chrome 時會自己跳過並回 0，本機沒裝也不會擋人。
#
# 這是 blocking 的。docs-style-lint 那支是 warn 階段，因為文字規則有誤報空間；
# 這幾支驗的是行為，紅了就是真的壞了。
name: games-checks

on:
  pull_request:
    paths:
      - "docs/zh-TW/games/tor-network/**"
      - "tools/check_*.mjs"
      - "tools/test_layers.mjs"
      - ".github/workflows/games-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 確認 headless Chrome 在
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::warning::找不到 google-chrome，容量計的版面檢查會自己跳過"
          fi

      # 分開跑而不是串成一行，哪一支紅的在 GitHub 的步驟清單上直接看得出來
      - name: 捏合放開不彈開
        run: node tools/check_pinch_release.mjs

      - name: 擋掉 iOS Safari 的雙擊放大
        run: node tools/check_double_tap.mjs

      - name: 網址關注區域的解析與取景
        run: node tools/check_focus.mjs

      - name: 變電所容量計的版面（280 座 × 三語系 × 寬窄兩種視窗）
        run: node tools/check_sub_gauge.mjs

      - name: 六角層的幾何與國碼對得起來
        run: node tools/check_hexgrid.mjs

      - name: 游標壓在國家標籤上時地球照樣轉得動
        run: node tools/check_ui_passthrough.mjs
      - name: 工作坊導覽走得完，接線與三語文案都在
        run: node tools/check_tour.mjs

      - name: 圖層清單跟來源檔案、三語字串、面板節點對得上
        run: node tools/test_layers.mjs

      - name: 每一層開得起來也關得掉，物件沒有漏收
        run: node tools/check_layers_toggle.mjs
