# tools/ 底下那幾支測試的 CI。全部零外部相依，不需要建置產物，跑完不到十秒。
#
# 為什麼值得掛上來：這幾支守的都是「只在特定情境才會出錯、平常看不出來」的行為，
# 而那正是抽樣測試守不住的一類。實際踩過的：
#
#   - service worker 的離線 fallback 整條鏈沒有測試，結果「清除所有離線內容」把
#     離線提示頁一起清掉，之後任何沒快取的網址在離線時都掉到瀏覽器的錯誤畫面
#   - 預快取清單與索引頁連出去的網址形狀對不上，線上一切正常，只有離線的人打不開
#   - 離線內容管理頁的分組與排序改動，錯了是整份清單跟側邊欄對不起來
#   - 離線內容管理頁的介面畫錯，讀者按了沒反應或看不到回應。2026-08-20 改那一頁的
#     sticky 版面時 CI 一個都沒跑，paths 漏了 js/offline-library.js
#   - 密碼產生器的取樣有偏差、熵算錯、詞表少幾個字。這一類錯誤畫面上完全正常，
#     照樣吐出一串看起來很隨機的字，而受害的讀者不會知道自己受害
#   - QR code 產生出「掃得出來但內容錯」的碼。人眼讀不了 QR，這種錯只有把碼解回
#     文字才驗得到
#   - 指紋示範頁偷偷把讀到的數值送出去或存起來。那一頁的整個立論建立在「什麼都不送」，
#     承諾寫在文案裡誰都會寫，有測試掃著才算數
#   - 部署後要清哪些網址，漏清是訪客看到舊內容，多清是波及 zone 內其他服務
#
# tools/test_docs_style_lint.py 不在這裡，它由 docs-style-lint.yml 跑，那支 workflow
# 本來就要先確認規則沒壞掉才有資格擋 PR。
name: tools-tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "docs/zh-TW/sw.js"
      # 這裡原本逐一列出每一支 js。漏一支的代價上面第 10 行已經寫過一次
      # （改 offline-library.js 那次 CI 一個都沒跑）。改成整個目錄，新增檔案不必記得
      # 回來加，這幾支測試跑完不到十秒，多跑幾次的成本可以忽略。
      #
      # 三個語系都要納入：test_analytics.mjs 會比對三份 analytics.js 逐位元組相同，
      # 只改 zh-CN 那份的話，不掃就抓不到。
      - "docs/zh-TW/js/**"
      - "docs/zh-CN/js/**"
      - "docs/en/js/**"
      - "docs/zh-TW/utils/**"
      - "docs/mkdocs*.yml"
      # 升級 mkdocs-material 會換掉 theme 資產的雜湊，而 base.html 把那些檔名寫死。
      # #338 只動了這個檔案，當時的 paths 沒有納入，於是一支測試都沒跑，壞掉的雜湊
      # 一路上線。
      - "docs/uv.lock"
      - "docs/snippets/**"
      # overrides 的 main.html 是 test_before_send.mjs 的來源，送出前的白名單寫在裡面
      - "docs/overrides/base.html"
      - "docs/overrides/main.html"
      - "docs/overrides_cn/main.html"
      - "docs/overrides_en/main.html"
      - "docs/hooks/**"
      - ".github/workflows/tools-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # service worker 的離線行為：網址形狀、語系、預快取範圍、library 與清除
      - name: sw.js 離線路徑
        run: node tools/test_sw_offline.mjs

      # 語言偏好只在預設語系的首頁套用，其餘一律不動
      - name: 語言偏好導向規則
        run: node tools/test_lang_preference.mjs

      # 離線內容管理頁的章節分組與排序，照 nav 而不是檔案的字母序
      - name: 離線內容索引
        run: python3 tools/test_offline_index.py

      # 離線內容管理頁的介面：畫出來的結構、順序、連結，以及送給 SW 的指令
      - name: 離線內容管理頁介面
        run: node tools/test_offline_library.mjs

      # 密語與密碼產生器：取樣有沒有偏差、熵算得對不對、詞表有沒有壞掉
      - name: 密語與密碼產生器
        run: node tools/test_passphrase.mjs

      # QR code：產生的碼用獨立寫的解碼器讀回文字比對，驗的是「掃得出來而且內容對」
      - name: QR code 產生器
        run: node tools/test_qrcode.mjs

      # 指紋示範頁：掃原始碼確認沒有把資料送出去或存起來，以及三語系文案沒有漏
      - name: 瀏覽器指紋示範
        run: node tools/test_leaks.mjs

      # 網址清理器：守的是「必要參數不能被誤刪」，那比漏刪追蹤參數更難發現
      - name: 網址清理器
        run: node tools/test_cleanurl.mjs

      # 隱形字元偵測：誤判與漏報一樣糟，兩組案例的數量刻意相當
      - name: 隱形字元偵測
        run: node tools/test_invisible.mjs

      # QR code 讀取器：產生器產生、讀取器讀回，兩個獨立的函式庫互相驗證
      - name: QR code 讀取器
        run: node tools/test_qrread.mjs

      # 第三方元件的標示與授權：漏掉不會有錯誤訊息，只是授權沒有被履行
      - name: 第三方元件標示
        run: node tools/test_vendor_attribution.mjs

      # 小工具索引頁的卡片順序：跟 nav 不一致時沒有任何錯誤訊息，只有讀者會覺得東西換位置
      - name: 小工具索引順序
        run: node tools/test_utils_index_order.mjs

      # 圖表函式庫按需載入：放回 extra_javascript 不會有錯誤訊息，只是全站變慢
      - name: 圖表函式庫按需載入
        run: node tools/test_chart_assets.mjs

      # Metadata 清除器：漏清跟改壞一樣糟，兩種都直接在輸出的位元組上驗
      - name: 照片 metadata 清除器
        run: node tools/test_stripmeta.mjs

      # 威脅模型清單：建議的頁面存不存在，以及答案有沒有被存到裝置上
      - name: 威脅模型清單
        run: node tools/test_threatmodel.mjs

      # theme 資產的雜湊有沒有跟著 mkdocs-material 的版本一起換。忘了同步的話建置
      # 與 PR 都是綠的，只有線上的 HTML 會指向一批不存在的檔案，而那種壞法讀者清
      # 快取、重裝 PWA 都救不回來，因為錯的網址就寫在伺服器送出來的 HTML 裡。
      - name: theme 資產雜湊同步
        run: python3 tools/test_theme_assets.py

      # 部署後要清除的 Cloudflare 快取網址
      - name: Cloudflare 快取清除映射
        run: python3 tools/test_cf_purge.py

      # 部署時哪些檔案不用重傳。判錯的方向不對稱：該傳的沒傳會讓站上留著舊內容，
      # 而且不會有任何一步變紅燈。
      - name: S3 略過未變動檔案
        run: python3 tools/test_s3_restore_mtime.py

      # 埋在小工具裡的分析事件只准送列舉值。站上對讀者的承諾寫在 utils/leaks，
      # 而新增一個事件只要一行，多送一個變數看起來跟少送一個沒有差別。
      - name: 分析事件不夾帶內容
        run: node tools/test_analytics_events.mjs

      # 送出前的白名單。2026-08 發現 search.highlight 把讀者打的字寫進 ?h=，而 umami
      # 預設把完整網址送出去，兩個預設疊起來讓搜尋詞進了分析資料庫。修法就是這道
      # 白名單，它失效的方式一樣安靜，所以每一條規則都要有測試盯著。
      - name: 送出前的白名單擋得住
        run: node tools/test_before_send.mjs

      # 整站共通的量測腳本站在搜尋框旁邊。承諾是關鍵字一個字都不送，只送字數級距，
      # 而把 queryBucket(q.length) 寫成 q 只差幾個字元，畫面上看不出差別。
      - name: 量測腳本不外洩搜尋詞
        run: node tools/test_analytics.mjs
