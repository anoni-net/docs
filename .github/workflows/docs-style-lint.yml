# 編輯標準掃描器（Tier 1）。只掃這個 PR 變更到的 docs Markdown。
#
# 三個語系都掃，但套用的規則不同。中文那組是標點與句型（破折號、分號、不是…而是、
# 「這」堆疊），英文那組獨立（見 docs/en/community/contributor-handbook.md 的
# Writing style），因為破折號與分號在英文是正常標點。linter 依路徑自動選規則集，
# 見 tools/docs_style_lint.py 的 is_english_doc。
#
# en 是 2026-08 納入的。在那之前英文規則純靠人工，而補齊英文站的三個批次顯示
# 人工在那個規模守不住，同一類違反（粗體整句開頭、冒號標題）三批都出現。
#
# 這個 job 會擋 merge。error 級規則（破折號、分號、不是…而是、並列引號、AI 開頭語、
# blog frontmatter）讓 linter 回 exit 1，job 就紅。warn 級規則仍只標 annotation，
# 不影響 exit code，改法要看語境，機器不宜代勞。
#
# 要讓 warn 也擋，得先把對應規則升成 error，那是規則本身的決定，不是這裡改。
# 另需在 repo 設定把這個 check 設為 branch protection 必過，workflow 擋不到那一層。
name: docs-style-lint

on:
  pull_request:
    paths:
      - "docs/zh-TW/**/*.md"
      - "docs/zh-CN/**/*.md"
      - "docs/en/**/*.md"
      - "tools/docs_style_lint.py"
      - "tools/test_docs_style_lint.py"
      - ".github/workflows/docs-style-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 規則本身的回歸測試。內容掃描只擋 error，但「規則有沒有壞掉」是二元的，
      # 所以這一步一定要擋。實際踩過兩次：簡體「讲」完全沒被檢查、
      # 「得先」的例外字集繁簡不對稱導致誤報，都是抽樣看不出來的覆蓋缺口。
      - name: 測試 linter 規則
        run: python3 tools/test_docs_style_lint.py

      - name: 掃描變更的 Markdown
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACM "$base" HEAD -- docs/zh-TW docs/zh-CN docs/en \
            | grep -E '\.md$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "沒有變更的 Markdown，略過。"
            exit 0
          fi
          echo "掃描 ${#files[@]} 個變更檔："
          printf '  %s\n' "${files[@]}"
          python3 tools/docs_style_lint.py --format github "${files[@]}"
