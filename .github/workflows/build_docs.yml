name: BuildDocs

on:
  push:
    branches:
      - "docs"
  workflow_dispatch:

# 最後兩步是先 `aws s3 rm --recursive` 清空該 prefix，再 `s3 sync` 上傳。兩個 run
# 重疊時，後者的清空會發生在前者上傳到一半，S3 會有一段內容不完整的空窗。連續合併
# 幾個 PR 再同步 docs 分支就會踩到。
#
# 全域一組（不帶 ref），因為 workflow_dispatch 可以從任何分支觸發，而所有 run 都寫
# 同一個 bucket，要序列化的是 S3 寫入本身。standard 與 onion 是同一個 run 裡的兩格，
# 寫的是不同 prefix，彼此平行跑沒有問題，要擋的是 run 與 run 之間。
#
# 用 false 而非 true：run 被中途取消有機會停在 `s3 rm` 之後、`s3 sync` 之前，那會留下
# 一個空的 bucket。排隊比取消安全。排隊中的 run 若被更新的 run 取代，它還沒開始執行，
# 不會碰到 S3。
concurrency:
  group: build-docs-s3
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # onion 那格失敗不要連帶取消 clearnet 的部署，兩份是各自獨立的產物。
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04"]
        python-version: ["3.12"]
        # standard = clearnet（anoni.net/docs）。
        # onion = docs.<onion>，站內絕對網址改寫成 onion，並拿掉只在 clearnet 生效的
        # 分析區塊，等同 m6 上手動跑的 build_docs_anoni_onion.sh。
        variant: ["standard", "onion"]
    runs-on: ${{ matrix.os }}
    env:
      # clearnet 產物維持在既有的 docs/，onion 產物放同一個 bucket 的 docs-onion/。
      S3_PREFIX: ${{ matrix.variant == 'onion' && 'docs-onion' || 'docs' }}
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # onion 版的改寫是就地 sed 整個工作目錄，所以一定要在任何 mkdocs build 之前跑。
      # 擺在 uv sync 之前是刻意的：那支腳本用 `find ./ -type f -exec sed -i`，.venv 一旦
      # 建好就是上萬個檔案要被逐一重寫，既慢又沒有意義（第三方套件不含站內網址）。
      - name: Rewrite URLs for onion
        if: matrix.variant == 'onion'
        run: sh ./replace_sitename_anoni_onion.sh

      - name: Update libs
        run: sudo apt-get update
      - name: Install ca
        run: sudo apt-get install ca-certificates
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Sync Packages
        run: uv sync --group=dev
      - name: Show packages
        run: uv tree
      # mkdocs-material 的 privacy 外掛會把外部資產下載到
      # docs/.cache/plugin/privacy/assets/external/<host>/。**下載失敗時它仍然會把該檔
      # 登記進 files**，之後 copy_static_files 找不到檔案就丟 FileNotFoundError，整個
      # 建置失敗。外掛本身沒有重試，而 .cache 既不在版控也沒進 CI 快取，等於每次建置
      # 都要重新對十幾個外部主機碰運氣。2026-07 就因為 interseclab.org 與
      # search.anoni.net 各失敗一次，兩次都不是內容有問題。
      #
      # 把這個目錄快取起來，上一次成功下載的檔案就會留著，單一主機的暫時性故障不再
      # 拖垮建置。只快取 privacy 一個子目錄（約 45 MB），social 外掛的字型與卡片
      # （約 177 MB）不含在內，那部分是可重算的，也不是失敗來源。
      #
      # 注意：快取全新或被 LRU 淘汰時（首次建置、長期沒跑）仍然要重新下載，
      # 那種情況下這層保護不存在。要根治得把外部圖片鏡像到 assets.anoni.net。
      #
      # 兩格會同時跑，共用同一把 key 會互相覆寫（後寫的那個拿到 "cache already exists"）。
      # 依 variant 分開存，最後再留一層不分 variant 的 fallback：鏡像的是第三方外部
      # 資產，兩個變體抓到的內容其實一樣，新增的 onion 格不必從零開始重抓一輪。
      - name: Cache privacy plugin external assets
        uses: actions/cache@v4
        with:
          path: docs/.cache/plugin/privacy
          key: mkdocs-privacy-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            mkdocs-privacy-${{ matrix.variant }}-
            mkdocs-privacy-

      - name: Install mkdocs-material social dependencies
        run: sudo apt-get install libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Build Docs (/)
        run: source ./.venv/bin/activate; sh ./run.sh;
      - name: Build Docs (/zh-tw)
        run: source ./.venv/bin/activate; sh ./run_zh-tw.sh;
      - name: Build Docs (/zh-cn)
        run: source ./.venv/bin/activate; sh ./run_zh-cn.sh;
      - name: Build Docs (/en)
        run: source ./.venv/bin/activate; sh ./run_en.sh;
      - name: Replace OG images
        run: |
          # output 結構已改為依年份 blog/YYYY/MM/
          for base in ./output ./output/zh-tw ./output/en; do
            [ -d "$base" ] || continue
            mkdir -p "$base/assets/images/social/blog/2025/02" "$base/assets/images/social/blog/2025/03"
          done
          wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-zh-tw.png -O ./output/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          [ -d ./output/zh-tw ] && wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-zh-tw.png -O ./output/zh-tw/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          [ -d ./output/en ] && wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-en.png -O ./output/en/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          for base in ./output ./output/zh-tw ./output/en; do
            [ -d "$base" ] || continue
            [ -f "$base/blog/assets/images/g0v-hackath65n.webp" ] && cp "$base/blog/assets/images/g0v-hackath65n.webp" "$base/assets/images/social/blog/2025/02/g0v-hackath65n.png"
            [ -f "$base/blog/assets/images/tor-tails-workshop-slide.webp" ] && cp "$base/blog/assets/images/tor-tails-workshop-slide.webp" "$base/assets/images/social/blog/2025/03/rightscon25-tor-tails-ooni-after.png"
          done
      - name: Inject PWA build version
        run: find ./output -name 'sw.js' -exec sed -i "s/__BUILD_VERSION__/$(date +%Y%m%d%H%M)/" {} \;

      # onion 站的 robots 指向 onion 的 sitemap，跟 clearnet 那份不同。對齊 m6 上
      # build_docs_anoni_onion.sh 最後那步 `cp ./robots_onion.txt <root>/robots.txt`。
      - name: Onion robots.txt
        if: matrix.variant == 'onion'
        run: cp ./robots_onion.txt ./output/robots.txt

      # service worker 只在 clearnet 註冊：overrides/base.html 用 `host === "anoni.net"`
      # 擋著，onion 主機上兩個分支都不會進，這支檔案永遠不會被要求。留著只是兩份各
      # 14KB 的死重量，而且它的註解提到 aa.anoni.net，會讓下一步的驗證誤判。
      #
      # 這也是 m6 上 onion 產物本來就沒有 sw.js 的原因，刪掉是回到既有行為。
      - name: Drop service worker from onion build
        if: matrix.variant == 'onion'
        run: find ./output -name 'sw.js' -delete

      # replace_sitename_anoni_onion.sh 靠 GNU sed 的就地改寫，但它的結束碼來自最後
      # 那行診斷用的 grep，改寫整批失敗也一樣回 0（在 BSD sed 上實測過，全部沒改到、
      # 依然 exit 0）。沒驗的話這一格會把 clearnet 內容推上 docs-onion/，m6 同步過去
      # 之後 onion 站就開始送 clearnet 網址跟 clearnet 的分析端點，而且不會有人發現。
      #
      # 兩個方向都要驗：只驗「沒有 clearnet 殘留」的話，產物是空的也會過關。
      - name: Verify onion output
        if: matrix.variant == 'onion'
        run: |
          onion='docs.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion'
          leftover=0
          for pattern in 'https://anoni.net/docs' 'aa.anoni.net'; do
            n=$(grep -rl "$pattern" ./output/ | wc -l)
            echo "clearnet 殘留 $pattern：$n 個檔案"
            [ "$n" -eq 0 ] || leftover=1
          done
          rewritten=$(grep -rl "$onion" ./output/ | wc -l)
          echo "含 onion 網址：$rewritten 個檔案"
          if [ "$leftover" -ne 0 ] || [ "$rewritten" -eq 0 ]; then
            echo "::error::onion 產物驗證失敗，中止上傳"
            exit 1
          fi

      - name: Clean the all files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOC_S3_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOC_S3_KEY }}
        # 結尾的斜線不能省。`s3://bucket/docs` 是前綴比對，會連 `docs-onion/` 底下的
        # 物件一起刪掉，兩格同時跑就會互相清空。
        run: source ./.venv/bin/activate; aws s3 rm "s3://${{ secrets.DOC_BUCKET }}/${S3_PREFIX}/" --recursive
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOC_S3_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOC_S3_KEY }}
        run: source ./.venv/bin/activate; aws s3 sync ./output "s3://${{ secrets.DOC_BUCKET }}/${S3_PREFIX}/" --acl public-read

      # S3 換好之後 Cloudflare edge 還是握著舊的 HTML，站上看到的仍是上一版。origin
      # 送的是 `max-age=14400, must-revalidate`，但實測 age 超過 45000 秒依然回 HIT，
      # 表示 zone 上有 Edge Cache TTL 蓋過 origin 標頭，等它自然過期不可靠。
      # 2026-08-07 的 COSCUP 置頂公告就是這樣，部署成功但站上整整半天還是舊公告。
      #
      # 只在 standard 這格跑。onion 是 m6 上的獨立 server block，走 .onion 位址，
      # 不經過 Cloudflare，沒有可清的 edge 快取。
      #
      # 用 purge_everything 而不是逐 URL：overrides 的改動（置頂公告、footer、分析
      # 區塊）會同時影響每一頁，挑幾個 URL 清一定會漏。purge by prefix 與 by hostname
      # 都是 Enterprise 功能，本 zone 是 Pro，逐 URL 又有單次 30 條的上限，湊不齊
      # 整個 docs 站。清整個 zone 的代價是主站與其他子網域一起回源重抓，量很小。
      #
      # 沒設 secret 時只警告不失敗，讓還沒配 token 的環境（例如 fork）照樣能部署。
      # 設了但 API 回錯就要 fail，否則會安靜地留下舊內容，跟沒清一樣難發現。
      - name: Purge Cloudflare cache
        if: matrix.variant == 'standard'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CF_ZONE_ID 或 CF_PURGE_TOKEN 未設定，略過快取清除。S3 已更新，但站上可能還是舊內容。"
            exit 0
          fi
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$resp" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "Cloudflare 快取已清除（zone 全清）"
          else
            echo "::error::Cloudflare 快取清除失敗，站上可能仍是舊內容"
            echo "$resp" | jq -c '.errors // .' 2>/dev/null || echo "$resp"
            exit 1
          fi
