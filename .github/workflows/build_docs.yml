name: BuildDocs

on:
  push:
    branches:
      - "docs"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update libs
        run: sudo apt-get update
      - name: Install ca
        run: sudo apt-get install ca-certificates
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Sync Packages
        run: uv sync --group=dev
      - name: Show packages
        run: uv tree
      # mkdocs-material 的 privacy 外掛會把外部資產下載到
      # docs/.cache/plugin/privacy/assets/external/<host>/。**下載失敗時它仍然會把該檔
      # 登記進 files**，之後 copy_static_files 找不到檔案就丟 FileNotFoundError，整個
      # 建置失敗。外掛本身沒有重試，而 .cache 既不在版控也沒進 CI 快取，等於每次建置
      # 都要重新對十幾個外部主機碰運氣。2026-07 就因為 interseclab.org 與
      # search.anoni.net 各失敗一次，兩次都不是內容有問題。
      #
      # 把這個目錄快取起來，上一次成功下載的檔案就會留著，單一主機的暫時性故障不再
      # 拖垮建置。只快取 privacy 一個子目錄（約 45 MB），social 外掛的字型與卡片
      # （約 177 MB）不含在內，那部分是可重算的，也不是失敗來源。
      #
      # 注意：快取全新或被 LRU 淘汰時（首次建置、長期沒跑）仍然要重新下載，
      # 那種情況下這層保護不存在。要根治得把外部圖片鏡像到 assets.anoni.net。
      - name: Cache privacy plugin external assets
        uses: actions/cache@v4
        with:
          path: docs/.cache/plugin/privacy
          key: mkdocs-privacy-${{ github.sha }}
          restore-keys: |
            mkdocs-privacy-

      - name: Install mkdocs-material social dependencies
        run: sudo apt-get install libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Build Docs (/)
        run: source ./.venv/bin/activate; sh ./run.sh;
      - name: Build Docs (/zh-tw)
        run: source ./.venv/bin/activate; sh ./run_zh-tw.sh;
      - name: Build Docs (/zh-cn)
        run: source ./.venv/bin/activate; sh ./run_zh-cn.sh;
      - name: Build Docs (/en)
        run: source ./.venv/bin/activate; sh ./run_en.sh;
      - name: Replace OG images
        run: |
          # output 結構已改為依年份 blog/YYYY/MM/
          for base in ./output ./output/zh-tw ./output/en; do
            [ -d "$base" ] || continue
            mkdir -p "$base/assets/images/social/blog/2025/02" "$base/assets/images/social/blog/2025/03"
          done
          wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-zh-tw.png -O ./output/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          [ -d ./output/zh-tw ] && wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-zh-tw.png -O ./output/zh-tw/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          [ -d ./output/en ] && wget -q https://assets.anoni.net/og/rightscon25-tor-tails-ooni-en.png -O ./output/en/assets/images/social/blog/2025/02/rightscon25-tor-tails-ooni.png
          for base in ./output ./output/zh-tw ./output/en; do
            [ -d "$base" ] || continue
            [ -f "$base/blog/assets/images/g0v-hackath65n.webp" ] && cp "$base/blog/assets/images/g0v-hackath65n.webp" "$base/assets/images/social/blog/2025/02/g0v-hackath65n.png"
            [ -f "$base/blog/assets/images/tor-tails-workshop-slide.webp" ] && cp "$base/blog/assets/images/tor-tails-workshop-slide.webp" "$base/assets/images/social/blog/2025/03/rightscon25-tor-tails-ooni-after.png"
          done
      - name: Inject PWA build version
        run: find ./output -name 'sw.js' -exec sed -i "s/__BUILD_VERSION__/$(date +%Y%m%d%H%M)/" {} \;
      - name: Clean the all files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOC_S3_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOC_S3_KEY }}
        run: source ./.venv/bin/activate; aws s3 rm s3://${{ secrets.DOC_BUCKET }}/docs --recursive
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOC_S3_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOC_S3_KEY }}
        run: source ./.venv/bin/activate; aws s3 sync ./output s3://${{ secrets.DOC_BUCKET }}/docs/ --acl public-read
