[project]
name = "anoni-net-docs"
version = "2025.12.31"
description = "About OONI Probe and ASNs finding in Taiwan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-charts-plugin>=0.0.12",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocs-material[imaging]>=9.7,<10",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-rss-plugin>=1.17.1",
]

[dependency-groups]
dev = [
    "awscli>=1.38.36",
    # tools/s3_restore_mtime.py 用 botocore 讀 S3 物件清單。awscli 1.x 以前會把
    # botocore 當成一般相依裝進 site-packages，1.46.0 起改成內嵌成 awscli.botocore，
    # 頂層 `import botocore` 就再也找不到。那支腳本的例外處理會把 ImportError 吞掉
    # 退回完整上傳，CI 只留下一則沒人看的 warning，優化等於靜靜失效。
    # 這裡明講相依，不靠 awscli 的內部結構。
    "botocore>=1.35",
]
