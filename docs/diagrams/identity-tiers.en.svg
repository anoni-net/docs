<rect class="card-n" x="28" y="28" width="1024" height="52" rx="8"/>
<text class="t-main h2" x="44" y="58">THE BASIS</text>
<text class="t-main bd" x="176" y="58">Accounts in different tiers share no email, no username, no browser and no password manager folder.</text>
<rect class="card-c1" x="28" y="94" width="282.667" height="254" rx="8"/>
<text class="t-main h2" x="42" y="118">Everyday tier</text>
<text class="t-mute sm" x="42" y="136">Long-lived, tied to your legal name</text>
<text class="t-mute sm" x="42" y="154">WHAT LIVES HERE</text>
<text class="t-main bd" x="42" y="172">Email and mainstream social media</text>
<text class="t-main bd" x="42" y="189">Banking and streaming</text>
<text class="t-main bd" x="42" y="206">Work and school accounts</text>
<text class="t-mute sm" x="42" y="231">WORKING ASSUMPTION</text>
<text class="t-main bd" x="42" y="249">Family or colleagues seeing this is</text>
<text class="t-main bd" x="42" y="266">fine</text>
<rect class="card-c2" x="398.667" y="94" width="282.667" height="254" rx="8"/>
<text class="t-main h2" x="412.667" y="118">Community tier</text>
<text class="t-mute sm" x="412.667" y="136">Long-lived, no overlap with everyday</text>
<text class="t-mute sm" x="412.667" y="154">WHAT LIVES HERE</text>
<text class="t-main bd" x="412.667" y="172">Accounts used at community events</text>
<text class="t-main bd" x="412.667" y="189">Interaction with content about sexual</text>
<text class="t-main bd" x="412.667" y="206">orientation</text>
<text class="t-main bd" x="412.667" y="223">Contacts with LGBTQ+ friends</text>
<text class="t-mute sm" x="412.667" y="248">WORKING ASSUMPTION</text>
<text class="t-main bd" x="412.667" y="266">You can take part without being linked</text>
<text class="t-main bd" x="412.667" y="283">back to the everyday tier.</text>
<text class="t-main bd" x="412.667" y="300">The profile picture uses no photo</text>
<text class="t-main bd" x="412.667" y="317">family or colleagues can see</text>
<rect class="card-w1" x="769.333" y="94" width="282.667" height="254" rx="8"/>
<text class="t-main h2" x="783.333" y="118">Exploration tier</text>
<text class="t-mute sm" x="783.333" y="136">Short-lived, disposable</text>
<text class="t-mute sm" x="783.333" y="154">WHAT LIVES HERE</text>
<text class="t-main bd" x="783.333" y="172">Dating apps</text>
<text class="t-main bd" x="783.333" y="189">Anonymous communities</text>
<text class="t-main bd" x="783.333" y="206">Test accounts while exploring</text>
<text class="t-mute sm" x="783.333" y="231">WORKING ASSUMPTION</text>
<text class="t-main bd" x="783.333" y="249">The highest-risk tier. Keep it</text>
<text class="t-main bd" x="783.333" y="266">separate from the community tier as</text>
<text class="t-main bd" x="783.333" y="283">well: location and photos expose more</text>
<text class="t-main bd" x="783.333" y="300">here than anywhere else</text>
<path class="rule" d="M354.667 102 V340" stroke-dasharray="4 4"/>
<rect class="tag" x="317.667" y="209" width="74" height="22" rx="11"/>
<text class="t-tag" x="354.667" y="224" text-anchor="middle">no overlap</text>
<path class="rule" d="M725.333 102 V340" stroke-dasharray="4 4"/>
<rect class="tag" x="688.333" y="209" width="74" height="22" rx="11"/>
<text class="t-tag" x="725.333" y="224" text-anchor="middle">no overlap</text>
<rect class="card" x="28" y="362" width="1024" height="118" rx="8"/>
<text class="t-main h2" x="44" y="390">Four things each tier needs of its own</text>
<text class="t-mute bd" x="44" y="416">Its own email address (aliases can grow several public addresses out of one mailbox), its own browser profile, its own password manager vault, its</text>
<text class="t-mute bd" x="44" y="433">own two-factor group.</text>
<text class="t-mute bd" x="44" y="450">At sign-up, avoid the reverse matching platforms run on phone numbers and contact lists. Once an account exists, watch for reverse image search on</text>
<text class="t-mute bd" x="44" y="467">the avatar, reused usernames, posting times and writing style.</text>
<text class="t-foot" x="28" y="496">Not everyone needs three tiers. Start by keeping the everyday and community tiers apart, then decide later whether to split off an exploration tier.</text>
<text class="t-foot" x="28" y="518">This applies after coming out too. Protecting a partner or friends who have not, keeping a professional profile at work and controlling the pace</text>
<text class="t-foot" x="28" y="540">across platforms all rest on the same separation.</text>
</svg>
