<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 566" width="1080" height="566" role="img" aria-labelledby="title desc">
<title id="title">Three account tiers that share no identifier with each other</title>
<desc id="desc">Three side-by-side columns representing the everyday, community and exploration account tiers, separated by dashed lines marked as non-overlapping. The everyday tier is the identity you share with work, family and long-term friends, holding email, social media, banking and streaming, on the assumption that family or colleagues seeing it is fine. The community tier is the identity used with LGBTQ+ friends, community events and content about sexual orientation; it shares nothing with the everyday tier, so you can take part in the community without being linked back, and its profile picture uses no photo that appears anywhere family or colleagues can see. The exploration tier covers dating apps, anonymous communities and test accounts, the highest-risk and shortest-lived of the three. The bar at the top states the basis of the separation: no shared email, no shared username, no shared browser, no shared password manager folder. The bar at the bottom lists what each tier needs of its own: an email address, a browser profile, a password manager vault and a two-factor group.</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
