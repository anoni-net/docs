<rect class="card-c1" x="28" y="28" width="453" height="392" rx="8"/>
<text class="t-main h2" x="44" y="56">新加坡</text>
<text class="t-mute sm" x="44" y="78">以下是要对照检查的法条，并未穷尽所有可能适用的法律</text>
<text class="t-main bd" x="44" y="102">POFMA（防止网络假信息和网络操纵法令，2019）</text>
<text class="t-mute sm" x="44" y="121">部长可对「不实事实陈述」发出更正或下架指示。</text>
<text class="t-mute sm" x="44" y="138">多数发帖者遇到的是更正通知或内容被移除。</text>
<text class="t-mute sm" x="44" y="155">2026 年首度出现刑事指控，无视指示本身就构成犯罪。</text>
<text class="t-main bd" x="44" y="180">FICA（防止外来干预（对应措施）法令，2021）</text>
<text class="t-mute sm" x="44" y="199">针对有组织或有外国关联的政治行为者，</text>
<text class="t-mute sm" x="44" y="216">对跨境组织者的意义大于对单一则政治留言。</text>
<text class="t-main bd" x="44" y="241">诽谤与藐视法庭</text>
<text class="t-mute sm" x="44" y="260">民事与刑事诽谤，加上《司法（保护）法》的藐视法庭条款。</text>
<text class="t-mute sm" x="44" y="277">评论官员与进行中案件时的实际限制。</text>
<text class="t-main bd" x="44" y="302">《公共秩序法》的公开集会</text>
<text class="t-mute sm" x="44" y="321">对集会的定义宽松，可以涵盖线上动员。</text>
<text class="t-mute sm" x="44" y="338">曾有室内论坛因为线上直播被认定为非法集会。</text>
<rect class="card-w1" x="499" y="28" width="453" height="392" rx="8"/>
<text class="t-main h2" x="515" y="56">马来西亚</text>
<text class="t-mute sm" x="515" y="78">条文管得到转发与留言，不限于自己写的内容</text>
<text class="t-main bd" x="515" y="102">1998 年通信与多媒体法（CMA）第 233 条</text>
<text class="t-mute sm" x="515" y="121">对付网络言论最常被使用的条文。2025 年 2 月修法后，</text>
<text class="t-mute sm" x="515" y="138">罚金最高 RM500,000 或两年以下有期徒刑。</text>
<text class="t-mute sm" x="515" y="155">2026 年联邦法院要求检方证明真正的意图。</text>
<text class="t-main bd" x="515" y="180">1948 年煽动法</text>
<text class="t-mute sm" x="515" y="199">殖民时期留下的法律，至今仍然有效且持续被使用。</text>
<text class="t-mute sm" x="515" y="216">适用于 3R 议题：种族 race、宗教 religion、王室 royalty。</text>
<text class="t-main bd" x="515" y="241">SOSMA（2012 年安全罪行（特别措施）法）</text>
<text class="t-mute sm" x="515" y="260">为安全罪行提供特别程序，包含延长羁押。</text>
<text class="t-mute sm" x="515" y="277">适用对象是恐怖主义与国安犯罪，日常言论案件用不到。</text>
<text class="t-main bd" x="515" y="302">1966 年社团法</text>
<text class="t-mute sm" x="515" y="321">有成员、有干部、有持续活动的组织才可能落入其中。</text>
<text class="t-mute sm" x="515" y="338">一次性的 hashtag 不构成社团。</text>
<text class="t-main bd" x="515" y="363">各州的宗教执法</text>
<text class="t-mute sm" x="515" y="382">各州伊斯兰宗教机关执行只适用于穆斯林的 Syariah 罪行。</text>
<text class="t-mute sm" x="515" y="399">与煽动法的 3R 范围是两套不同的机制。</text>
<rect class="card-n" x="28" y="434" width="924" height="84" rx="8"/>
<text class="t-main h2" x="44" y="462">两国共同的实名底层</text>
<text class="t-main bd" x="44" y="488">新加坡的 Singpass、马来西亚的 MyKad 与 MyDigital ID 这类国家数字身份，加上两国都强制 SIM 卡实名。</text>
<text class="t-main bd" x="44" y="505">账号、设备与付款方式往往早就指向法律上的本名。在实名账号上换一个显示名称并不构成区隔，区隔要从一开始就建立。</text>
<rect class="card" x="28" y="532" width="924" height="101" rx="8"/>
<text class="t-main h2" x="44" y="560">风险随能见度与组织程度上升</text>
<text class="t-mute bd" x="44" y="586">低触及的帖子、爆红的帖子、有协调的行动，三者的风险层级不同。记录到的执法多半落在公众人物、行动者与组织者身上，或者落在传得很远的帖子上。</text>
<text class="t-mute bd" x="44" y="603">一般低能见度的帖子被追究的机率较低，机率低不等于安全，而且 2026 年的趋势是起诉变多。</text>
<text class="t-mute bd" x="44" y="620">人在海外不代表构不到。新加坡的外来干预框架与 POFMA 明文主张域外效力，马来西亚的条文也写得宽。</text>
<text class="t-foot" x="28" y="649">先确认自己碰到哪个题目、能见度多高，就知道哪一条法律会被引用，以及自己的暴露面有多大。</text>
<text class="t-foot" x="28" y="671">两国都强制 SIM 卡实名，要取得一组真正不指向任何人的号码与付款渠道很困难。实际的目标放在区隔与减少关联。</text>
</svg>
