<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 765" width="400" height="765" role="img" aria-labelledby="title">
<title id="title">三層防護各自對付一種對手，做完第一層就擋掉大部分的損失</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c3, .card-n, .card-no { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
  }
</style>

<rect class="card-c3" x="12" y="0" width="376" height="203" rx="8"/>
<text class="t-main lab" x="26" y="24">第一層</text>
<text class="t-main h2" x="26" y="44">詐騙與帳號入侵</text>
<text class="t-main bd" x="26" y="62">以自動化撒網為主，實際造成金錢損失的是這一種</text>
<text class="t-main lab" x="26" y="83">做什麼</text>
<text class="t-main bd" x="36" y="100">密碼管理器，每個網站不同密碼</text>
<text class="t-main bd" x="36" y="117">兩步驟驗證，能用強的就用強的</text>
<text class="t-main bd" x="36" y="134">系統與瀏覽器保持更新</text>
<text class="t-main bd" x="36" y="151">對急著要你處理的訊息，換一個管道確認</text>
<text class="t-main lab" x="26" y="172">要花多久</text>
<text class="t-main bd" x="36" y="189">約一小時。從 email 開始，接著是網銀與 LINE</text>
<rect class="card-c1" x="12" y="213" width="376" height="220" rx="8"/>
<text class="t-mute lab" x="26" y="237">第二層</text>
<text class="t-main h2" x="26" y="257">商業資料收集</text>
<text class="t-mute bd" x="26" y="275">平台、廣告商、資料掮客持續在做，不針對你個人</text>
<text class="t-main lab" x="26" y="296">做什麼</text>
<text class="t-mute bd" x="36" y="313">手機權限與廣告識別碼</text>
<text class="t-mute bd" x="36" y="330">全碟加密與開機密碼</text>
<text class="t-mute bd" x="36" y="347">日常通訊改用端對端加密</text>
<text class="t-mute bd" x="36" y="364">備份，以及還原得回來的驗證</text>
<text class="t-mute bd" x="36" y="381">帳號盤點</text>
<text class="t-main lab" x="26" y="402">要花多久</text>
<text class="t-mute bd" x="36" y="419">幾個晚上。一次做一項，不必一口氣做完</text>
<rect class="card-n" x="12" y="443" width="376" height="152" rx="8"/>
<text class="t-mute lab" x="26" y="467">第三層</text>
<text class="t-main h2" x="26" y="487">針對性調查</text>
<text class="t-mute bd" x="26" y="505">具備法律程序或技術資源，多數人不在名單上</text>
<text class="t-main lab" x="26" y="526">做什麼</text>
<text class="t-mute bd" x="36" y="543">觸發條件見文章的「什麼時候該把標準拉高」</text>
<text class="t-main lab" x="26" y="564">要花多久</text>
<text class="t-mute bd" x="36" y="581">視情境。換身分與換裝置改變的是幾個紀錄能不能被串起來</text>
<rect class="card-no" x="12" y="613" width="376" height="140" rx="8"/>
<text class="t-main h2" x="26" y="637">被高估的做法，各自有用途，常被誤當成防護主力</text>
<text class="t-mute bd" x="26" y="654">VPN 換掉誰看得到你的連線。無痕模式</text>
<text class="t-mute bd" x="26" y="671">清掉本機紀錄，平台與 ISP 照樣認得你。</text>
<text class="t-mute bd" x="26" y="688">定期換密碼已被 NIST 明文取消要求。換手機</text>
<text class="t-mute bd" x="26" y="705">號碼要先解綁舊帳號，舊號碼會被回收再配發。</text>
<text class="t-mute bd" x="26" y="722">貼鏡頭貼紙擋鏡頭有效，多數人擔心的是麥克風。刪掉</text>
<text class="t-mute bd" x="26" y="739">app 停止的是往後的收集，已經給出去的資料不會消失。</text>
</svg>
