<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 611" width="940" height="611" role="img" aria-labelledby="title desc">
<title id="title">三種收款管道各有取捨，捐款人依自己要躲的對象選通道</title>
<desc id="desc">上半部是組織方三種收款管道的對照。現金的匿名度高、合規負擔中、規模化低、不能跨境，適合活動現場與公開信箱的小額支持。加密貨幣的匿名度中至高、合規負擔高、規模化高、可以跨境，適合跨境捐款與需要規模的情境。預付禮物卡與超商代碼的匿名度中、合規負擔低、規模化中、限境內，適合門檻最低的境內小額。下半部是捐款人視角的四種威脅與對應通道。想躲家人或雇主看到金流的人走現金、預付卡或隱私幣，避開信用卡與共用銀行帳戶。想躲組織方留下身分紀錄的人走不留 email 的現金捐贈或隱私幣到自管錢包，避開銀行匯款因為戶名會留。想躲跨境監控的人走 Monero 或 Zcash 遮蔽交易，避開比特幣到中心化交易所。純粹個人偏好不留紀錄的人用任意現金管道即可，避開任何電子支付。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #607d8b; }
  .t-foot { fill: #546e7a; font-size: 13px; }
  .t-inv  { fill: #ffffff; }
  .h1 { font-size: 15px; font-weight: 700; }
  .h2 { font-size: 13.5px; font-weight: 700; }
  .bd { font-size: 12.5px; }
  .sm { font-size: 11.5px; }
  .card    { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-n  { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .rule    { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow   { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; }
  .tag     { fill: #eceff1; stroke: none; }
  .t-tag   { fill: #455a64; font-size: 11px; font-weight: 700; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #90a4ae; }
    .t-foot { fill: #b0bec5; }
    .t-inv  { fill: #241708; }
    .card    { fill: #23292e; stroke: #4b565e; }
    .card-n  { fill: #1c2226; stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .rule    { stroke: #46515a; }
    .arrow   { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .tag     { fill: #333c43; }
    .t-tag   { fill: #b0bec5; }
  }
</style>

<text class="t-main h2" x="28" y="40">組織方：三種收款管道的取捨</text>
<text class="t-mute sm" x="254" y="70" text-anchor="middle">匿名度</text>
<text class="t-mute sm" x="322" y="70" text-anchor="middle">合規負擔</text>
<text class="t-mute sm" x="390" y="70" text-anchor="middle">規模化</text>
<text class="t-mute sm" x="458" y="70" text-anchor="middle">跨境</text>
<text class="t-mute sm" x="508" y="70">適合什麼場合</text>
<path class="rule" d="M28 80 H912"/>
<rect class="card-c1" x="28" y="92" width="884" height="64" rx="8"/>
<text class="t-main h2" x="44" y="120">現金</text>
<text class="t-mute sm" x="44" y="138">公開信箱、活動現場</text>
<rect class="card-ok" x="228" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="254" y="120.5" text-anchor="middle">高</text>
<rect class="card-w1" x="296" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="322" y="120.5" text-anchor="middle">中</text>
<rect class="card-no" x="364" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="390" y="120.5" text-anchor="middle">低</text>
<rect class="card-no" x="432" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="458" y="120.5" text-anchor="middle">不行</text>
<text class="t-mute bd" x="508" y="119">境內小額支持，門檻最低的一條路。</text>
<text class="t-mute bd" x="508" y="136">公益勸募條例適用的情境多，先確認自己在不在裡面。</text>
<rect class="card-w1" x="28" y="166" width="884" height="64" rx="8"/>
<text class="t-main h2" x="44" y="194">加密貨幣</text>
<text class="t-mute sm" x="44" y="212">自管錢包或託管平台</text>
<rect class="card-ok" x="228" y="180" width="52" height="20" rx="10"/>
<text class="t-main sm" x="254" y="194.5" text-anchor="middle">中至高</text>
<rect class="card-no" x="296" y="180" width="52" height="20" rx="10"/>
<text class="t-main sm" x="322" y="194.5" text-anchor="middle">高</text>
<rect class="card-ok" x="364" y="180" width="52" height="20" rx="10"/>
<text class="t-main sm" x="390" y="194.5" text-anchor="middle">高</text>
<rect class="card-ok" x="432" y="180" width="52" height="20" rx="10"/>
<text class="t-main sm" x="458" y="194.5" text-anchor="middle">行</text>
<text class="t-mute bd" x="508" y="193">跨境支持境外組織。</text>
<text class="t-mute bd" x="508" y="210">VASP、洗錢防制與稅務的負擔明顯高一截，換匯與會計要先排好。</text>
<rect class="card-n" x="28" y="240" width="884" height="81" rx="8"/>
<text class="t-main h2" x="44" y="268">預付卡與代碼</text>
<text class="t-mute sm" x="44" y="286">預付禮物卡、超商代碼</text>
<rect class="card-w1" x="228" y="254" width="52" height="20" rx="10"/>
<text class="t-main sm" x="254" y="268.5" text-anchor="middle">中</text>
<rect class="card-ok" x="296" y="254" width="52" height="20" rx="10"/>
<text class="t-main sm" x="322" y="268.5" text-anchor="middle">低</text>
<rect class="card-w1" x="364" y="254" width="52" height="20" rx="10"/>
<text class="t-main sm" x="390" y="268.5" text-anchor="middle">中</text>
<rect class="card-w1" x="432" y="254" width="52" height="20" rx="10"/>
<text class="t-main sm" x="458" y="268.5" text-anchor="middle">限境內</text>
<text class="t-mute bd" x="508" y="267">境內小額，捐款人不必碰加密貨幣。</text>
<text class="t-mute bd" x="508" y="284">多數捐款人走到「取得隱私幣」那一步就放棄，這條路補的是那個缺口</text>
<text class="t-mute bd" x="508" y="301">。</text>
<text class="t-main h2" x="28" y="351">捐款人：先問要躲的是誰，再選通道</text>
<rect class="card" x="28" y="365" width="434" height="84" rx="8"/>
<text class="t-main h2" x="44" y="393">想躲家人或雇主看到金流</text>
<text class="t-mute bd" x="44" y="417">走：現金、預付卡、隱私幣</text>
<text class="t-mute bd" x="44" y="434">避開：信用卡、共用銀行帳戶</text>
<rect class="card" x="478" y="365" width="434" height="84" rx="8"/>
<text class="t-main h2" x="494" y="393">想躲組織方留下身分紀錄</text>
<text class="t-mute bd" x="494" y="417">走：不留 email 的現金捐贈、隱私幣到自管錢包</text>
<text class="t-mute bd" x="494" y="434">避開：銀行匯款，戶名會留在對方的帳上</text>
<rect class="card" x="28" y="463" width="434" height="84" rx="8"/>
<text class="t-main h2" x="44" y="491">想躲跨境監控</text>
<text class="t-mute bd" x="44" y="515">走：Monero、Zcash 遮蔽交易</text>
<text class="t-mute bd" x="44" y="532">避開：比特幣到中心化交易所</text>
<rect class="card" x="478" y="463" width="434" height="84" rx="8"/>
<text class="t-main h2" x="494" y="491">純粹個人偏好不留紀錄</text>
<text class="t-mute bd" x="494" y="515">走：任意現金管道</text>
<text class="t-mute bd" x="494" y="532">避開：任何電子支付</text>
<text class="t-foot" x="28" y="563">沒有「最匿名」的單一選項。多數組織會混搭：日常用現金與預付卡、跨境用加密貨幣、列名捐款人走銀行轉帳。</text>
<text class="t-foot" x="28" y="585">組織方準備兩條路，讓想匿名的人有路可走，同時想列名的人也能正常列名。強迫所有人走同一條，兩邊都照顧不到。</text>
</svg>
