  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #90a4ae; }
    .t-foot { fill: #b0bec5; }
    .t-inv  { fill: #241708; }
    .card    { fill: #23292e; stroke: #4b565e; }
    .card-n  { fill: #1c2226; stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .rule    { stroke: #46515a; }
    .arrow   { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .tag     { fill: #333c43; }
    .t-tag   { fill: #b0bec5; }
  }
</style>

<text class="t-main h2" x="28" y="40">組織方：三種收款管道的取捨</text>
<text class="t-mute sm" x="304" y="70" text-anchor="middle">匿名度</text>
<text class="t-mute sm" x="424" y="70" text-anchor="middle">合規負擔</text>
<text class="t-mute sm" x="544" y="70" text-anchor="middle">規模化</text>
<text class="t-mute sm" x="654" y="70" text-anchor="middle">跨境</text>
<text class="t-mute sm" x="748" y="70">適合什麼場合</text>
<path class="rule" d="M28 80 H1132"/>
<rect class="card-c1" x="28" y="92" width="1104" height="81" rx="8"/>
<text class="t-main h2" x="44" y="120">現金</text>
<text class="t-mute sm" x="44" y="139">公開信箱、活動現場</text>
<rect class="card-ok" x="278" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="304" y="120.5" text-anchor="middle">高</text>
<rect class="card-w1" x="398" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="424" y="120.5" text-anchor="middle">中</text>
<rect class="card-no" x="518" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="544" y="120.5" text-anchor="middle">低</text>
<rect class="card-no" x="628" y="106" width="52" height="20" rx="10"/>
<text class="t-main sm" x="654" y="120.5" text-anchor="middle">不行</text>
<text class="t-mute bd" x="748" y="119">境內小額支持，門檻最低的一條路。</text>
<text class="t-mute bd" x="748" y="136">公益勸募條例適用的情境多，</text>
<text class="t-mute bd" x="748" y="153">先確認自己在不在裡面。</text>
<rect class="card-w1" x="28" y="183" width="1104" height="81" rx="8"/>
<text class="t-main h2" x="44" y="211">加密貨幣</text>
<text class="t-mute sm" x="44" y="230">自管錢包或託管平台</text>
<rect class="card-ok" x="278" y="197" width="52" height="20" rx="10"/>
<text class="t-main sm" x="304" y="211.5" text-anchor="middle">中至高</text>
<rect class="card-no" x="398" y="197" width="52" height="20" rx="10"/>
<text class="t-main sm" x="424" y="211.5" text-anchor="middle">高</text>
<rect class="card-ok" x="518" y="197" width="52" height="20" rx="10"/>
<text class="t-main sm" x="544" y="211.5" text-anchor="middle">高</text>
<rect class="card-ok" x="628" y="197" width="52" height="20" rx="10"/>
<text class="t-main sm" x="654" y="211.5" text-anchor="middle">行</text>
<text class="t-mute bd" x="748" y="210">跨境支持境外組織。</text>
<text class="t-mute bd" x="748" y="227">VASP、洗錢防制與稅務的負擔明顯高一截，</text>
<text class="t-mute bd" x="748" y="244">換匯與會計要先排好。</text>
<rect class="card-n" x="28" y="274" width="1104" height="81" rx="8"/>
<text class="t-main h2" x="44" y="302">預付卡與代碼</text>
<text class="t-mute sm" x="44" y="321">預付禮物卡、超商代碼</text>
<rect class="card-w1" x="278" y="288" width="52" height="20" rx="10"/>
<text class="t-main sm" x="304" y="302.5" text-anchor="middle">中</text>
<rect class="card-ok" x="398" y="288" width="52" height="20" rx="10"/>
<text class="t-main sm" x="424" y="302.5" text-anchor="middle">低</text>
<rect class="card-w1" x="518" y="288" width="52" height="20" rx="10"/>
<text class="t-main sm" x="544" y="302.5" text-anchor="middle">中</text>
<rect class="card-w1" x="628" y="288" width="52" height="20" rx="10"/>
<text class="t-main sm" x="654" y="302.5" text-anchor="middle">限境內</text>
<text class="t-mute bd" x="748" y="301">境內小額，捐款人不必碰加密貨幣。</text>
<text class="t-mute bd" x="748" y="318">多數捐款人走到「取得隱私幣」那一步就放棄，</text>
<text class="t-mute bd" x="748" y="335">這條路補的是那個缺口。</text>
<text class="t-main h2" x="28" y="385">捐款人：先問要躲的是誰，再選通道</text>
<rect class="card" x="28" y="399" width="544" height="84" rx="8"/>
<text class="t-main h2" x="44" y="427">想躲家人或雇主看到金流</text>
<text class="t-mute bd" x="44" y="451">走：現金、預付卡、隱私幣</text>
<text class="t-mute bd" x="44" y="468">避開：信用卡、共用銀行帳戶</text>
<rect class="card" x="588" y="399" width="544" height="84" rx="8"/>
<text class="t-main h2" x="604" y="427">想躲組織方留下身分紀錄</text>
<text class="t-mute bd" x="604" y="451">走：不留 email 的現金捐贈、隱私幣到自管錢包</text>
<text class="t-mute bd" x="604" y="468">避開：銀行匯款，戶名會留在對方的帳上</text>
<rect class="card" x="28" y="497" width="544" height="84" rx="8"/>
<text class="t-main h2" x="44" y="525">想躲跨境監控</text>
<text class="t-mute bd" x="44" y="549">走：Monero、Zcash 遮蔽交易</text>
<text class="t-mute bd" x="44" y="566">避開：比特幣到中心化交易所</text>
<rect class="card" x="588" y="497" width="544" height="84" rx="8"/>
<text class="t-main h2" x="604" y="525">純粹個人偏好不留紀錄</text>
<text class="t-mute bd" x="604" y="549">走：任意現金管道</text>
<text class="t-mute bd" x="604" y="566">避開：任何電子支付</text>
<text class="t-foot" x="28" y="597">沒有「最匿名」的單一選項。多數組織會混搭：日常用現金與預付卡、跨境用加密貨幣、列名捐款人走銀行轉帳。</text>
<text class="t-foot" x="28" y="619">組織方準備兩條路，讓想匿名的人有路可走，同時想列名的人也能正常列名。強迫所有人走同一條，兩邊都照顧不到。</text>
</svg>
