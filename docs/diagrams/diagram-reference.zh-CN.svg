<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1094" width="400" height="1094" role="img" aria-labelledby="title desc">
<title id="title">示意图版型范本</title>
<desc id="desc">把每个版型元件与每个色票 token 各用一次的参考图。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; stroke: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .arrow { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="93" rx="8"/>
<text class="t-mute lab" x="26" y="24">eyebrow，小标，t-mute</text>
<text class="t-main h2" x="26" y="44">title，卡片标题，h2 14px 粗体</text>
<text class="t-mute bd" x="26" y="62">sub，副标，bd 13px</text>
<text class="t-mute bd" x="26" y="79">lines，一段说明文字。折行交给版面算，不要手写断行。</text>
<rect class="card-n" x="12" y="103" width="376" height="100" rx="8"/>
<text class="t-main h2" x="26" y="127">chips，两栏标签，标签自带名称与值</text>
<rect class="card-ok" x="26" y="137" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="154" text-anchor="middle">良好 ok</text>
<rect class="card-w1" x="204" y="137" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="154" text-anchor="middle">中等 w1</text>
<rect class="card-no" x="26" y="165" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="182" text-anchor="middle">警示 no</text>
<rect class="card-n" x="204" y="165" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="182" text-anchor="middle">中性 n</text>
<rect class="card" x="12" y="213" width="376" height="131" rx="8"/>
<text class="t-main h2" x="26" y="237">blocks，有小标的分段</text>
<text class="t-main lab" x="26" y="258">第一段</text>
<text class="t-mute bd" x="36" y="275">一个项目一行</text>
<text class="t-mute bd" x="36" y="292">第二个项目</text>
<text class="t-main lab" x="26" y="313">第二段</text>
<text class="t-mute bd" x="36" y="330">小标用 lab 13px 粗体，内容缩进 10px</text>
<text class="t-main h1" x="12" y="380">h，分节标题加一条分隔线</text>
<path class="rule" d="M12 390 H388"/>
<rect class="card-n" x="12" y="402" width="376" height="228" rx="8"/>
<text class="t-main h2" x="26" y="426">chain，上下流程</text>
<rect class="card" x="26" y="432" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="452">起点</text>
<text class="t-main bd" x="38" y="470">节点的副标</text>
<path class="arrow" d="M200 480 V492"/>
<path class="arrow-h" d="M196 491 L204 491 L200 498 Z"/>
<rect class="card-c3" x="26" y="498" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="518">中继</text>
<text class="t-main bd" x="38" y="536">需要强调的节点换色</text>
<path class="arrow" d="M200 546 V558"/>
<path class="arrow-h" d="M196 557 L204 557 L200 564 Z"/>
<rect class="card" x="26" y="564" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="584">终点</text>
<text class="t-main bd" x="38" y="602">连接线居中在画布中线</text>
<text class="t-main h1" x="12" y="666">三阶分层，由浅到深</text>
<path class="rule" d="M12 676 H388"/>
<rect class="card-c1" x="12" y="688" width="376" height="58" rx="8"/>
<text class="t-mute lab" x="26" y="712">card-c1</text>
<text class="t-main h2" x="26" y="732">最浅，第一层</text>
<rect class="card-c2" x="12" y="754" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="778">card-c2</text>
<text class="t-main h2" x="26" y="798">中间层</text>
<rect class="card-c3" x="12" y="820" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="844">card-c3</text>
<text class="t-main h2" x="26" y="864">最深，顶层</text>
<rect class="card-w1" x="12" y="892" width="376" height="58" rx="8"/>
<text class="t-mute lab" x="26" y="916">card-w1</text>
<text class="t-main h2" x="26" y="936">最浅，警示或成本递增</text>
<rect class="card-w2" x="12" y="958" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="982">card-w2</text>
<text class="t-main h2" x="26" y="1002">中间层</text>
<rect class="card-w3" x="12" y="1024" width="376" height="58" rx="8"/>
<text class="t-onfill lab" x="26" y="1048">card-w3</text>
<text class="t-onfill h2" x="26" y="1068">最深，饱和底，文字用 t-onfill</text>
</svg>
