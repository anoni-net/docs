<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" width="1000" height="512" role="img" aria-labelledby="title desc">
<title id="title">Each measured trait removes another batch of people who still look like you</title>
<desc id="desc">A funnel narrowing from top to bottom in six steps. The widest step at the top is everyone. Each step down adds one browser fingerprinting trait and the crowd shrinks: adding time zone leaves everyone in your time zone, adding language and operating system still leaves a lot of people, adding screen and window size makes the range noticeably narrower, adding graphics hardware leaves not many, and adding the full font list often leaves only you. The step widths are illustrative rather than measured. A note below records that EFF's 2010 Panopticlick study collected 470,161 browser samples, of which 83.6% had a unique fingerprint.</desc>
<style>
  /* Colours follow the palette in community/brand-assets.md. This file is a standalone
     SVG pulled in by an img tag, so it cannot reach the page CSS variables and the hex
     values have to be literal. Orange marks what is exposed and cyan what is protected,
     matching the other diagrams on the site. */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .step { stroke: none; }
  .s1 { fill: #e6f4fb; }
  .s2 { fill: #cfeaf7; }
  .s3 { fill: #b3e3ff; }
  .s4 { fill: #80d1ff; }
  .s5 { fill: #4dbfff; }
  .s6 { fill: #ef6c00; }
  .link { stroke: #b0bec5; stroke-width: 1; opacity: .5; }
  .crowd { fill: #212121; font-size: 16px; font-weight: 600; }
  .crowd-last { fill: #ffffff; font-size: 16px; font-weight: 700; }
  .feature { fill: #212121; font-size: 14px; }
  .feature-hi { fill: #ef6c00; font-size: 14px; font-weight: 600; }
  .head { fill: #546e7a; font-size: 13px; font-weight: 600; }
  .foot { fill: #546e7a; font-size: 13px; }
  .foot-note { fill: #90a4ae; font-size: 12px; }

  @media (prefers-color-scheme: dark) {
    .s1 { fill: #16323d; }
    .s2 { fill: #1b4557; }
    .s3 { fill: #1f5872; }
    .s4 { fill: #216d8f; }
    .s5 { fill: #2489b4; }
    .s6 { fill: #ff8c1a; }
    .link { stroke: #4b565e; }
    .crowd { fill: #eceff1; }
    .crowd-last { fill: #241708; }
    .feature { fill: #eceff1; }
    .feature-hi { fill: #ffb74d; }
    .head { fill: #b0bec5; }
    .foot { fill: #b0bec5; }
    .foot-note { fill: #78909c; }
  }
</style>

<text class="head" x="236" y="44" text-anchor="end">Traits measured</text>
<text class="head" x="620" y="44" text-anchor="middle">People who still look like you</text>

<line class="link" x1="270" y1="112" x2="330" y2="122"/>
<line class="link" x1="970" y1="112" x2="910" y2="122"/>
<line class="link" x1="330" y1="174" x2="390" y2="184"/>
<line class="link" x1="910" y1="174" x2="850" y2="184"/>
<line class="link" x1="390" y1="236" x2="450" y2="246"/>
<line class="link" x1="850" y1="236" x2="790" y2="246"/>
<line class="link" x1="450" y1="298" x2="505" y2="308"/>
<line class="link" x1="790" y1="298" x2="735" y2="308"/>
<line class="link" x1="505" y1="360" x2="550" y2="370"/>
<line class="link" x1="735" y1="360" x2="690" y2="370"/>

<rect class="step s1" x="270" y="60"  width="700" height="52" rx="6"/>
<text class="crowd" x="620" y="92" text-anchor="middle">Everyone</text>
<text class="feature" x="236" y="92" text-anchor="end">Nothing measured yet</text>

<rect class="step s2" x="330" y="122" width="580" height="52" rx="6"/>
<text class="crowd" x="620" y="154" text-anchor="middle">Everyone in your time zone</text>
<text class="feature" x="236" y="154" text-anchor="end">Add time zone</text>

<rect class="step s3" x="390" y="184" width="460" height="52" rx="6"/>
<text class="crowd" x="620" y="216" text-anchor="middle">Still a lot of people</text>
<text class="feature" x="236" y="216" text-anchor="end">Add language and OS</text>

<rect class="step s4" x="450" y="246" width="340" height="52" rx="6"/>
<text class="crowd" x="620" y="278" text-anchor="middle">Noticeably narrower</text>
<text class="feature" x="236" y="278" text-anchor="end">Add screen and window size</text>

<rect class="step s5" x="505" y="308" width="230" height="52" rx="6"/>
<text class="crowd" x="620" y="340" text-anchor="middle">Not many left</text>
<text class="feature" x="236" y="340" text-anchor="end">Add graphics hardware</text>

<rect class="step s6" x="550" y="370" width="140" height="52" rx="6"/>
<text class="crowd-last" x="620" y="402" text-anchor="middle">You</text>
<text class="feature-hi" x="236" y="402" text-anchor="end">Add the full font list</text>

<text class="foot" x="30" y="458">No single trait identifies you. Together they do. This is also why there is no button to clear a fingerprint: nothing was ever stored.</text>
<text class="foot-note" x="30" y="482">Step widths are illustrative, not measured. EFF's 2010 Panopticlick study collected 470,161 browser samples, of which 83.6% had a unique fingerprint.</text>
</svg>
