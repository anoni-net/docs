<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 741" width="940" height="741" role="img" aria-labelledby="title desc">
<title id="title">Three layers, each aimed at a different adversary</title>
<desc id="desc">Three stacked bands running from dark to light, representing the three layers of everyday digital preparation, each aimed at a different adversary. Layer one addresses fraud and account takeover, the kind that actually costs people money: a password manager with a different password per site, two-factor authentication using the strongest method available, keeping the system and browser updated, and switching channel to confirm any message that pushes you to act quickly. It takes about an hour, starting with email, then banking and messaging accounts. Layer two addresses commercial data collection by platforms, advertisers and data brokers: phone permissions and the advertising identifier, full-disk encryption with a boot password, end-to-end encrypted messaging, backups that you have tested restoring, and an account inventory. Layer three addresses targeted investigation and is only needed in specific situations. The red box below lists six overrated measures: VPNs, private browsing, scheduled password changes, changing your phone number, camera stickers and deleting apps, each of which has a real use but is often mistaken for the main line of defence.</desc>
