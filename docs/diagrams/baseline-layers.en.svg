<text class="t-mute sm" x="218" y="40">ADVERSARY IT ADDRESSES</text>
<text class="t-mute sm" x="428" y="40">WHAT TO DO</text>
<text class="t-mute sm" x="728" y="40">HOW LONG</text>
<path class="rule" d="M28 50 H912"/>
<rect class="card-c3" x="28" y="62" width="884" height="151" rx="8"/>
<text class="t-main h2" x="44" y="88">Layer 1</text>
<text class="t-main bd" x="218" y="88">Fraud and account takeover</text>
<text class="t-main bd" x="218" y="105">Mostly automated and</text>
<text class="t-main bd" x="218" y="122">untargeted. This is the one</text>
<text class="t-main bd" x="218" y="139">that costs people money.</text>
<text class="t-main bd" x="428" y="88">A password manager, a different password</text>
<text class="t-main bd" x="428" y="105">per site</text>
<text class="t-main bd" x="428" y="122">Two-factor authentication, the strongest</text>
<text class="t-main bd" x="428" y="139">method available</text>
<text class="t-main bd" x="428" y="156">Keep the system and browser updated</text>
<text class="t-main bd" x="428" y="173">Switch channel to confirm any message that</text>
<text class="t-main bd" x="428" y="190">rushes you</text>
<text class="t-main bd" x="728" y="88">About an hour</text>
<text class="t-main bd" x="728" y="105">Start with email, then</text>
<text class="t-main bd" x="728" y="122">banking and messaging</text>
<rect class="card-c1" x="28" y="223" width="884" height="168" rx="8"/>
<text class="t-main h2" x="44" y="249">Layer 2</text>
<text class="t-main bd" x="218" y="249">Commercial data collection</text>
<text class="t-main bd" x="218" y="266">Platforms, advertisers and</text>
<text class="t-main bd" x="218" y="283">data brokers, running</text>
<text class="t-main bd" x="218" y="300">continuously and not aimed at</text>
<text class="t-main bd" x="218" y="317">you personally.</text>
<text class="t-mute bd" x="428" y="249">Phone permissions and the advertising</text>
<text class="t-mute bd" x="428" y="266">identifier</text>
<text class="t-mute bd" x="428" y="283">Full-disk encryption and a boot password</text>
<text class="t-mute bd" x="428" y="300">End-to-end encryption for everyday</text>
<text class="t-mute bd" x="428" y="317">messaging</text>
<text class="t-mute bd" x="428" y="334">Backups, and a restore you have actually</text>
<text class="t-mute bd" x="428" y="351">tested</text>
<text class="t-mute bd" x="428" y="368">An account inventory</text>
<text class="t-mute bd" x="728" y="249">A few evenings</text>
<text class="t-mute bd" x="728" y="266">One item at a time, no</text>
<text class="t-mute bd" x="728" y="283">need to finish it in one</text>
<text class="t-mute bd" x="728" y="300">sitting</text>
<rect class="card-n" x="28" y="401" width="884" height="117" rx="8"/>
<text class="t-main h2" x="44" y="427">Layer 3</text>
<text class="t-main bd" x="218" y="427">Targeted investigation</text>
<text class="t-main bd" x="218" y="444">Backed by legal process or</text>
<text class="t-main bd" x="218" y="461">technical resources. Most</text>
<text class="t-main bd" x="218" y="478">people are not on that list.</text>
<text class="t-mute bd" x="428" y="427">See the section on when to raise your</text>
<text class="t-mute bd" x="428" y="444">standard for what triggers this layer</text>
<text class="t-mute bd" x="728" y="427">Depends</text>
<text class="t-mute bd" x="728" y="444">Changing identity or</text>
<text class="t-mute bd" x="728" y="461">device changes which</text>
<text class="t-mute bd" x="728" y="478">records can be linked,</text>
<text class="t-mute bd" x="728" y="495">nothing more</text>
<rect class="card-no" x="28" y="538" width="884" height="135" rx="8"/>
<text class="t-main h2" x="44" y="566">Overrated measures: each has a use, none is the main line of defence</text>
<text class="t-mute bd" x="44" y="592">A VPN changes who can see your connection. Private browsing clears local traces while platforms and your ISP still recognise</text>
<text class="t-mute bd" x="44" y="609">you.</text>
<text class="t-mute bd" x="44" y="626">NIST no longer asks for scheduled password changes. A recycled phone number gets reassigned, so unlink the old accounts first.</text>
<text class="t-mute bd" x="44" y="643">A camera sticker works on the camera, while most people are worried about the microphone. Deleting an app stops future</text>
<text class="t-mute bd" x="44" y="660">collection only.</text>
<text class="t-foot" x="28" y="693">Put all your effort into the third adversary and the losses from the second still happen. The reverse holds too.</text>
<text class="t-foot" x="28" y="715">You do not have to finish all three at once. Layer one alone removes most of the loss from account takeover and fraud.</text>
</svg>
