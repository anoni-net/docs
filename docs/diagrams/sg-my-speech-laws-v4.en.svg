<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1826" width="400" height="1826" role="img" aria-labelledby="title">
<title id="title">Singapore and Malaysia each have a named set of statutes, and a real-name layer that defeats pseudonyms</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card, .card-c1, .card-n, .card-no, .card-w1 { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<text class="t-main h1" x="12" y="22">Singapore</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-n" x="12" y="44" width="376" height="55" rx="8"/>
<text class="t-mute bd" x="26" y="68">Statutes to check against.</text>
<text class="t-mute bd" x="26" y="85">This list is not exhaustive.</text>
<rect class="card-c1" x="12" y="109" width="376" height="142" rx="8"/>
<text class="t-main h2" x="26" y="133">POFMA, Protection from Online</text>
<text class="t-main h2" x="26" y="152">Falsehoods and Manipulation Act, 2019</text>
<text class="t-mute bd" x="26" y="169">A minister can order a correction or takedown</text>
<text class="t-mute bd" x="26" y="186">of a false statement of fact. Most posters</text>
<text class="t-mute bd" x="26" y="203">meet it as a correction notice or a removal.</text>
<text class="t-mute bd" x="26" y="220">2026 brought the first criminal charges.</text>
<text class="t-mute bd" x="26" y="237">Ignoring a direction is itself an offence.</text>
<rect class="card-c1" x="12" y="261" width="376" height="108" rx="8"/>
<text class="t-main h2" x="26" y="285">FICA, Foreign Interference</text>
<text class="t-main h2" x="26" y="304">(Countermeasures) Act, 2021</text>
<text class="t-mute bd" x="26" y="321">Aimed at organised or foreign-linked political</text>
<text class="t-mute bd" x="26" y="338">actors. It matters more to cross-border</text>
<text class="t-mute bd" x="26" y="355">organisers than to a single political comment.</text>
<rect class="card-c1" x="12" y="379" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="403">Defamation and contempt of court</text>
<text class="t-mute bd" x="26" y="420">Civil and criminal defamation, plus the</text>
<text class="t-mute bd" x="26" y="437">contempt provisions of the Administration</text>
<text class="t-mute bd" x="26" y="454">of Justice (Protection) Act.</text>
<text class="t-mute bd" x="26" y="471">The practical limit on commenting</text>
<text class="t-mute bd" x="26" y="488">about officials and live cases.</text>
<rect class="card-c1" x="12" y="512" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="536">Public assembly under the Public Order Act</text>
<text class="t-mute bd" x="26" y="553">The definition of assembly is broad</text>
<text class="t-mute bd" x="26" y="570">enough to cover online mobilisation.</text>
<text class="t-mute bd" x="26" y="587">An indoor forum has been treated as an</text>
<text class="t-mute bd" x="26" y="604">illegal assembly because it was streamed.</text>
<text class="t-main h1" x="12" y="658">Malaysia</text>
<path class="rule" d="M12 668 H388"/>
<rect class="card-n" x="12" y="680" width="376" height="55" rx="8"/>
<text class="t-mute bd" x="26" y="704">The provisions reach shares and comments,</text>
<text class="t-mute bd" x="26" y="721">not only what you wrote yourself.</text>
<rect class="card-w1" x="12" y="745" width="376" height="159" rx="8"/>
<text class="t-main h2" x="26" y="769">Section 233, Communications</text>
<text class="t-main h2" x="26" y="788">and Multimedia Act 1998</text>
<text class="t-mute bd" x="26" y="805">The provision used most often against</text>
<text class="t-mute bd" x="26" y="822">online speech. After the February</text>
<text class="t-mute bd" x="26" y="839">2025 amendment, penalties reach RM500,</text>
<text class="t-mute bd" x="26" y="856">000 or two years' imprisonment.</text>
<text class="t-mute bd" x="26" y="873">In 2026 the Federal Court required</text>
<text class="t-mute bd" x="26" y="890">prosecutors to prove genuine intent.</text>
<rect class="card-w1" x="12" y="914" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="938">Sedition Act 1948</text>
<text class="t-mute bd" x="26" y="955">A colonial-era law still</text>
<text class="t-mute bd" x="26" y="972">in force and still in use.</text>
<text class="t-mute bd" x="26" y="989">It applies to the 3R subjects:</text>
<text class="t-mute bd" x="26" y="1006">race, religion and royalty.</text>
<rect class="card-w1" x="12" y="1030" width="376" height="125" rx="8"/>
<text class="t-main h2" x="26" y="1054">SOSMA, Security Offences (</text>
<text class="t-main h2" x="26" y="1073">Special Measures) Act 2012</text>
<text class="t-mute bd" x="26" y="1090">Special procedure for security offences,</text>
<text class="t-mute bd" x="26" y="1107">including extended detention.</text>
<text class="t-mute bd" x="26" y="1124">Aimed at terrorism and national</text>
<text class="t-mute bd" x="26" y="1141">security, not everyday speech cases.</text>
<rect class="card-w1" x="12" y="1165" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="1189">Societies Act 1966</text>
<text class="t-mute bd" x="26" y="1206">Reaches groups with members, officers</text>
<text class="t-mute bd" x="26" y="1223">and continuing activity. A one-off</text>
<text class="t-mute bd" x="26" y="1240">hashtag does not constitute a society.</text>
<rect class="card-w1" x="12" y="1264" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="1288">State religious enforcement</text>
<text class="t-mute bd" x="26" y="1305">State Islamic authorities enforce Syariah</text>
<text class="t-mute bd" x="26" y="1322">offences that apply to Muslims only.</text>
<text class="t-mute bd" x="26" y="1339">A separate mechanism from the Sedition</text>
<text class="t-mute bd" x="26" y="1356">Act's 3R scope, not an overlap.</text>
<rect class="card" x="12" y="1388" width="376" height="174" rx="8"/>
<text class="t-main h2" x="26" y="1412">The real-name layer both countries share</text>
<text class="t-mute bd" x="26" y="1429">National digital identity such as Singpass in</text>
<text class="t-mute bd" x="26" y="1446">Singapore and MyKad and MyDigital ID in Malaysia,</text>
<text class="t-mute bd" x="26" y="1463">plus mandatory SIM registration in both.</text>
<text class="t-mute bd" x="26" y="1480">Accounts, devices and payment methods</text>
<text class="t-mute bd" x="26" y="1497">usually already point at a legal name.</text>
<text class="t-mute bd" x="26" y="1514">Changing the display name on a real-name</text>
<text class="t-mute bd" x="26" y="1531">account is not separation. Separation</text>
<text class="t-mute bd" x="26" y="1548">has to be built from the start.</text>
<rect class="card-no" x="12" y="1572" width="376" height="242" rx="8"/>
<text class="t-main h2" x="26" y="1596">Risk rises with visibility and organisation</text>
<text class="t-mute bd" x="26" y="1613">A low-reach post, a viral post and a</text>
<text class="t-mute bd" x="26" y="1630">coordinated action sit at different levels.</text>
<text class="t-mute bd" x="26" y="1647">Recorded enforcement lands mostly on public</text>
<text class="t-mute bd" x="26" y="1664">figures, activists and organisers, or on</text>
<text class="t-mute bd" x="26" y="1681">posts that travelled a long way.</text>
<text class="t-mute bd" x="26" y="1698">An ordinary low-visibility post is less</text>
<text class="t-mute bd" x="26" y="1715">likely to be pursued. Less likely is not safe,</text>
<text class="t-mute bd" x="26" y="1732">and the 2026 trend is more prosecutions.</text>
<text class="t-mute bd" x="26" y="1749">Being abroad does not put you out of reach.</text>
<text class="t-mute bd" x="26" y="1766">Singapore's foreign interference framework</text>
<text class="t-mute bd" x="26" y="1783">and POFMA assert extraterritorial effect, and</text>
<text class="t-mute bd" x="26" y="1800">the Malaysian provisions are drafted broadly.</text>
</svg>
