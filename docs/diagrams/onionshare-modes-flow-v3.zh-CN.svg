<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1302" width="400" height="1302" role="img" aria-labelledby="title desc">
<title id="title">OnionShare 四种模式的数据往哪个方向走</title>
<desc id="desc">四种模式的数据流向对照。Send 是你的电脑放文件，对方用 Tor Browser 下载，数据由你流向对方。Receive 是你开一个上传界面，投件人上传，数据由对方流向你。Host a Website 是你放一份静态网站，多位访客浏览，数据由你流向多人。Chat 是双向的即时对话，所有人都连进同一个一次性聊天室。四种模式共通的是中间那个 .onion 网址，关掉 OnionShare 网址就失效。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; stroke: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .arrow { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="24">四种模式共通的是中间那一段</text>
<text class="t-mute bd" x="26" y="41">文件与消息直接在两端之间走 Tor，没有经过</text>
<text class="t-mute bd" x="26" y="58">任何云服务，关掉 OnionShare 网址立刻失效。</text>
<text class="t-mute bd" x="26" y="75">网址本身要另外用安全渠道交给对方，OnionShare 不</text>
<text class="t-mute bd" x="26" y="92">负责配送。用不安全的渠道传网址，那一段就不再匿名。</text>
<rect class="card-c1" x="12" y="120" width="376" height="285" rx="8"/>
<text class="t-main lab" x="26" y="144">Send</text>
<text class="t-main h2" x="26" y="164">送档</text>
<rect class="card" x="26" y="170" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="190">你的电脑</text>
<text class="t-main bd" x="38" y="208">把文件丢进去</text>
<path class="arrow" d="M200 218 V230"/>
<path class="arrow-h" d="M196 229 L204 229 L200 236 Z"/>
<rect class="card-c3" x="26" y="236" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="256">.onion 网址</text>
<path class="arrow" d="M200 266 V278"/>
<path class="arrow-h" d="M196 277 L204 277 L200 284 Z"/>
<rect class="card" x="26" y="284" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="304">对方</text>
<text class="t-main bd" x="38" y="322">用 Tor Browser 下载</text>
<text class="t-main lab" x="26" y="357">用在哪</text>
<text class="t-mute bd" x="36" y="374">把证据送给律师</text>
<text class="t-mute bd" x="36" y="391">一次性的文件交付</text>
<rect class="card-w1" x="12" y="415" width="376" height="285" rx="8"/>
<text class="t-main lab" x="26" y="439">Receive</text>
<text class="t-main h2" x="26" y="459">收档</text>
<rect class="card" x="26" y="465" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="485">投件人</text>
<text class="t-main bd" x="38" y="503">用 Tor Browser 上传</text>
<path class="arrow" d="M200 513 V525"/>
<path class="arrow-h" d="M196 524 L204 524 L200 531 Z"/>
<rect class="card-c3" x="26" y="531" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="551">.onion 网址</text>
<path class="arrow" d="M200 561 V573"/>
<path class="arrow-h" d="M196 572 L204 572 L200 579 Z"/>
<rect class="card" x="26" y="579" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="599">你的电脑</text>
<text class="t-main bd" x="38" y="617">在本机收到文件</text>
<text class="t-main lab" x="26" y="652">用在哪</text>
<text class="t-mute bd" x="36" y="669">隐蔽收件箱</text>
<text class="t-mute bd" x="36" y="686">匿名投稿与危机通报</text>
<rect class="card-ok" x="12" y="710" width="376" height="285" rx="8"/>
<text class="t-main lab" x="26" y="734">Host a Website</text>
<text class="t-main h2" x="26" y="754">临时架站</text>
<rect class="card" x="26" y="760" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="780">你的电脑</text>
<text class="t-main bd" x="38" y="798">放一份静态网站</text>
<path class="arrow" d="M200 808 V820"/>
<path class="arrow-h" d="M196 819 L204 819 L200 826 Z"/>
<rect class="card-c3" x="26" y="826" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="846">.onion 网址</text>
<path class="arrow" d="M200 856 V868"/>
<path class="arrow-h" d="M196 867 L204 867 L200 874 Z"/>
<rect class="card" x="26" y="874" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="894">多位访客</text>
<text class="t-main bd" x="38" y="912">各自用 Tor Browser 浏览</text>
<text class="t-main lab" x="26" y="947">用在哪</text>
<text class="t-mute bd" x="36" y="964">临时公布敏感内容</text>
<text class="t-mute bd" x="36" y="981">活动期间限定的资料</text>
<rect class="card-n" x="12" y="1005" width="376" height="285" rx="8"/>
<text class="t-main lab" x="26" y="1029">Chat</text>
<text class="t-main h2" x="26" y="1049">一次性聊天室</text>
<rect class="card" x="26" y="1055" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="1075">所有参与者</text>
<text class="t-main bd" x="38" y="1093">各自连进同一个房间</text>
<path class="arrow" d="M200 1103 V1115"/>
<path class="arrow-h" d="M196 1114 L204 1114 L200 1121 Z"/>
<rect class="card-c3" x="26" y="1121" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="1141">.onion 网址</text>
<path class="arrow" d="M200 1151 V1163"/>
<path class="arrow-h" d="M196 1162 L204 1162 L200 1169 Z"/>
<rect class="card" x="26" y="1169" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="1189">消息只在内存</text>
<text class="t-main bd" x="38" y="1207">关掉就整个消失</text>
<text class="t-main lab" x="26" y="1242">用在哪</text>
<text class="t-mute bd" x="36" y="1259">行动现场的临时协调</text>
<text class="t-mute bd" x="36" y="1276">不希望留下记录的讨论</text>
</svg>
