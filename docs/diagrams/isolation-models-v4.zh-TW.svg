<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 637" width="400" height="637" role="img" aria-labelledby="title">
<title id="title">Tails、Whonix、Qubes 三種隔離結構長得不一樣</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c2, .card-n, .card-w1 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="168" rx="8"/>
<text class="t-mute lab" x="26" y="24">Tails</text>
<text class="t-main h2" x="26" y="44">整機重置</text>
<text class="t-main lab" x="26" y="65">結構</text>
<text class="t-mute bd" x="36" y="82">一次工作階段，從 USB 開機</text>
<text class="t-mute bd" x="36" y="99">你的全部工作都在裡面，瀏覽、檔案、通訊都在這裡</text>
<text class="t-mute bd" x="36" y="116">全部流量強制走 Tor</text>
<text class="t-main lab" x="26" y="137">關機之後</text>
<text class="t-mute bd" x="36" y="154">整個消失，除非另外開 Persistent Storage</text>
<rect class="card-c2" x="12" y="178" width="376" height="130" rx="8"/>
<text class="t-main lab" x="26" y="202">Whonix</text>
<text class="t-main h2" x="26" y="222">兩台虛擬機分工</text>
<text class="t-main lab" x="26" y="243">結構</text>
<text class="t-main bd" x="36" y="260">你原本的作業系統照常使用</text>
<text class="t-main bd" x="36" y="277">Workstation 是你做事的地方，連不到外面</text>
<text class="t-main bd" x="36" y="294">Gateway 是唯一的出口，強制走 Tor</text>
<rect class="card-w1" x="12" y="318" width="376" height="168" rx="8"/>
<text class="t-mute lab" x="26" y="342">Qubes OS</text>
<text class="t-main h2" x="26" y="362">一個任務一個 qube</text>
<text class="t-main lab" x="26" y="383">結構</text>
<text class="t-mute bd" x="36" y="400">Xen hypervisor 切開硬體</text>
<text class="t-mute bd" x="36" y="417">工作、個人、金融各自一個 qube</text>
<text class="t-mute bd" x="36" y="434">Whonix 要另外裝</text>
<text class="t-main lab" x="26" y="455">界線</text>
<text class="t-mute bd" x="36" y="472">qube 之間預設互不相通，只有 Whonix 那一個走 Tor</text>
<rect class="card-n" x="12" y="502" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="526">三套的差別不在誰比較安全，在於界線畫在哪一層</text>
<text class="t-mute bd" x="26" y="543">Tails 一小時上手，做完就沒了，適合一次性任務。</text>
<text class="t-mute bd" x="26" y="560">Whonix 保留工作狀態，跨平台，</text>
<text class="t-mute bd" x="26" y="577">理解雙 VM 要花半天到一天。</text>
<text class="t-mute bd" x="26" y="594">Qubes 把界線畫在硬體層，隔離最徹底，代價是挑硬體</text>
<text class="t-mute bd" x="26" y="611">（VT-d、建議 16 GB 以上記憶體）與大約一週的適應期。</text>
</svg>
