<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1314" width="400" height="1314" role="img" aria-labelledby="title desc">
<title id="title">Which way data flows in each of OnionShare's four modes</title>
<desc id="desc">Data flow in four modes, compared. In Send, your computer holds the files and the other person downloads them in Tor Browser, so data moves from you outward. In Receive, you open an upload page and the sender uploads, so data moves toward you. In Host a Website, you serve a static site and several visitors browse it, so data moves from you to many. In Chat, the flow is two-way and everyone joins the same ephemeral room. All four share the same middle step, a .onion address that stops working the moment OnionShare is closed.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="174" rx="8"/>
<text class="t-main h2" x="26" y="24">All four modes share the middle section</text>
<text class="t-mute bd" x="26" y="41">Files and messages travel over Tor</text>
<text class="t-mute bd" x="26" y="58">directly between the two ends, through</text>
<text class="t-mute bd" x="26" y="75">no cloud service, and the address dies</text>
<text class="t-mute bd" x="26" y="92">the moment OnionShare closes.</text>
<text class="t-mute bd" x="26" y="109">The address itself has to reach the other</text>
<text class="t-mute bd" x="26" y="126">person through a safe channel. OnionShare</text>
<text class="t-mute bd" x="26" y="143">does not deliver it. Send it insecurely</text>
<text class="t-mute bd" x="26" y="160">and that leg is no longer anonymous.</text>
<rect class="card-c1" x="12" y="188" width="376" height="271" rx="8"/>
<text class="t-main lab" x="26" y="212">Send</text>
<text class="t-main h2" x="26" y="232">Sending a file</text>
<rect class="card" x="26" y="238" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="254">Your computer</text>
<text class="t-main bd" x="36" y="271">Drop the files in</text>
<text class="t-mute bd" x="40" y="295">&#8595;</text>
<rect class="card-c3" x="26" y="301" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="317">.onion address</text>
<text class="t-mute bd" x="40" y="341">&#8595;</text>
<rect class="card" x="26" y="347" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="363">The recipient</text>
<text class="t-main bd" x="36" y="380">Downloads with Tor Browser</text>
<text class="t-main lab" x="26" y="411">Where it fits</text>
<text class="t-mute bd" x="36" y="428">Sending evidence to a lawyer</text>
<text class="t-mute bd" x="36" y="445">A one-off file handover</text>
<rect class="card-w1" x="12" y="469" width="376" height="271" rx="8"/>
<text class="t-main lab" x="26" y="493">Receive</text>
<text class="t-main h2" x="26" y="513">Receiving a file</text>
<rect class="card" x="26" y="519" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="535">The sender</text>
<text class="t-main bd" x="36" y="552">Uploads with Tor Browser</text>
<text class="t-mute bd" x="40" y="576">&#8595;</text>
<rect class="card-c3" x="26" y="582" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="598">.onion address</text>
<text class="t-mute bd" x="40" y="622">&#8595;</text>
<rect class="card" x="26" y="628" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="644">Your computer</text>
<text class="t-main bd" x="36" y="661">Receives the file locally</text>
<text class="t-main lab" x="26" y="692">Where it fits</text>
<text class="t-mute bd" x="36" y="709">A discreet inbox</text>
<text class="t-mute bd" x="36" y="726">Anonymous submissions and crisis reports</text>
<rect class="card-ok" x="12" y="750" width="376" height="271" rx="8"/>
<text class="t-main lab" x="26" y="774">Host a Website</text>
<text class="t-main h2" x="26" y="794">A temporary site</text>
<rect class="card" x="26" y="800" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="816">Your computer</text>
<text class="t-main bd" x="36" y="833">Serves a static site</text>
<text class="t-mute bd" x="40" y="857">&#8595;</text>
<rect class="card-c3" x="26" y="863" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="879">.onion address</text>
<text class="t-mute bd" x="40" y="903">&#8595;</text>
<rect class="card" x="26" y="909" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="925">Visitors</text>
<text class="t-main bd" x="36" y="942">Browse with Tor Browser</text>
<text class="t-main lab" x="26" y="973">Where it fits</text>
<text class="t-mute bd" x="36" y="990">Publishing sensitive material briefly</text>
<text class="t-mute bd" x="36" y="1007">Material limited to the length of an event</text>
<rect class="card-n" x="12" y="1031" width="376" height="271" rx="8"/>
<text class="t-main lab" x="26" y="1055">Chat</text>
<text class="t-main h2" x="26" y="1075">A disposable chat room</text>
<rect class="card" x="26" y="1081" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="1097">Everyone taking part</text>
<text class="t-main bd" x="36" y="1114">Joins the same room</text>
<text class="t-mute bd" x="40" y="1138">&#8595;</text>
<rect class="card-c3" x="26" y="1144" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="1160">.onion address</text>
<text class="t-mute bd" x="40" y="1184">&#8595;</text>
<rect class="card" x="26" y="1190" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="1206">Messages stay in memory</text>
<text class="t-main bd" x="36" y="1223">Closing it erases everything</text>
<text class="t-main lab" x="26" y="1254">Where it fits</text>
<text class="t-mute bd" x="36" y="1271">Coordinating during an action</text>
<text class="t-mute bd" x="36" y="1288">Discussion you do not want recorded</text>
</svg>
