<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" width="400" height="690" role="img" aria-labelledby="title desc">
<title id="title">Agree the attribution level with your source, section by section</title>
<desc id="desc">Four stacked bands running from dark to light, representing the four attribution levels a reporter and a source can agree on, with the source's exposure shrinking as you move down. The first level is on the record, meaning the name and job title can be printed, so the story carries the name, the title and the direct quote. The second level is anonymous quotation, meaning the content can be quoted under a role description, so the story carries a line such as an engineer who worked on the project said. The third level is background, used only to understand the situation and direct verification, with the source neither named nor quoted. The fourth level is not for use, where nothing enters the story at all. The red box below warns that anonymous quotation is the level that goes wrong most often, because the role description can identify the person on its own: if only three people at a company match the description, the description names all three.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
  }
</style>

<rect class="card-no" x="12" y="0" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="24">On the record</text>
<text class="t-main lab" x="26" y="45">What it means</text>
<text class="t-mute bd" x="36" y="62">Name and job title can be printed</text>
<text class="t-main lab" x="26" y="83">What appears in the story</text>
<text class="t-mute bd" x="36" y="100">Name, title, direct quote</text>
<rect class="card-w2" x="12" y="124" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="148">Anonymous quotation</text>
<text class="t-main lab" x="26" y="169">What it means</text>
<text class="t-main bd" x="36" y="186">Content can be quoted under a role description</text>
<text class="t-main lab" x="26" y="207">What appears in the story</text>
<text class="t-main bd" x="36" y="224">"An engineer who worked on the project said"</text>
<rect class="card-w1" x="12" y="248" width="376" height="131" rx="8"/>
<text class="t-main h2" x="26" y="272">Background</text>
<text class="t-main lab" x="26" y="293">What it means</text>
<text class="t-mute bd" x="36" y="310">Only for understanding the story</text>
<text class="t-mute bd" x="36" y="327">and directing verification</text>
<text class="t-main lab" x="26" y="348">What appears in the story</text>
<text class="t-mute bd" x="36" y="365">Source is neither named nor quoted</text>
<rect class="card-n" x="12" y="389" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="413">Not for use</text>
<text class="t-main lab" x="26" y="434">What it means</text>
<text class="t-mute bd" x="36" y="451">Nothing enters the story</text>
<text class="t-main lab" x="26" y="472">What appears in the story</text>
<text class="t-mute bd" x="36" y="489">Nothing</text>
<rect class="card-c1" x="12" y="521" width="376" height="157" rx="8"/>
<text class="t-main h2" x="26" y="545">Anonymous quotation is where this goes wrong</text>
<text class="t-mute bd" x="26" y="562">The role description can identify the person</text>
<text class="t-mute bd" x="26" y="579">on its own. If only three people at a company</text>
<text class="t-mute bd" x="26" y="596">match "an engineer who worked on the project",</text>
<text class="t-mute bd" x="26" y="613">the description has named all three.</text>
<text class="t-mute bd" x="26" y="630">Widen the description by one step</text>
<text class="t-mute bd" x="26" y="647">during the conversation, or move</text>
<text class="t-mute bd" x="26" y="664">the material down to background.</text>
</svg>
