<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 753" width="400" height="753" role="img" aria-labelledby="title">
<title id="title">What the same level means on each of the three tools</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c2, .card-c3, .card-n { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="24">The three columns are independent</text>
<text class="t-mute bd" x="26" y="41">Tor is the base for anonymity, Tails raises the</text>
<text class="t-mute bd" x="26" y="58">whole environment, and OONI measures censorship.</text>
<text class="t-mute bd" x="26" y="75">The same level is not the same work on all</text>
<text class="t-mute bd" x="26" y="92">three. Pick the column that matches what you</text>
<text class="t-mute bd" x="26" y="109">want to work on, and move up from where you are.</text>
<rect class="card-c1" x="12" y="137" width="376" height="189" rx="8"/>
<text class="t-mute lab" x="26" y="161">Anyone curious</text>
<text class="t-main h2" x="26" y="181">Know</text>
<text class="t-main lab" x="26" y="202">Tor</text>
<text class="t-mute bd" x="36" y="219">Can explain onion routing</text>
<text class="t-mute bd" x="36" y="236">and the three-relay path</text>
<text class="t-main lab" x="26" y="257">Tails</text>
<text class="t-mute bd" x="36" y="274">Can say how Tails differs from an ordinary OS</text>
<text class="t-main lab" x="26" y="295">OONI</text>
<text class="t-mute bd" x="36" y="312">Can say what OONI measures, and why</text>
<rect class="card-c2" x="12" y="336" width="376" height="189" rx="8"/>
<text class="t-main lab" x="26" y="360">Journalists, civil society</text>
<text class="t-main h2" x="26" y="380">Use</text>
<text class="t-main lab" x="26" y="401">Tor</text>
<text class="t-main bd" x="36" y="418">Install Tor Browser, connect with a bridge</text>
<text class="t-main lab" x="26" y="439">Tails</text>
<text class="t-main bd" x="36" y="456">Build a bootable USB and boot into it</text>
<text class="t-main lab" x="26" y="477">OONI</text>
<text class="t-main bd" x="36" y="494">Run Probe, produce a report,</text>
<text class="t-main bd" x="36" y="511">read results in Explorer</text>
<rect class="card-c3" x="12" y="535" width="376" height="206" rx="8"/>
<text class="t-main lab" x="26" y="559">Open source contributors</text>
<text class="t-main h2" x="26" y="579">Contribute</text>
<text class="t-main lab" x="26" y="600">Tor</text>
<text class="t-main bd" x="36" y="617">Run a relay, a bridge, or WebTunnel</text>
<text class="t-main lab" x="26" y="638">Tails</text>
<text class="t-main bd" x="36" y="655">Back up Persistent Storage,</text>
<text class="t-main bd" x="36" y="672">manage keys with GnuPG</text>
<text class="t-main lab" x="26" y="693">OONI</text>
<text class="t-main bd" x="36" y="710">Run chosen tests from the CLI,</text>
<text class="t-main bd" x="36" y="727">curate lists, analyse raw data</text>
</svg>
