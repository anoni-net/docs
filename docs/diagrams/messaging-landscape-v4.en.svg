<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 581" width="400" height="581" role="img" aria-labelledby="title">
<title id="title">Where messaging tools land on identity binding and metadata</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card, .card-c1, .card-c3, .card-n { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="108" rx="8"/>
<text class="t-main h2" x="26" y="24">Two axes: where metadata sits,</text>
<text class="t-main h2" x="26" y="43">and how identity is bound</text>
<text class="t-mute bd" x="26" y="60">Further up and to the right, fewer parties know</text>
<text class="t-mute bd" x="26" y="77">who you are and who you talk to. Dark points are</text>
<text class="t-mute bd" x="26" y="94">the main list, light points the comparison group.</text>
<rect class="card" x="12" y="120" width="376" height="348" rx="8"/>
<text class="t-mute bd" x="200" y="144" text-anchor="middle">↑ No central server to look at</text>
<circle class="card-n" cx="34" cy="407" r="6"/>
<text class="t-main bd" x="45" y="411">LINE</text>
<circle class="card-n" cx="64" cy="383" r="6"/>
<text class="t-main bd" x="75" y="387">Telegram</text>
<circle class="card-n" cx="41" cy="350" r="6"/>
<text class="t-main bd" x="52" y="354">WhatsApp</text>
<circle class="card-c3" cx="127" cy="253" r="6"/>
<text class="t-main bd" x="138" y="257">Signal</text>
<circle class="card-c3" cx="182" cy="340" r="6"/>
<text class="t-main bd" x="193" y="344">Matrix</text>
<circle class="card-c3" cx="277" cy="225" r="6"/>
<text class="t-main bd" x="266" y="229" text-anchor="end">Session</text>
<circle class="card-c3" cx="323" cy="190" r="6"/>
<text class="t-main bd" x="312" y="194" text-anchor="end">SimpleX</text>
<circle class="card-c3" cx="366" cy="167" r="6"/>
<text class="t-main bd" x="355" y="171" text-anchor="end">Briar</text>
<text class="t-mute bd" x="200" y="438" text-anchor="middle">↓ A central server sees everything</text>
<text class="t-mute bd" x="26" y="458">← Bound to a phone number</text>
<text class="t-mute bd" x="374" y="458" text-anchor="end">No lookupable identity →</text>
<rect class="card-c1" x="12" y="480" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="504">Positions are relative rather than measured</text>
<text class="t-mute bd" x="26" y="521">Signal's identity is still tied to a</text>
<text class="t-mute bd" x="26" y="538">phone number. Every homeserver in a</text>
<text class="t-mute bd" x="26" y="555">Matrix room sees the message metadata.</text>
</svg>
