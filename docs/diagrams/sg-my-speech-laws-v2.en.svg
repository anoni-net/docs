<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1824" width="400" height="1824" role="img" aria-labelledby="title desc">
<title id="title">Singapore and Malaysia each have a named set of statutes, and a real-name layer that defeats pseudonyms</title>
<desc id="desc">Two columns listing the statutes that reach online speech in Singapore and Malaysia. Singapore has POFMA, FICA, defamation and contempt of court, and a broad definition of public assembly under the Public Order Act. Malaysia has section 233 of the Communications and Multimedia Act 1998, the Sedition Act 1948, SOSMA, the Societies Act 1966, and state-level religious enforcement. The bar below sets out the real-name layer both countries share: national digital identity in the form of Singpass, MyKad and MyDigital ID, plus mandatory SIM registration, so accounts, devices and payment methods usually already point at a legal name. The final bar explains that visibility and organisation amplify risk, with low-reach posts, viral posts and coordinated action sitting at different levels.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<text class="t-main h1" x="12" y="22">Singapore</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-n" x="12" y="44" width="376" height="54" rx="8"/>
<text class="t-mute bd" x="26" y="67">Statutes to check against.</text>
<text class="t-mute bd" x="26" y="84">This list is not exhaustive.</text>
<rect class="card-c1" x="12" y="108" width="376" height="142" rx="8"/>
<text class="t-main h2" x="26" y="132">POFMA, Protection from Online</text>
<text class="t-main h2" x="26" y="151">Falsehoods and Manipulation Act, 2019</text>
<text class="t-mute bd" x="26" y="168">A minister can order a correction or takedown</text>
<text class="t-mute bd" x="26" y="185">of a false statement of fact. Most posters</text>
<text class="t-mute bd" x="26" y="202">meet it as a correction notice or a removal.</text>
<text class="t-mute bd" x="26" y="219">2026 brought the first criminal charges.</text>
<text class="t-mute bd" x="26" y="236">Ignoring a direction is itself an offence.</text>
<rect class="card-c1" x="12" y="260" width="376" height="108" rx="8"/>
<text class="t-main h2" x="26" y="284">FICA, Foreign Interference</text>
<text class="t-main h2" x="26" y="303">(Countermeasures) Act, 2021</text>
<text class="t-mute bd" x="26" y="320">Aimed at organised or foreign-linked political</text>
<text class="t-mute bd" x="26" y="337">actors. It matters more to cross-border</text>
<text class="t-mute bd" x="26" y="354">organisers than to a single political comment.</text>
<rect class="card-c1" x="12" y="378" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="402">Defamation and contempt of court</text>
<text class="t-mute bd" x="26" y="419">Civil and criminal defamation, plus the</text>
<text class="t-mute bd" x="26" y="436">contempt provisions of the Administration</text>
<text class="t-mute bd" x="26" y="453">of Justice (Protection) Act.</text>
<text class="t-mute bd" x="26" y="470">The practical limit on commenting</text>
<text class="t-mute bd" x="26" y="487">about officials and live cases.</text>
<rect class="card-c1" x="12" y="511" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="535">Public assembly under the Public Order Act</text>
<text class="t-mute bd" x="26" y="552">The definition of assembly is broad</text>
<text class="t-mute bd" x="26" y="569">enough to cover online mobilisation.</text>
<text class="t-mute bd" x="26" y="586">An indoor forum has been treated as an</text>
<text class="t-mute bd" x="26" y="603">illegal assembly because it was streamed.</text>
<text class="t-main h1" x="12" y="657">Malaysia</text>
<path class="rule" d="M12 667 H388"/>
<rect class="card-n" x="12" y="679" width="376" height="54" rx="8"/>
<text class="t-mute bd" x="26" y="702">The provisions reach shares and comments,</text>
<text class="t-mute bd" x="26" y="719">not only what you wrote yourself.</text>
<rect class="card-w1" x="12" y="743" width="376" height="159" rx="8"/>
<text class="t-main h2" x="26" y="767">Section 233, Communications</text>
<text class="t-main h2" x="26" y="786">and Multimedia Act 1998</text>
<text class="t-mute bd" x="26" y="803">The provision used most often against</text>
<text class="t-mute bd" x="26" y="820">online speech. After the February</text>
<text class="t-mute bd" x="26" y="837">2025 amendment, penalties reach RM500,</text>
<text class="t-mute bd" x="26" y="854">000 or two years' imprisonment.</text>
<text class="t-mute bd" x="26" y="871">In 2026 the Federal Court required</text>
<text class="t-mute bd" x="26" y="888">prosecutors to prove genuine intent.</text>
<rect class="card-w1" x="12" y="912" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="936">Sedition Act 1948</text>
<text class="t-mute bd" x="26" y="953">A colonial-era law still</text>
<text class="t-mute bd" x="26" y="970">in force and still in use.</text>
<text class="t-mute bd" x="26" y="987">It applies to the 3R subjects:</text>
<text class="t-mute bd" x="26" y="1004">race, religion and royalty.</text>
<rect class="card-w1" x="12" y="1028" width="376" height="125" rx="8"/>
<text class="t-main h2" x="26" y="1052">SOSMA, Security Offences (</text>
<text class="t-main h2" x="26" y="1071">Special Measures) Act 2012</text>
<text class="t-mute bd" x="26" y="1088">Special procedure for security offences,</text>
<text class="t-mute bd" x="26" y="1105">including extended detention.</text>
<text class="t-mute bd" x="26" y="1122">Aimed at terrorism and national</text>
<text class="t-mute bd" x="26" y="1139">security, not everyday speech cases.</text>
<rect class="card-w1" x="12" y="1163" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="1187">Societies Act 1966</text>
<text class="t-mute bd" x="26" y="1204">Reaches groups with members, officers</text>
<text class="t-mute bd" x="26" y="1221">and continuing activity. A one-off</text>
<text class="t-mute bd" x="26" y="1238">hashtag does not constitute a society.</text>
<rect class="card-w1" x="12" y="1262" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="1286">State religious enforcement</text>
<text class="t-mute bd" x="26" y="1303">State Islamic authorities enforce Syariah</text>
<text class="t-mute bd" x="26" y="1320">offences that apply to Muslims only.</text>
<text class="t-mute bd" x="26" y="1337">A separate mechanism from the Sedition</text>
<text class="t-mute bd" x="26" y="1354">Act's 3R scope, not an overlap.</text>
<rect class="card" x="12" y="1386" width="376" height="174" rx="8"/>
<text class="t-main h2" x="26" y="1410">The real-name layer both countries share</text>
<text class="t-mute bd" x="26" y="1427">National digital identity such as Singpass in</text>
<text class="t-mute bd" x="26" y="1444">Singapore and MyKad and MyDigital ID in Malaysia,</text>
<text class="t-mute bd" x="26" y="1461">plus mandatory SIM registration in both.</text>
<text class="t-mute bd" x="26" y="1478">Accounts, devices and payment methods</text>
<text class="t-mute bd" x="26" y="1495">usually already point at a legal name.</text>
<text class="t-mute bd" x="26" y="1512">Changing the display name on a real-name</text>
<text class="t-mute bd" x="26" y="1529">account is not separation. Separation</text>
<text class="t-mute bd" x="26" y="1546">has to be built from the start.</text>
<rect class="card-no" x="12" y="1570" width="376" height="242" rx="8"/>
<text class="t-main h2" x="26" y="1594">Risk rises with visibility and organisation</text>
<text class="t-mute bd" x="26" y="1611">A low-reach post, a viral post and a</text>
<text class="t-mute bd" x="26" y="1628">coordinated action sit at different levels.</text>
<text class="t-mute bd" x="26" y="1645">Recorded enforcement lands mostly on public</text>
<text class="t-mute bd" x="26" y="1662">figures, activists and organisers, or on</text>
<text class="t-mute bd" x="26" y="1679">posts that travelled a long way.</text>
<text class="t-mute bd" x="26" y="1696">An ordinary low-visibility post is less</text>
<text class="t-mute bd" x="26" y="1713">likely to be pursued. Less likely is not safe,</text>
<text class="t-mute bd" x="26" y="1730">and the 2026 trend is more prosecutions.</text>
<text class="t-mute bd" x="26" y="1747">Being abroad does not put you out of reach.</text>
<text class="t-mute bd" x="26" y="1764">Singapore's foreign interference framework</text>
<text class="t-mute bd" x="26" y="1781">and POFMA assert extraterritorial effect, and</text>
<text class="t-mute bd" x="26" y="1798">the Malaysian provisions are drafted broadly.</text>
</svg>
