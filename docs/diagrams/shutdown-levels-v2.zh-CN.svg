<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 857" width="400" height="857" role="img" aria-labelledby="title desc">
<title id="title">断网分四级，每一级还剩下的选项不同</title>
<desc id="desc">四层由浅到深的横条，代表网络中断的四个等级，越往下可用的选项越少。第一级是降速与间歇中断，判断方式是小文件过得去、大文件过不去，还剩下文字通信与离线编辑之后等时机送出，最常见的误判是当成自己的设备坏了而反复重启。第二级是特定服务被拦，判断方式是同一条线路上别的网站打得开，还剩下没有被拦的其他渠道，最常见的误判是一个 app 打不开就认定整条线路断了。第三级是区域全断，判断方式是换 Wi-Fi、换号码结果相同而且旁边的人也一样，还剩下事先存好的东西、蓝牙与局域网、实体传递，最常见的误判是以为蓝牙与局域网也跟着失效。第四级是连电力一起中断，不必判断就很明显，还剩下电池撑得住的时间、纸本与事先约好的见面方式，最常见的误判是重点还放在通信工具而没有换成电力管理。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="186" rx="8"/>
<text class="t-main lab" x="26" y="24">第一级</text>
<text class="t-main h2" x="26" y="44">降速与间歇中断</text>
<text class="t-mute bd" x="26" y="62">小文件过得去，大文件过不去。纯文字的服务仍然可用。</text>
<text class="t-main lab" x="26" y="83">还剩下</text>
<text class="t-mute bd" x="36" y="100">文字通信</text>
<text class="t-mute bd" x="36" y="117">低带宽的工作方式</text>
<text class="t-mute bd" x="36" y="134">离线编辑之后等时机送出</text>
<text class="t-main lab" x="26" y="155">最常见的误判</text>
<text class="t-mute bd" x="36" y="172">当成自己的设备坏了，反复重启、重装 app、重置路由器。</text>
<rect class="card-w1" x="12" y="196" width="376" height="187" rx="8"/>
<text class="t-main lab" x="26" y="220">第二级</text>
<text class="t-main h2" x="26" y="240">特定服务被拦</text>
<text class="t-mute bd" x="26" y="258">同一条线路上别的网站打得开。四级里唯</text>
<text class="t-mute bd" x="26" y="276">一能用 OONI 这类公开测量确认的一级。</text>
<text class="t-main lab" x="26" y="297">还剩下</text>
<text class="t-mute bd" x="36" y="314">没有被拦的其他渠道</text>
<text class="t-mute bd" x="36" y="331">规避工具</text>
<text class="t-main lab" x="26" y="352">最常见的误判</text>
<text class="t-mute bd" x="36" y="369">一个 app 打不开，就认定整条线路断了。</text>
<rect class="card-w2" x="12" y="393" width="376" height="221" rx="8"/>
<text class="t-main lab" x="26" y="417">第三级</text>
<text class="t-main h2" x="26" y="437">区域全断</text>
<text class="t-main bd" x="26" y="455">换 Wi-Fi、换号码结果相同，旁边的人也一样。信号格数</text>
<text class="t-main bd" x="26" y="473">帮不上忙。拨电话或发短信可以分辨被切掉的是不是数据。</text>
<text class="t-main lab" x="26" y="494">还剩下</text>
<text class="t-main bd" x="36" y="511">设备上事先存好的东西</text>
<text class="t-main bd" x="36" y="528">蓝牙与局域网的近距离连接</text>
<text class="t-main bd" x="36" y="545">U 盘、纸本、当面说明</text>
<text class="t-main lab" x="26" y="566">最常见的误判</text>
<text class="t-main bd" x="36" y="583">以为所有无线功能都失效。蓝牙与局域网</text>
<text class="t-main bd" x="36" y="600">不经过运营商与互联网，这一级仍然运作。</text>
<rect class="card-w3" x="12" y="624" width="376" height="221" rx="8"/>
<text class="t-onfill lab" x="26" y="648">第四级</text>
<text class="t-onfill h2" x="26" y="668">连电力一起中断</text>
<text class="t-onfill bd" x="26" y="686">不必判断，很明显。问题从「消息送</text>
<text class="t-onfill bd" x="26" y="704">不出去」换成「几小时之后会关机」。</text>
<text class="t-onfill lab" x="26" y="725">还剩下</text>
<text class="t-onfill bd" x="36" y="742">电池撑得住的那段时间</text>
<text class="t-onfill bd" x="36" y="759">纸本</text>
<text class="t-onfill bd" x="36" y="776">事先约好的见面方式</text>
<text class="t-onfill lab" x="26" y="797">最常见的误判</text>
<text class="t-onfill bd" x="36" y="814">重点还放在通信工具，没有换成电力管理。充</text>
<text class="t-onfill bd" x="36" y="831">电宝与调暗屏幕在这一级决定你还有多少时间。</text>
</svg>
