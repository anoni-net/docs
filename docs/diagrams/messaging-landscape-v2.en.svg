<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 573" width="400" height="573" role="img" aria-labelledby="title desc">
<title id="title">Where messaging tools land on identity binding and metadata</title>
<desc id="desc">A scatter plot. The horizontal axis is how identity is bound, from a phone number on the left to no lookupable identity on the right. The vertical axis is where metadata sits, from a central server seeing everything at the bottom to no central server to look at, at the top. LINE, Telegram, and WhatsApp, the comparison group, sit in the lower left. Signal sits higher because of its metadata-minimising design, and still to the left because identity is tied to a phone number. Matrix sits centre-low, since every homeserver in a room can see the traffic. Session, SimpleX, and Briar sit in the upper right, with no phone binding and no central server holding who talks to whom. Positions are relative rather than measured.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="108" rx="8"/>
<text class="t-main h2" x="26" y="24">Two axes: where metadata sits,</text>
<text class="t-main h2" x="26" y="43">and how identity is bound</text>
<text class="t-mute bd" x="26" y="60">Further up and to the right, fewer parties know</text>
<text class="t-mute bd" x="26" y="77">who you are and who you talk to. Dark points are</text>
<text class="t-mute bd" x="26" y="94">the main list, light points the comparison group.</text>
<rect class="card" x="12" y="120" width="376" height="340" rx="8"/>
<text class="t-mute bd" x="200" y="136" text-anchor="middle">↑ No central server to look at</text>
<circle class="card-n" cx="34" cy="399" r="6"/>
<text class="t-main bd" x="45" y="403">LINE</text>
<circle class="card-n" cx="64" cy="375" r="6"/>
<text class="t-main bd" x="75" y="379">Telegram</text>
<circle class="card-n" cx="41" cy="342" r="6"/>
<text class="t-main bd" x="52" y="346">WhatsApp</text>
<circle class="card-c3" cx="127" cy="245" r="6"/>
<text class="t-main bd" x="138" y="249">Signal</text>
<circle class="card-c3" cx="182" cy="332" r="6"/>
<text class="t-main bd" x="193" y="336">Matrix</text>
<circle class="card-c3" cx="277" cy="217" r="6"/>
<text class="t-main bd" x="266" y="221" text-anchor="end">Session</text>
<circle class="card-c3" cx="323" cy="182" r="6"/>
<text class="t-main bd" x="312" y="186" text-anchor="end">SimpleX</text>
<circle class="card-c3" cx="366" cy="159" r="6"/>
<text class="t-main bd" x="355" y="163" text-anchor="end">Briar</text>
<text class="t-mute bd" x="200" y="430" text-anchor="middle">↓ A central server sees everything</text>
<text class="t-mute bd" x="26" y="450">← Bound to a phone number</text>
<text class="t-mute bd" x="374" y="450" text-anchor="end">No lookupable identity →</text>
<rect class="card-c1" x="12" y="472" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="496">Positions are relative rather than measured</text>
<text class="t-mute bd" x="26" y="513">Signal's identity is still tied to a</text>
<text class="t-mute bd" x="26" y="530">phone number. Every homeserver in a</text>
<text class="t-mute bd" x="26" y="547">Matrix room sees the message metadata.</text>
</svg>
