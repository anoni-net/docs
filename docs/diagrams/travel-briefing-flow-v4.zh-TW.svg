<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 796" width="400" height="796" role="img" aria-labelledby="title">
<title id="title">從開場 prompt 到隨身緊急卡的四步</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c2, .card-no, .card-ok, .card-w1 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="168" rx="8"/>
<text class="t-mute lab" x="26" y="24">一、開場 prompt</text>
<text class="t-main h2" x="26" y="44">只填一次</text>
<text class="t-main lab" x="26" y="65">要改的地方</text>
<text class="t-mute bd" x="36" y="82">把出發地、目的地與停留天數換成你的資訊，</text>
<text class="t-mute bd" x="36" y="99">日期與身分可留白。貼給 AI 設定角色。</text>
<text class="t-main lab" x="26" y="120">兩種版本</text>
<text class="t-mute bd" x="36" y="137">完整版給自架與本地 AI。商業服</text>
<text class="t-mute bd" x="36" y="154">務版拿掉會讓對話被記住的細節。</text>
<rect class="card-c2" x="12" y="178" width="376" height="164" rx="8"/>
<text class="t-main lab" x="26" y="202">二、五項調查</text>
<text class="t-main h2" x="26" y="222">逐項複製貼上，不必改字</text>
<text class="t-main lab" x="26" y="243">五項</text>
<text class="t-main bd" x="36" y="260">數位環境：審查、Tor、VPN、設備搜查</text>
<text class="t-main bd" x="36" y="277">法律與政治風險</text>
<text class="t-main bd" x="36" y="294">連線與通訊：SIM、eSIM</text>
<text class="t-main bd" x="36" y="311">緊急聯絡與支援網路</text>
<text class="t-main bd" x="36" y="328">實體與監控環境（選用）</text>
<rect class="card-ok" x="12" y="352" width="376" height="185" rx="8"/>
<text class="t-mute lab" x="26" y="376">三、核對一手來源</text>
<text class="t-main h2" x="26" y="396">這一步不能跳過</text>
<text class="t-main lab" x="26" y="417">怎麼做</text>
<text class="t-mute bd" x="36" y="434">拿 AI 的答案去對照文章底部的官方來源。</text>
<text class="t-main lab" x="26" y="455">一定要核對的四類</text>
<text class="t-mute bd" x="36" y="472">緊急電話</text>
<text class="t-mute bd" x="36" y="489">法條編號</text>
<text class="t-mute bd" x="36" y="506">簽證規則</text>
<text class="t-mute bd" x="36" y="523">資費</text>
<rect class="card-w1" x="12" y="547" width="376" height="113" rx="8"/>
<text class="t-mute lab" x="26" y="571">四、隨身緊急卡</text>
<text class="t-main h2" x="26" y="591">離線也拿得到的那一份</text>
<text class="t-main lab" x="26" y="612">怎麼做</text>
<text class="t-mute bd" x="36" y="629">把第四項問到的關鍵聯絡抄成一張卡片。印出來過</text>
<text class="t-mute bd" x="36" y="646">塑，皮夾與行李各放一張。同步存進手機離線筆記。</text>
<rect class="card-no" x="12" y="678" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="702">AI 會編造電話、法條與資費</text>
<text class="t-mute bd" x="26" y="719">語言模型很會「說得很有把握是錯的」。把 AI 的回答當</text>
<text class="t-mute bd" x="26" y="736">成「我接下來該查哪些東西」的起點，不要當成最終答案。</text>
<text class="t-mute bd" x="26" y="753">目的地越冷門、公開資料越少，AI 手上的訓練資料</text>
<text class="t-mute bd" x="26" y="770">也越少、越容易亂編，偏偏這種地方最需要可靠資訊。</text>
</svg>
