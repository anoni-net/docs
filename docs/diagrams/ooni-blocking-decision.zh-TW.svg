<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 646" width="880" height="646" role="img" aria-labelledby="title desc">
<title id="title">web_connectivity 的四個判定階段，差異出現在哪一階就停在哪一階</title>
<desc id="desc">判定流程圖。同一個網址由 Probe 端與 test helper 各測一次，兩邊結果逐階段比對。第一階比 DNS 解析結果，不一致就判 blocking 為 dns。第二階比 TCP 連線，Probe 連不上而 test helper 連得上就判 tcp_ip。第三階比 HTTP 階段，失敗就判 http-failure。第四階比回應內容，與 test helper 取得的不同就判 http-diff。四階都通過就是 blocking 為 false、accessible 為 true。判定在任何一階中止之後就不再往下比對，這也是為什麼四個 match 欄位在前三種情況下全是 null。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。橙色是判定為受干預的那幾種結果，
     cyan 是通過的路徑，跟站上其他示意圖的語意一致。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .mono { font-family: "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", monospace; }
  .src { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; rx: 8; }
  .src-t { fill: #37474f; font-size: 14px; font-weight: 700; }
  .src-sub { fill: #78909c; font-size: 11.5px; }
  .stage { fill: #e6f4fb; stroke: #0089bf; stroke-width: 1.4; rx: 8; }
  .stage-n { fill: #0089bf; font-size: 12px; font-weight: 700; }
  .stage-t { fill: #212121; font-size: 14.5px; font-weight: 600; }
  .stage-sub { fill: #607d8b; font-size: 11.5px; }
  .hit { fill: #fdf0e4; stroke: #ef6c00; stroke-width: 1.4; rx: 8; }
  .hit-code { fill: #bf5700; font-size: 13.5px; font-weight: 700; }
  .hit-sub { fill: #8d6e63; font-size: 11.5px; }
  .ok { fill: #0089bf; stroke: none; rx: 8; }
  .ok-code { fill: #ffffff; font-size: 13.5px; font-weight: 700; }
  .ok-sub { fill: #cfeaf7; font-size: 11.5px; }
  .flow { stroke: #0089bf; stroke-width: 2; fill: none; }
  .flow-head { fill: #0089bf; }
  .branch { stroke: #ef6c00; stroke-width: 1.8; fill: none; }
  .branch-head { fill: #ef6c00; }
  .lbl-no { fill: #ef6c00; font-size: 12px; font-weight: 700; }
  .lbl-yes { fill: #0089bf; font-size: 12px; font-weight: 700; }
  .foot { fill: #546e7a; font-size: 13px; }

  @media (prefers-color-scheme: dark) {
    .src { fill: #23292e; stroke: #4b565e; }
    .src-t { fill: #cfd8dc; }
    .src-sub { fill: #90a4ae; }
    .stage { fill: #0d2b38; stroke: #4dbfff; }
    .stage-n { fill: #4dbfff; }
    .stage-t { fill: #eceff1; }
    .stage-sub { fill: #90a4ae; }
    .hit { fill: #33241a; stroke: #ff8c1a; }
    .hit-code { fill: #ffb74d; }
    .hit-sub { fill: #a1887f; }
    .ok { fill: #1976a8; }
    .ok-sub { fill: #cfeaf7; }
    .flow { stroke: #4dbfff; }
    .flow-head { fill: #4dbfff; }
    .branch { stroke: #ff8c1a; }
    .branch-head { fill: #ff8c1a; }
    .lbl-no { fill: #ff8c1a; }
    .lbl-yes { fill: #4dbfff; }
    .foot { fill: #b0bec5; }
  }
</style>

<rect class="src" x="60" y="24" width="200" height="54"/>
<text class="src-t"   x="160" y="46" text-anchor="middle">Probe 端</text>
<text class="src-sub" x="160" y="66" text-anchor="middle">從你所在的網路測一次</text>
<rect class="src" x="300" y="24" width="200" height="54"/>
<text class="src-t"   x="400" y="46" text-anchor="middle">test helper</text>
<text class="src-sub" x="400" y="66" text-anchor="middle">從外部網路測一次</text>
<text class="stage-sub" x="280" y="102" text-anchor="middle">同一個網址，兩邊各測一次，接著逐階段比對差異</text>
<path class="flow" d="M160 78 V118 H280 V140"/>
<path class="flow" d="M400 78 V118 H280"/>
<path class="flow-head" d="M280 152 L273 136 L287 136 Z"/>

<rect class="stage" x="60" y="160" width="440" height="52"/>
<text class="stage-n" x="80" y="182">第 1 階</text>
<text class="stage-t" x="146" y="182">DNS 解析結果一致嗎</text>
<text class="stage-sub" x="146" y="200">比對兩邊的 A 與 AAAA 查詢結果</text>
<path class="branch" d="M500 186 H588"/>
<path class="branch-head" d="M600 186 L584 179 L584 193 Z"/>
<text class="lbl-no" x="544" y="176" text-anchor="middle">不一致</text>
<rect class="hit" x="600" y="160" width="220" height="52"/>
<text class="hit-code mono" x="710" y="184" text-anchor="middle">blocking: "dns"</text>
<text class="hit-sub" x="710" y="202" text-anchor="middle">解析結果對不上</text>

<path class="flow" d="M280 212 V240"/>
<path class="flow-head" d="M280 252 L273 236 L287 236 Z"/>
<text class="lbl-yes" x="300" y="234">一致</text>

<rect class="stage" x="60" y="260" width="440" height="52"/>
<text class="stage-n" x="80" y="282">第 2 階</text>
<text class="stage-t" x="146" y="282">Probe 連得上 TCP 嗎</text>
<text class="stage-sub" x="146" y="300">先確認 test helper 那一端連得上</text>
<path class="branch" d="M500 286 H588"/>
<path class="branch-head" d="M600 286 L584 279 L584 293 Z"/>
<text class="lbl-no" x="544" y="276" text-anchor="middle">連不上</text>
<rect class="hit" x="600" y="260" width="220" height="52"/>
<text class="hit-code mono" x="710" y="284" text-anchor="middle">blocking: "tcp_ip"</text>
<text class="hit-sub" x="710" y="302" text-anchor="middle">連不到目標位址</text>

<path class="flow" d="M280 312 V340"/>
<path class="flow-head" d="M280 352 L273 336 L287 336 Z"/>
<text class="lbl-yes" x="300" y="334">連得上</text>

<rect class="stage" x="60" y="360" width="440" height="52"/>
<text class="stage-n" x="80" y="382">第 3 階</text>
<text class="stage-t" x="146" y="382">HTTP 階段成功嗎</text>
<text class="stage-sub" x="146" y="400">請求送得出去，也收得到回應</text>
<path class="branch" d="M500 386 H588"/>
<path class="branch-head" d="M600 386 L584 379 L584 393 Z"/>
<text class="lbl-no" x="544" y="376" text-anchor="middle">失敗</text>
<rect class="hit" x="600" y="360" width="220" height="52"/>
<text class="hit-code mono" x="710" y="384" text-anchor="middle">blocking: "http-failure"</text>
<text class="hit-sub" x="710" y="402" text-anchor="middle">HTTP 階段就斷了</text>

<path class="flow" d="M280 412 V440"/>
<path class="flow-head" d="M280 452 L273 436 L287 436 Z"/>
<text class="lbl-yes" x="300" y="434">成功</text>

<rect class="stage" x="60" y="460" width="440" height="52"/>
<text class="stage-n" x="80" y="482">第 4 階</text>
<text class="stage-t" x="146" y="482">內容跟 test helper 拿到的一樣嗎</text>
<text class="stage-sub" x="146" y="500">比對狀態碼、標題、內文長度與 body</text>
<path class="branch" d="M500 486 H588"/>
<path class="branch-head" d="M600 486 L584 479 L584 493 Z"/>
<text class="lbl-no" x="544" y="476" text-anchor="middle">不一樣</text>
<rect class="hit" x="600" y="460" width="220" height="52"/>
<text class="hit-code mono" x="710" y="484" text-anchor="middle">blocking: "http-diff"</text>
<text class="hit-sub" x="710" y="502" text-anchor="middle">回應被換掉了</text>

<path class="flow" d="M280 512 V536"/>
<path class="flow-head" d="M280 548 L273 532 L287 532 Z"/>
<text class="lbl-yes" x="300" y="530">一樣</text>

<rect class="ok" x="60" y="556" width="440" height="50"/>
<text class="ok-code mono" x="280" y="580" text-anchor="middle">blocking: false　accessible: true</text>
<text class="ok-sub" x="280" y="598" text-anchor="middle">兩邊都正常，內容也相符</text>

<text class="foot" x="600" y="566">判定在哪一階停下，後面就不再比對。</text>
<text class="foot" x="600" y="588">前三種情況下四個 match 欄位</text>
<text class="foot" x="600" y="610">全是 null，原因就在這裡。</text>
</svg>
