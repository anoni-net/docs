<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 654" width="940" height="654" role="img" aria-labelledby="title desc">
<title id="title">Reach and safety collide at four points, so decide which side you want before each attempt</title>
<desc id="desc">The upper half shows four pairs in tension, with what you want on the left and an arrow pointing to its cost on the right. Wanting ordinary people to believe you costs credibility, because credibility comes from a real name, a track record and existing relationships, which are exactly your exposure. Wanting to evade keyword filtering costs comprehension, because distorted wording only reads clearly to people who already agree, keeping you inside your own circle. Wanting the content to persuade costs safety, because persuasion rests on specific, checkable detail and specificity is what points back at you. Wanting to reach more people costs risk, because a wider spread moves closer to the thresholds written into the relevant provisions and makes you more likely to be treated as a priority case. The lower half gives three orientations: to leave a record, prioritise archiving the content outside the jurisdiction and keep the publisher's visibility as low as possible; to persuade specific people, work privately and at small scale and give up public reach; to spread the content, accept higher risk for the publisher, or hand the material to an existing channel willing to carry it.</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
