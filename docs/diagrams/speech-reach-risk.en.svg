<text class="t-mute sm" x="28" y="40">WHAT YOU WANT</text>
<text class="t-mute sm" x="368" y="40">WHAT IT COSTS</text>
<path class="rule" d="M28 50 H912"/>
<rect class="card-c1" x="28" y="60" width="280" height="73" rx="8"/>
<text class="t-main bd" x="42" y="101.5">Ordinary people to believe you</text>
<path class="arrow" d="M318 96.5 H349"/>
<path class="arrow-h" d="M356 96.5 L348 91 L348 102 Z"/>
<rect class="card-w1" x="368" y="60" width="544" height="73" rx="8"/>
<text class="t-main bd" x="382" y="82">An anonymous account carries little credibility. Credibility comes from a</text>
<text class="t-main bd" x="382" y="99">real name, a</text>
<text class="t-main bd" x="382" y="116">track record and existing relationships, and those are exactly your exposure.</text>
<rect class="card-c1" x="28" y="143" width="280" height="73" rx="8"/>
<text class="t-main bd" x="42" y="184.5">To evade keyword filtering</text>
<path class="arrow" d="M318 179.5 H349"/>
<path class="arrow-h" d="M356 179.5 L348 174 L348 185 Z"/>
<rect class="card-w1" x="368" y="143" width="544" height="73" rx="8"/>
<text class="t-main bd" x="382" y="165">Distorted wording is hard to read. Only people who already agree decode it,</text>
<text class="t-main bd" x="382" y="182">which</text>
<text class="t-main bd" x="382" y="199">keeps you inside your own circle.</text>
<rect class="card-c1" x="28" y="226" width="280" height="73" rx="8"/>
<text class="t-main bd" x="42" y="267.5">Content that persuades</text>
<path class="arrow" d="M318 262.5 H349"/>
<path class="arrow-h" d="M356 262.5 L348 257 L348 268 Z"/>
<rect class="card-w1" x="368" y="226" width="544" height="73" rx="8"/>
<text class="t-main bd" x="382" y="248">Persuasion rests on specific, checkable detail, and specificity is the part</text>
<text class="t-main bd" x="382" y="265">that points</text>
<text class="t-main bd" x="382" y="282">back at you.</text>
<rect class="card-c1" x="28" y="309" width="280" height="73" rx="8"/>
<text class="t-main bd" x="42" y="350.5">To reach more people</text>
<path class="arrow" d="M318 345.5 H349"/>
<path class="arrow-h" d="M356 345.5 L348 340 L348 351 Z"/>
<rect class="card-w1" x="368" y="309" width="544" height="73" rx="8"/>
<text class="t-main bd" x="382" y="331">A wider spread moves closer to the thresholds written into the relevant</text>
<text class="t-main bd" x="382" y="348">provisions,</text>
<text class="t-main bd" x="382" y="365">and makes you more likely to be treated as a priority case.</text>
<text class="t-main h2" x="28" y="412">None of the four has a solution that gets both. Decide which side you want before each attempt.</text>
<rect class="card" x="28" y="426" width="284" height="120" rx="8"/>
<text class="t-main h2" x="42" y="450">To leave a record</text>
<text class="t-main bd" x="42" y="464">Prioritise archiving the content</text>
<text class="t-main bd" x="42" y="481">outside the jurisdiction.</text>
<text class="t-main bd" x="42" y="498">Keep the publisher's visibility</text>
<text class="t-main bd" x="42" y="515">as low as possible.</text>
<rect class="card" x="328" y="426" width="284" height="120" rx="8"/>
<text class="t-main h2" x="342" y="450">To persuade specific people</text>
<text class="t-main bd" x="342" y="464">Work privately and at small scale.</text>
<text class="t-main bd" x="342" y="481">Give up public reach.</text>
<rect class="card" x="628" y="426" width="284" height="120" rx="8"/>
<text class="t-main h2" x="642" y="450">To spread it</text>
<text class="t-main bd" x="642" y="464">Accept higher risk for the publisher.</text>
<text class="t-main bd" x="642" y="481">Or weigh handing the material to an</text>
<text class="t-main bd" x="642" y="498">existing channel willing to carry it.</text>
<text class="t-foot" x="28" y="562">The risk does not land on you alone. Group administrators carry responsibility for what is posted, family and employers get</text>
<text class="t-foot" x="28" y="584">contacted, and other members of the same group can be affected.</text>
<text class="t-foot" x="28" y="606">Onward sharing is the part most often underestimated. Once content is reposted, screenshotted or reworked, the spread leaves</text>
<text class="t-foot" x="28" y="628">your control while responsibility can still return to the original source.</text>
</svg>
