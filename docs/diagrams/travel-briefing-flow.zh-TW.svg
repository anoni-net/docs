<rect class="card-c1" x="28" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="42" y="52">一、開場 prompt</text>
<text class="t-mute sm" x="42" y="84">只填一次</text>
<text class="t-main bd" x="42" y="102">把出發地、目的地與</text>
<text class="t-main bd" x="42" y="119">停留天數換成你的資訊，</text>
<text class="t-main bd" x="42" y="136">日期與身分可留白。</text>
<text class="t-main bd" x="42" y="153">貼給 AI 設定角色。</text>
<text class="t-mute sm" x="42" y="178">兩種版本</text>
<text class="t-main bd" x="42" y="196">完整版給自架與本地 AI。</text>
<text class="t-main bd" x="42" y="213">商業服務版拿掉會讓</text>
<text class="t-main bd" x="42" y="230">對話被記住的細節。</text>
<rect class="card-c2" x="269" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="283" y="52">二、五項調查</text>
<text class="t-mute sm" x="283" y="84">逐項複製貼上，不必改字</text>
<text class="t-main bd" x="283" y="102">數位環境：審查、Tor、</text>
<text class="t-main bd" x="283" y="119">VPN、設備搜查</text>
<text class="t-main bd" x="283" y="136">法律與政治風險</text>
<text class="t-main bd" x="283" y="153">連線與通訊：SIM、eSIM</text>
<text class="t-main bd" x="283" y="170">緊急聯絡與支援網路</text>
<text class="t-main bd" x="283" y="187">實體與監控環境（選用）</text>
<rect class="card-w1" x="510" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="524" y="52">三、核對一手來源</text>
<text class="t-mute sm" x="524" y="84">這一步不能跳過</text>
<text class="t-main bd" x="524" y="102">拿 AI 的答案去對照</text>
<text class="t-main bd" x="524" y="119">文章底部的官方來源。</text>
<text class="t-mute sm" x="524" y="144">一定要核對的四類</text>
<text class="t-main bd" x="524" y="162">緊急電話</text>
<text class="t-main bd" x="524" y="179">法條編號</text>
<text class="t-main bd" x="524" y="196">簽證規則</text>
<text class="t-main bd" x="524" y="213">資費</text>
<rect class="card-ok" x="751" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="765" y="52">四、隨身緊急卡</text>
<text class="t-mute sm" x="765" y="84">離線也拿得到的那一份</text>
<text class="t-main bd" x="765" y="102">把第四項問到的關鍵聯絡</text>
<text class="t-main bd" x="765" y="119">抄成一張卡片。</text>
<text class="t-main bd" x="765" y="136">印出來過塑，皮夾與行李</text>
<text class="t-main bd" x="765" y="153">各放一張。</text>
<text class="t-main bd" x="765" y="170">同步存進手機離線筆記。</text>
<path class="arrow" d="M235 144.5 H256"/>
<path class="arrow-h" d="M263 144.5 L255 139 L255 150 Z"/>
<path class="arrow" d="M476 144.5 H497"/>
<path class="arrow-h" d="M504 144.5 L496 139 L496 150 Z"/>
<path class="arrow" d="M717 144.5 H738"/>
<path class="arrow-h" d="M745 144.5 L737 139 L737 150 Z"/>
<rect class="card-no" x="28" y="275" width="924" height="84" rx="8"/>
<text class="t-main h2" x="44" y="303">AI 會編造電話、法條與資費</text>
<text class="t-main bd" x="44" y="329">語言模型很會「說得很有把握是錯的」。把 AI 的回答當成「我接下來該查哪些東西」的起點，不要當成最終答案。</text>
<text class="t-main bd" x="44" y="346">目的地越冷門、公開資料越少，AI 手上的訓練資料也越少、越容易亂編，偏偏這種地方最需要可靠資訊。</text>
<text class="t-foot" x="28" y="375">這套流程適用任何目的地，跟「東亞東南亞出差」那篇互補：那篇給的是已經查證過的十四地對照，這篇給的是自己查其他地方的方法。</text>
<text class="t-foot" x="28" y="397">問完之後，行前準備照「出差與研討會的數位準備」的分層清單走一次，兩篇合起來才是完整的行前流程。</text>
</svg>
