<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1289" width="400" height="1289" role="img" aria-labelledby="title desc">
<title id="title">新加坡與馬來西亞各有一組具名的法條，實名底層讓換假名失效</title>
<desc id="desc">左右兩欄分別列出新加坡與馬來西亞管到網路言論的法條。新加坡有 POFMA、FICA、誹謗與藐視法庭，以及《公共秩序法》對集會的寬鬆定義。馬來西亞有 1998 年通訊與多媒體法第 233 條、1948 年煽動法、SOSMA、1966 年社團法，以及各州的宗教執法。下方的橫幅指出兩國共同的實名底層：新加坡的 Singpass、馬來西亞的 MyKad 與 MyDigital ID，加上兩國都強制 SIM 卡實名，帳號、裝置與付款方式往往早就指向法律上的本名。最下方的橫幅說明能見度與組織程度會放大風險，低觸及的貼文、爆紅的貼文與有協調的行動，三者的風險層級不同。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<text class="t-main h1" x="12" y="22">新加坡</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-n" x="12" y="44" width="376" height="37" rx="8"/>
<text class="t-mute bd" x="26" y="67">以下是要對照檢查的法條，並未窮盡所有可能適用的法律。</text>
<rect class="card-c1" x="12" y="91" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="115">POFMA，防止網路假訊息和網路操縱法令，2019</text>
<text class="t-mute bd" x="26" y="132">部長可對「不實事實陳述」發出更正或下架指示。</text>
<text class="t-mute bd" x="26" y="149">多數發文者遇到的是更正通知或內容被移除。</text>
<text class="t-mute bd" x="26" y="166">2026 年首度出現刑事指控，無視指示本身就構成犯罪。</text>
<rect class="card-c1" x="12" y="190" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="214">FICA，防止外來干預（對應措施）法令，2021</text>
<text class="t-mute bd" x="26" y="231">針對有組織或有外國連結的政治行為者，對</text>
<text class="t-mute bd" x="26" y="248">跨境組織者的意義大於對單一則政治留言。</text>
<rect class="card-c1" x="12" y="272" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="296">誹謗與藐視法庭</text>
<text class="t-mute bd" x="26" y="313">民事與刑事誹謗，加上《司法（保護）法》的藐視法庭條款。</text>
<text class="t-mute bd" x="26" y="330">評論官員與進行中案件時的實際限制。</text>
<rect class="card-c1" x="12" y="354" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="378">《公共秩序法》的公開集會</text>
<text class="t-mute bd" x="26" y="395">對集會的定義寬鬆，可以涵蓋線上動員。</text>
<text class="t-mute bd" x="26" y="412">曾有室內論壇因為線上直播被認定為非法集會。</text>
<text class="t-main h1" x="12" y="466">馬來西亞</text>
<path class="rule" d="M12 476 H388"/>
<rect class="card-n" x="12" y="488" width="376" height="37" rx="8"/>
<text class="t-mute bd" x="26" y="511">條文管得到轉發與留言，不限於自己寫的內容。</text>
<rect class="card-w1" x="12" y="535" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="559">1998 年通訊與多媒體法（CMA）第 233 條</text>
<text class="t-mute bd" x="26" y="576">對付網路言論最常被使用的條文。2025 年 2 月修</text>
<text class="t-mute bd" x="26" y="593">法後，罰金最高 RM500,000 或兩年以下有期徒刑。</text>
<text class="t-mute bd" x="26" y="610">2026 年聯邦法院要求檢方證明真正的意圖。</text>
<rect class="card-w1" x="12" y="634" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="658">1948 年煽動法</text>
<text class="t-mute bd" x="26" y="675">殖民時期留下的法律，至今仍然有效且持續被使用。</text>
<text class="t-mute bd" x="26" y="692">適用於 3R 議題：種族 race、</text>
<text class="t-mute bd" x="26" y="709">宗教 religion、王室 royalty。</text>
<rect class="card-w1" x="12" y="733" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="757">SOSMA，2012 年安全罪行（特別措施）法</text>
<text class="t-mute bd" x="26" y="774">為安全罪行提供特別程序，包含延長羈押。</text>
<text class="t-mute bd" x="26" y="791">適用對象是恐怖主義與國安犯罪，日常言論案件用不到。</text>
<rect class="card-w1" x="12" y="815" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="839">1966 年社團法</text>
<text class="t-mute bd" x="26" y="856">有成員、有幹部、有持續活動的組織才可能</text>
<text class="t-mute bd" x="26" y="873">落入其中。一次性的 hashtag 不構成社團。</text>
<rect class="card-w1" x="12" y="897" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="921">各州的宗教執法</text>
<text class="t-mute bd" x="26" y="938">各州伊斯蘭宗教機關執行只適用於穆斯林的 Syariah 罪行。</text>
<text class="t-mute bd" x="26" y="955">與煽動法的 3R 範圍是兩套不同的機制。</text>
<rect class="card" x="12" y="987" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="1011">兩國共同的實名底層</text>
<text class="t-mute bd" x="26" y="1028">新加坡的 Singpass、馬來西亞的 MyKad 與 MyDigital</text>
<text class="t-mute bd" x="26" y="1045">ID 這類國家數位身分，加上兩國都強制 SIM 卡實名。</text>
<text class="t-mute bd" x="26" y="1062">帳號、裝置與付款方式往往早就指向法律</text>
<text class="t-mute bd" x="26" y="1079">上的本名。在實名帳號上換一個顯示名稱</text>
<text class="t-mute bd" x="26" y="1096">並不構成區隔，區隔要從一開始就建立。</text>
<rect class="card-no" x="12" y="1120" width="376" height="157" rx="8"/>
<text class="t-main h2" x="26" y="1144">風險隨能見度與組織程度上升</text>
<text class="t-mute bd" x="26" y="1161">低觸及的貼文、爆紅的貼文、有協調的行動，三者的</text>
<text class="t-mute bd" x="26" y="1178">風險層級不同。記錄到的執法多半落在公眾人物、行</text>
<text class="t-mute bd" x="26" y="1195">動者與組織者身上，或者落在傳得很遠的貼文上。</text>
<text class="t-mute bd" x="26" y="1212">一般低能見度的貼文被追究的機率較低，機率低</text>
<text class="t-mute bd" x="26" y="1229">不等於安全，而且 2026 年的趨勢是起訴變多。</text>
<text class="t-mute bd" x="26" y="1246">人在海外不代表構不到。新加坡的外來干預框架與</text>
<text class="t-mute bd" x="26" y="1263">POFMA 明文主張域外效力，馬來西亞的條文也寫得寬。</text>
</svg>
