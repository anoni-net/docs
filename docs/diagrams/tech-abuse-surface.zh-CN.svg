<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 574" width="980" height="574" role="img" aria-labelledby="title desc">
<title id="title">科技滥用走的是四类一般消费性功能</title>
<desc id="desc">四个并排的方框，列出亲密关系中的科技滥用最常走的四类渠道，全部都是为家庭与伴侣设计的一般功能。第一类是账号存取与共用方案，包含对方知道或猜得到的密码、共用的 Apple ID 或 Google 账号、Apple 家人共享与运营商家庭套餐、Google Family Link，以及密码重设信寄到共用号码或共用信箱这条救援渠道。第二类是位置追踪，包含查找与 Google 地图的位置共享、AirTag 这类蓝牙追踪器、车联网 App、共用日历与照片的地理标记。第三类是设备上的追踪类 App，在对方短暂取得手机时安装，暗中转发消息、通话记录、照片、浏览行为与位置，而且可以完全不显示图标。第四类是智能家居与共用设备，包含智能锁、摄像头、门铃、温控、语音助理与共用的流媒体账号。下方的蓝框指出最可靠的信号往往是对方知道了他不该知道的事，并提醒离开受暴关系的前后是最危险的时期。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #607d8b; }
  .t-foot { fill: #546e7a; font-size: 13px; }
  .t-inv  { fill: #ffffff; }
  .h1 { font-size: 15px; font-weight: 700; }
  .h2 { font-size: 13.5px; font-weight: 700; }
  .bd { font-size: 12.5px; }
  .sm { font-size: 11.5px; }
  .card    { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-n  { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .rule    { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
