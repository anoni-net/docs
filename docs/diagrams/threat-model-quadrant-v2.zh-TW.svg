<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 686" width="400" height="686" role="img" aria-labelledby="title desc">
<title id="title">威脅模型填完之後長什麼樣子的模擬結果</title>
<desc id="desc">一張四象限圖，橫軸是這個資產與對手組合的實際威脅由低到高，縱軸是你現在的防護由薄到厚。左上是過度防護，可以放掉，例子是家庭群組閒聊對國家級情報監控、追劇紀錄對執法調閱。右上是防住了，保持現狀，例子是銀行帳戶對詐騙集團、主要 email 對帳號盜用。左下是可以接受，暫時不用處理，例子是公開貼文對隨意路人、看過哪些新聞對廣告追蹤。右下是還沒補上，這一格就是下一步要做的事，例子是雲端相簿對平台資料外洩、舊帳號重複使用的密碼對撞庫攻擊。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="24">兩個軸，先量威脅再量防護</text>
<text class="t-mute bd" x="26" y="41">橫軸是這個組合的實際威脅，從低到</text>
<text class="t-mute bd" x="26" y="58">高。縱軸是你現在的防護，從厚到薄。</text>
<text class="t-mute bd" x="26" y="75">把「要保護的東西」跟「對手是</text>
<text class="t-mute bd" x="26" y="92">誰」配成一組，才落得進某一格。</text>
<rect class="card-n" x="12" y="120" width="376" height="131" rx="8"/>
<text class="t-main lab" x="26" y="144">威脅低，防護厚</text>
<text class="t-main h2" x="26" y="164">過度防護</text>
<text class="t-mute bd" x="26" y="182">成本花在這裡回收不了，可以放掉</text>
<text class="t-main lab" x="26" y="203">例子</text>
<text class="t-mute bd" x="36" y="220">家庭群組閒聊，對手是國家級情報監控</text>
<text class="t-mute bd" x="36" y="237">追劇紀錄，對手是執法調閱</text>
<rect class="card-ok" x="12" y="261" width="376" height="131" rx="8"/>
<text class="t-main lab" x="26" y="285">威脅高，防護厚</text>
<text class="t-main h2" x="26" y="305">已經防住</text>
<text class="t-mute bd" x="26" y="323">保持現狀，定期回頭確認還有效</text>
<text class="t-main lab" x="26" y="344">例子</text>
<text class="t-mute bd" x="36" y="361">銀行帳戶，對手是詐騙集團</text>
<text class="t-mute bd" x="36" y="378">主要 email，對手是帳號盜用</text>
<rect class="card-c1" x="12" y="402" width="376" height="131" rx="8"/>
<text class="t-main lab" x="26" y="426">威脅低，防護薄</text>
<text class="t-main h2" x="26" y="446">可以接受</text>
<text class="t-mute bd" x="26" y="464">知道有風險，決定先不處理</text>
<text class="t-main lab" x="26" y="485">例子</text>
<text class="t-mute bd" x="36" y="502">公開貼文，對手是隨意路人</text>
<text class="t-mute bd" x="36" y="519">看過哪些新聞，對手是廣告追蹤</text>
<rect class="card-no" x="12" y="543" width="376" height="131" rx="8"/>
<text class="t-main lab" x="26" y="567">威脅高，防護薄</text>
<text class="t-main h2" x="26" y="587">還沒補上</text>
<text class="t-mute bd" x="26" y="605">這一格就是你的下一步</text>
<text class="t-main lab" x="26" y="626">例子</text>
<text class="t-mute bd" x="36" y="643">雲端相簿，對手是平台資料外洩</text>
<text class="t-mute bd" x="36" y="660">舊帳號重複使用的密碼，對手是撞庫攻擊</text>
</svg>
