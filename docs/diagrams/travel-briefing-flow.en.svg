<rect class="card-c1" x="28" y="28" width="191" height="369" rx="8"/>
<text class="t-main h2" x="42" y="52">1. The opening prompt</text>
<text class="t-mute sm" x="42" y="84">Filled in once</text>
<text class="t-main bd" x="42" y="102">Replace the origin,</text>
<text class="t-main bd" x="42" y="119">destination and length</text>
<text class="t-main bd" x="42" y="136">of stay with your own</text>
<text class="t-main bd" x="42" y="153">details. Dates and</text>
<text class="t-main bd" x="42" y="170">identity can be left</text>
<text class="t-main bd" x="42" y="187">blank.</text>
<text class="t-main bd" x="42" y="204">Paste it to the AI to</text>
<text class="t-main bd" x="42" y="221">set the role.</text>
<text class="t-mute sm" x="42" y="246">TWO VERSIONS</text>
<text class="t-main bd" x="42" y="264">The full version for</text>
<text class="t-main bd" x="42" y="281">self-hosted and local</text>
<text class="t-main bd" x="42" y="298">models.</text>
<text class="t-main bd" x="42" y="315">The commercial version</text>
<text class="t-main bd" x="42" y="332">drops details that would</text>
<text class="t-main bd" x="42" y="349">be retained in the</text>
<text class="t-main bd" x="42" y="366">conversation.</text>
<rect class="card-c2" x="259" y="28" width="191" height="369" rx="8"/>
<text class="t-main h2" x="273" y="52">2. Five sets of questions</text>
<text class="t-mute sm" x="273" y="84">Copy and paste, no editing</text>
<text class="t-mute sm" x="273" y="102">needed</text>
<text class="t-main bd" x="273" y="120">Digital environment:</text>
<text class="t-main bd" x="273" y="137">censorship, Tor, VPN,</text>
<text class="t-main bd" x="273" y="154">device searches</text>
<text class="t-main bd" x="273" y="171">Legal and political risk</text>
<text class="t-main bd" x="273" y="188">Connectivity: SIM and</text>
<text class="t-main bd" x="273" y="205">eSIM</text>
<text class="t-main bd" x="273" y="222">Emergency contacts and</text>
<text class="t-main bd" x="273" y="239">support</text>
<text class="t-main bd" x="273" y="256">Physical and</text>
<text class="t-main bd" x="273" y="273">surveillance environment</text>
<text class="t-main bd" x="273" y="290">(optional)</text>
<rect class="card-w1" x="490" y="28" width="191" height="369" rx="8"/>
<text class="t-main h2" x="504" y="52">3. Check the primary sources</text>
<text class="t-mute sm" x="504" y="84">Do not skip this step</text>
<text class="t-main bd" x="504" y="102">Take the AI's answers to</text>
<text class="t-main bd" x="504" y="119">the official sources</text>
<text class="t-main bd" x="504" y="136">listed at the foot of</text>
<text class="t-main bd" x="504" y="153">the article.</text>
<text class="t-mute sm" x="504" y="178">ALWAYS VERIFY</text>
<text class="t-main bd" x="504" y="196">Emergency numbers</text>
<text class="t-main bd" x="504" y="213">Statute references</text>
<text class="t-main bd" x="504" y="230">Visa rules</text>
<text class="t-main bd" x="504" y="247">Tariffs</text>
<rect class="card-ok" x="721" y="28" width="191" height="369" rx="8"/>
<text class="t-main h2" x="735" y="52">4. The emergency card</text>
<text class="t-mute sm" x="735" y="84">The copy that works</text>
<text class="t-mute sm" x="735" y="102">offline</text>
<text class="t-main bd" x="735" y="120">Copy the key contacts</text>
<text class="t-main bd" x="735" y="137">from the fourth set of</text>
<text class="t-main bd" x="735" y="154">questions onto a card.</text>
<text class="t-main bd" x="735" y="171">Print and laminate it,</text>
<text class="t-main bd" x="735" y="188">one in your wallet and</text>
<text class="t-main bd" x="735" y="205">one in your luggage.</text>
<text class="t-main bd" x="735" y="222">Store a copy in an</text>
<text class="t-main bd" x="735" y="239">offline note.</text>
