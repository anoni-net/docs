<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" role="img" aria-labelledby="title desc">
<title id="title">Four steps from the opening prompt to a card in your wallet</title>
<desc id="desc">Four steps side by side, joined by arrows. Step one is the opening prompt: replace the origin, destination and length of stay with your own details and paste it to the AI to set the role. You only fill this in once. Step two is five sets of questions, copied and pasted item by item with no editing: the digital environment covering censorship, Tor, VPN and device searches; legal and political risk; connectivity and communication covering SIM and eSIM; emergency contacts and support networks; and, optionally, the physical and surveillance environment. Step three is checking against primary sources, taking the AI's answers to the official sources listed at the foot of the article, with emergency numbers, statute references, visa rules and tariffs always verified. Step four is the emergency card: copy the key contacts from the fourth set of questions onto a card, print and laminate it, keep one in your wallet and one in your luggage, and store a copy in an offline note on your phone. The red box at the bottom warns that AI invents phone numbers, statutes and tariffs.</desc>
