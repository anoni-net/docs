<rect class="card-no" x="28" y="343" width="1064" height="101" rx="8"/>
<text class="t-main h2" x="44" y="371">AI invents phone numbers, statutes and tariffs</text>
<text class="t-main bd" x="44" y="397">Language models are very good at being confidently wrong. Treat the answers as a list of what to look up next rather than as the final answer.</text>
<text class="t-main bd" x="44" y="414">The more obscure the destination and the thinner the public record, the less training data the model has and the more it invents, which is exactly where</text>
<text class="t-main bd" x="44" y="431">reliable information matters most.</text>
<text class="t-foot" x="28" y="460">This works for any destination and complements the East and Southeast Asia article: that one gives a verified comparison of fourteen places, this one</text>
<text class="t-foot" x="28" y="482">gives the method for checking anywhere else.</text>
<text class="t-foot" x="28" y="504">Once you have the answers, run through the tiered checklist in the business travel article. The two together make a complete pre-departure routine.</text>
</svg>
