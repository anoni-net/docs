<rect class="card-c1" x="28" y="28" width="236" height="301" rx="8"/>
<text class="t-main h2" x="42" y="52">1. The opening prompt</text>
<text class="t-mute sm" x="42" y="84">Filled in once</text>
<text class="t-main bd" x="42" y="102">Replace the origin, destination</text>
<text class="t-main bd" x="42" y="119">and length of stay with your</text>
<text class="t-main bd" x="42" y="136">own details. Dates and identity</text>
<text class="t-main bd" x="42" y="153">can be left blank.</text>
<text class="t-main bd" x="42" y="170">Paste it to the AI to set the</text>
<text class="t-main bd" x="42" y="187">role.</text>
<text class="t-mute sm" x="42" y="212">TWO VERSIONS</text>
<text class="t-main bd" x="42" y="230">The full version for</text>
<text class="t-main bd" x="42" y="247">self-hosted and local models.</text>
<text class="t-main bd" x="42" y="264">The commercial version drops</text>
<text class="t-main bd" x="42" y="281">details that would be retained</text>
<text class="t-main bd" x="42" y="298">in the conversation.</text>
<rect class="card-c2" x="304" y="28" width="236" height="301" rx="8"/>
<text class="t-main h2" x="318" y="52">2. Five sets of questions</text>
<text class="t-mute sm" x="318" y="84">Copy and paste, no editing needed</text>
<text class="t-main bd" x="318" y="102">Digital environment:</text>
<text class="t-main bd" x="318" y="119">censorship, Tor, VPN, device</text>
<text class="t-main bd" x="318" y="136">searches</text>
<text class="t-main bd" x="318" y="153">Legal and political risk</text>
<text class="t-main bd" x="318" y="170">Connectivity: SIM and eSIM</text>
<text class="t-main bd" x="318" y="187">Emergency contacts and support</text>
<text class="t-main bd" x="318" y="204">Physical and surveillance</text>
<text class="t-main bd" x="318" y="221">environment (optional)</text>
<rect class="card-w1" x="580" y="28" width="236" height="301" rx="8"/>
<text class="t-main h2" x="594" y="52">3. Check the primary sources</text>
<text class="t-mute sm" x="594" y="84">Do not skip this step</text>
<text class="t-main bd" x="594" y="102">Take the AI's answers to the</text>
<text class="t-main bd" x="594" y="119">official sources listed at the</text>
<text class="t-main bd" x="594" y="136">foot of the article.</text>
<text class="t-mute sm" x="594" y="161">ALWAYS VERIFY</text>
<text class="t-main bd" x="594" y="179">Emergency numbers</text>
<text class="t-main bd" x="594" y="196">Statute references</text>
<text class="t-main bd" x="594" y="213">Visa rules</text>
<text class="t-main bd" x="594" y="230">Tariffs</text>
<rect class="card-ok" x="856" y="28" width="236" height="301" rx="8"/>
<text class="t-main h2" x="870" y="52">4. The emergency card</text>
<text class="t-mute sm" x="870" y="84">The copy that works offline</text>
<text class="t-main bd" x="870" y="102">Copy the key contacts from the</text>
<text class="t-main bd" x="870" y="119">fourth set of questions onto a</text>
<text class="t-main bd" x="870" y="136">card.</text>
<text class="t-main bd" x="870" y="153">Print and laminate it, one in</text>
<text class="t-main bd" x="870" y="170">your wallet and one in your</text>
<text class="t-main bd" x="870" y="187">luggage.</text>
<text class="t-main bd" x="870" y="204">Store a copy in an offline</text>
<text class="t-main bd" x="870" y="221">note.</text>
