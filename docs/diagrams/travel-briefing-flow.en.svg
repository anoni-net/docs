<rect class="card-no" x="28" y="411" width="884" height="118" rx="8"/>
<text class="t-main h2" x="44" y="439">AI invents phone numbers, statutes and tariffs</text>
<text class="t-main bd" x="44" y="465">Language models are very good at being confidently wrong. Treat the answers as a list of what to look up next rather than as the</text>
<text class="t-main bd" x="44" y="482">final answer.</text>
<text class="t-main bd" x="44" y="499">The more obscure the destination and the thinner the public record, the less training data the model has and the more it</text>
<text class="t-main bd" x="44" y="516">invents, which is exactly where reliable information matters most.</text>
<text class="t-foot" x="28" y="545">This works for any destination and complements the East and Southeast Asia article: that one gives a verified comparison of</text>
<text class="t-foot" x="28" y="567">fourteen places, this one gives the method for checking anywhere else.</text>
<text class="t-foot" x="28" y="589">Once you have the answers, run through the tiered checklist in the business travel article. The two together make a complete</text>
<text class="t-foot" x="28" y="611">pre-departure routine.</text>
</svg>
