<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 565" width="400" height="565" role="img" aria-labelledby="title desc">
<title id="title">場景層的閱讀地圖，先做到共同基準再依身分往上走</title>
<desc id="desc">上方是共同基準「一般人平常該做到什麼」，所有讀者從這篇開始，其餘各篇都假設你已經做到它。往下分成四組場景。第一組依你的角色：記者保護消息來源、社運行動者的數位準備、選舉觀察員的自保、倡議組織的匿名捐款管道。第二組依你的處境：LGBTQ+ 與性少數的匿名社交、家暴受害者的數位準備。第三組依你在哪裡發言：在中國大陸的公開平台傳播資訊、在新加坡與馬來西亞的網路發言。第四組依移動與外部事件：出差與研討會的數位準備、出國前用 AI 自助產生目的地概況、網路中斷時的準備與應對。同一個人可能同時落在好幾組，各篇之間互相引用，可以照需要挑著讀。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="126" rx="8"/>
<text class="t-main lab" x="26" y="24">共同基準</text>
<text class="t-main h2" x="26" y="44">一般人平常該做到什麼</text>
<text class="t-mute bd" x="26" y="61">找不到符合自己身分的那一篇，先看這</text>
<text class="t-mute bd" x="26" y="78">一篇。其餘各篇都假設你已經做到它。</text>
<text class="t-mute bd" x="26" y="95">內容是三種對手的差別、依實際效果排序的做法、</text>
<text class="t-mute bd" x="26" y="112">被高估的做法，以及什麼時候該把標準拉高。</text>
<text class="t-main h1" x="12" y="162">依身分與處境分支，同一個人可能落在好幾組</text>
<path class="rule" d="M12 172 H388"/>
<rect class="card-n" x="12" y="184" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="208">依你的角色</text>
<text class="t-mute bd" x="26" y="225">記者保護消息來源</text>
<text class="t-mute bd" x="26" y="242">社運行動者的數位準備</text>
<text class="t-mute bd" x="26" y="259">選舉觀察員的自保</text>
<text class="t-mute bd" x="26" y="276">倡議組織的匿名捐款管道</text>
<rect class="card-n" x="12" y="300" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="324">依你的處境</text>
<text class="t-mute bd" x="26" y="341">LGBTQ+ 與性少數的匿名社交</text>
<text class="t-mute bd" x="26" y="358">家暴受害者的數位準備</text>
<rect class="card-n" x="12" y="382" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="406">依你在哪裡發言</text>
<text class="t-mute bd" x="26" y="423">在中國大陸的公開平台傳播資訊</text>
<text class="t-mute bd" x="26" y="440">在新加坡與馬來西亞的網路發言</text>
<rect class="card-n" x="12" y="464" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="488">依移動與外部事件</text>
<text class="t-mute bd" x="26" y="505">出差與研討會的數位準備</text>
<text class="t-mute bd" x="26" y="522">出國前用 AI 產生目的地概況</text>
<text class="t-mute bd" x="26" y="539">網路中斷時的準備與應對</text>
</svg>
