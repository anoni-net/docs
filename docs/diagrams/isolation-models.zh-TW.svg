<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 452" width="970" height="452" role="img" aria-labelledby="title desc">
<title id="title">Tails、Whonix、Qubes 三種隔離結構長得不一樣</title>
<desc id="desc">三個系統的結構對照。Tails 是整機重置，從 USB 開機，一次工作階段全部在裡面，關機後整個消失，全部流量強制走 Tor。Whonix 是在你原本的作業系統裡架兩台虛擬機，Workstation 給你做事，它的流量只能經過 Gateway 出去，Gateway 強制走 Tor，主機系統照常使用。Qubes 是用 Xen hypervisor 把一台電腦切成多個獨立的 qube，工作、個人、金融各自一個，要走 Tor 的話另外裝一個 Whonix qube。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。cyan 標的是強制走 Tor 的那一塊，
     跟站上其他示意圖的語意一致。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .sys { fill: #212121; font-size: 18px; font-weight: 700; }
  .sys-sub { fill: #546e7a; font-size: 12.5px; }
  .outer { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.4; }
  .outer-gone { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .outer-lbl { fill: #78909c; font-size: 11.5px; }
  .inner { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.2; }
  .inner-tor { fill: #e6f4fb; stroke: #0089bf; stroke-width: 1.4; }
  .inner-lbl { fill: #212121; font-size: 13.5px; font-weight: 600; }
  .inner-note { fill: #78909c; font-size: 11px; }
  .flow { stroke: #0089bf; stroke-width: 1.8; fill: none; }
  .flow-head { fill: #0089bf; }
  .flow-lbl { fill: #0089bf; font-size: 11.5px; font-weight: 600; }
  .foot { fill: #546e7a; font-size: 12.5px; }

  @media (prefers-color-scheme: dark) {
    .sys { fill: #eceff1; }
    .sys-sub { fill: #b0bec5; }
    .outer { fill: #23292e; stroke: #4b565e; }
    .outer-gone { fill: #23292e; stroke: #4b565e; }
    .outer-lbl { fill: #90a4ae; }
    .inner { fill: #2c343a; stroke: #4b565e; }
    .inner-tor { fill: #0d2b38; stroke: #4dbfff; }
    .inner-lbl { fill: #eceff1; }
    .inner-note { fill: #90a4ae; }
    .flow { stroke: #4dbfff; }
    .flow-head { fill: #4dbfff; }
    .flow-lbl { fill: #4dbfff; }
    .foot { fill: #b0bec5; }
  }
</style>

<text class="sys"     x="30" y="42">Tails</text>
<text class="sys-sub" x="30" y="62">整機重置</text>
<rect class="outer-gone" x="30" y="80" width="280" height="230" rx="9"/>
<text class="outer-lbl" x="46" y="102">一次工作階段，從 USB 開機</text>
<rect class="inner" x="52" y="116" width="236" height="120" rx="7"/>
<text class="inner-lbl"  x="170" y="168" text-anchor="middle">你的全部工作</text>
<text class="inner-note" x="170" y="188" text-anchor="middle">瀏覽、檔案、通訊都在這裡</text>
<text class="flow-lbl"  x="170" y="256" text-anchor="middle">全部流量強制走 Tor</text>
<text class="outer-lbl" x="170" y="280" text-anchor="middle">關機之後整個消失</text>
<text class="outer-lbl" x="170" y="298" text-anchor="middle">除非另外開 Persistent Storage</text>

<text class="sys"     x="374" y="42">Whonix</text>
<text class="sys-sub" x="374" y="62">兩台虛擬機分工</text>
<rect class="outer" x="374" y="80" width="280" height="230" rx="9"/>
<text class="outer-lbl" x="390" y="102">你原本的作業系統照常使用</text>
<rect class="inner" x="396" y="116" width="236" height="66" rx="7"/>
<text class="inner-lbl"  x="514" y="144" text-anchor="middle">Workstation</text>
<text class="inner-note" x="514" y="164" text-anchor="middle">你在這裡做事，連不到外面</text>
<path class="flow" d="M514 182 V206"/>
<path class="flow-head" d="M514 218 L507 202 L521 202 Z"/>
<rect class="inner-tor" x="396" y="226" width="236" height="66" rx="7"/>
<text class="inner-lbl"  x="514" y="254" text-anchor="middle">Gateway</text>
<text class="inner-note" x="514" y="274" text-anchor="middle">唯一的出口，強制走 Tor</text>

<text class="sys"     x="718" y="42">Qubes OS</text>
<text class="sys-sub" x="718" y="62">一個任務一個 qube</text>
<rect class="outer" x="718" y="80" width="222" height="230" rx="9"/>
<text class="outer-lbl" x="734" y="102">Xen hypervisor 切開硬體</text>
<rect class="inner" x="736" y="116" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="781" y="150" text-anchor="middle">工作</text>
<rect class="inner" x="836" y="116" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="881" y="150" text-anchor="middle">個人</text>
<rect class="inner" x="736" y="186" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="781" y="220" text-anchor="middle">金融</text>
<rect class="inner-tor" x="836" y="186" width="90" height="58" rx="6"/>
<text class="inner-lbl"  x="881" y="213" text-anchor="middle">Whonix</text>
<text class="inner-note" x="881" y="231" text-anchor="middle">要另外裝</text>
<text class="outer-lbl" x="829" y="272" text-anchor="middle">qube 之間預設互不相通</text>
<text class="outer-lbl" x="829" y="292" text-anchor="middle">只有 Whonix 那一個走 Tor</text>

<text class="foot" x="30" y="352">Tails 一小時上手，做完就沒了，適合一次性任務。Whonix 保留工作狀態，跨平台，理解雙 VM 要花半天到一天。</text>
<text class="foot" x="30" y="374">Qubes 把界線畫在硬體層，隔離最徹底，代價是挑硬體（VT-d、建議 16 GB 以上記憶體）與大約一週的適應期。</text>
<text class="foot" x="30" y="396">三套的差別不在誰比較安全，在於界線畫在哪一層，以及你願意為那條界線付出多少。</text>
</svg>
