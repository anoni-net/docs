<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 521" width="400" height="521" role="img" aria-labelledby="title">
<title id="title">前四層的成本與涵蓋範圍剛好相反，第五層不在那條線上</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .card-c1, .card-n, .card-no, .card-ok, .card-w1, .card-w2 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="24">涵蓋越多人，用在一個人身上的成本越低</text>
<text class="t-mute bd" x="26" y="41">四層由上而下，涵蓋面遞減，單一目標的成本遞增。</text>
<rect class="card-no" x="12" y="69" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="93">平台與廣告</text>
<rect class="card-no" x="26" y="103" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="120" text-anchor="middle">涵蓋 所有人</text>
<rect class="card-ok" x="204" y="103" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="120" text-anchor="middle">成本 幾乎是零</text>
<text class="t-mute bd" x="26" y="144">不用挑對象，收越多越划算。</text>
<rect class="card-w2" x="12" y="168" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="192">電信</text>
<rect class="card-no" x="26" y="202" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="218" text-anchor="middle">涵蓋 所有用戶</text>
<rect class="card-ok" x="204" y="202" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="218" text-anchor="middle">成本 本來就在收</text>
<text class="t-main bd" x="26" y="243">通聯與位置依法保存。</text>
<rect class="card-w1" x="12" y="267" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="291">國家與執法</text>
<rect class="card-ok" x="26" y="301" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="318" text-anchor="middle">涵蓋 特定對象</text>
<rect class="card-no" x="204" y="301" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="318" text-anchor="middle">成本 要法院核准</text>
<text class="t-mute bd" x="26" y="342">向業者調取，一次針對特定人。</text>
<rect class="card-c1" x="12" y="366" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="390">商用間諜軟體</text>
<rect class="card-ok" x="26" y="400" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="416" text-anchor="middle">涵蓋 名單很短</text>
<rect class="card-no" x="204" y="400" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="416" text-anchor="middle">成本 一次數萬美元</text>
<text class="t-mute bd" x="26" y="441">授權昂貴，目標清單很短。</text>
<rect class="card-n" x="12" y="471" width="376" height="38" rx="8"/>
<text class="t-mute bd" x="26" y="495">公開來源的情報建檔不在這條規律上。</text>
</svg>
