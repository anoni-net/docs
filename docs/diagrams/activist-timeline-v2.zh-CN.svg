<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 762" width="400" height="762" role="img" aria-labelledby="title desc">
<title id="title">动员前、行动现场、行动之后，三个阶段各有各的准备</title>
<desc id="desc">三个并排的阶段，用箭头串起来，底下有一条横幅代表贯穿全程的跨组织协作。动员前是风险最低、时间最多的阶段，要做的是通信群组的设计与隔离、云端文档先撤到 Cryptpad、密码管理器与账号清单、个人账号的隐私审计、一次性手机的取舍，以及活动公开信息的披露节奏。行动现场要做的是出门前的设备锁定设置、现场拍照与录像的判断、选择 Signal 或离线 mesh，以及紧急联系人与失联流程。行动之后要处理的是删除证据前的合规考量、媒体曝光时的身份管理，以及取得法律支援的渠道。底下的横幅是跨组织协作，贯穿三个阶段，包含信息最小化原则、协作文档与文件交换工具的选择、群组命名与消息政策。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="236" rx="8"/>
<text class="t-main lab" x="26" y="24">动员前准备</text>
<text class="t-main h2" x="26" y="44">风险最低，时间最多</text>
<text class="t-main lab" x="26" y="65">要做的事</text>
<text class="t-mute bd" x="36" y="82">通信群组的设计与隔离</text>
<text class="t-mute bd" x="36" y="99">云端文档先撤到 Cryptpad</text>
<text class="t-mute bd" x="36" y="116">密码管理器与账号清单</text>
<text class="t-mute bd" x="36" y="133">个人账号的隐私审计</text>
<text class="t-mute bd" x="36" y="150">一次性手机的取舍</text>
<text class="t-mute bd" x="36" y="167">活动公开信息的披露节奏</text>
<text class="t-main lab" x="26" y="188">为什么在这里</text>
<text class="t-mute bd" x="36" y="205">多数人卡关的原因，是把 30 分</text>
<text class="t-mute bd" x="36" y="222">钟能做完的事拖到当天才想起来。</text>
<rect class="card-c2" x="12" y="246" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="270">行动现场</text>
<text class="t-main h2" x="26" y="290">来不及做新设置的阶段</text>
<text class="t-main lab" x="26" y="311">要做的事</text>
<text class="t-main bd" x="36" y="328">出门前的设备锁定设置</text>
<text class="t-main bd" x="36" y="345">现场拍照与录像的判断</text>
<text class="t-main bd" x="36" y="362">Signal 与离线 mesh 的选择</text>
<text class="t-main bd" x="36" y="379">紧急联系人与失联流程</text>
<text class="t-main lab" x="26" y="400">为什么在这里</text>
<text class="t-main bd" x="36" y="417">被临检时手机被翻看，群组对话与照片库会一起暴露。</text>
<rect class="card-w1" x="12" y="441" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="465">行动之后</text>
<text class="t-main h2" x="26" y="485">风险不会跟着散场结束</text>
<text class="t-main lab" x="26" y="506">要做的事</text>
<text class="t-mute bd" x="36" y="523">删除「证据」前的合规考量</text>
<text class="t-mute bd" x="36" y="540">媒体曝光时的身份管理</text>
<text class="t-mute bd" x="36" y="557">取得法律支援的渠道</text>
<text class="t-main lab" x="26" y="578">为什么在这里</text>
<text class="t-mute bd" x="36" y="595">抗争结束后被告时，公司会用内部</text>
<text class="t-mute bd" x="36" y="612">IT 记录、门禁卡与存取记录追究。</text>
<rect class="card-n" x="12" y="644" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="668">跨组织协作，三个阶段都适用</text>
<text class="t-mute bd" x="26" y="685">信息最小化原则。协作文档与文件交</text>
<text class="t-mute bd" x="26" y="702">换工具的选择。群组命名与消息政策。</text>
<text class="t-mute bd" x="26" y="719">跨组织协调的协作文档放在一般云盘，后来被</text>
<text class="t-mute bd" x="26" y="736">截图外流到对立阵营，这是实际发生过的情况。</text>
</svg>
