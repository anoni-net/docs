<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 423" width="980" height="423" role="img" aria-labelledby="title desc">
<title id="title">从开场 prompt 到随身紧急卡的四步</title>
<desc id="desc">四个并排的步骤，用箭头串起来。第一步是开场 prompt，把出发地、目的地与停留天数换成你的信息，贴给 AI 设定角色，只需要填一次。第二步是五项调查，逐项复制粘贴即可，内容是数字环境（审查、Tor、VPN、设备搜查）、法律与政治风险、连接与通信（SIM 与 eSIM）、紧急联络与支援网络，以及选用的实体与监控环境。第三步是核对一手来源，拿 AI 的答案去对照文章底部的官方来源，紧急电话、法条编号、签证规则与资费一定要回到一手来源核对。第四步是随身紧急卡，把第四项问到的关键联络抄成卡片，打印出来过塑，钱包与行李各放一张，并同步存进手机离线笔记。最下方的红框提醒 AI 会编造电话、法条与资费。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #607d8b; }
  .t-foot { fill: #546e7a; font-size: 13px; }
  .t-inv  { fill: #ffffff; }
  .h1 { font-size: 15px; font-weight: 700; }
  .h2 { font-size: 13.5px; font-weight: 700; }
  .bd { font-size: 12.5px; }
  .sm { font-size: 11.5px; }
  .card    { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-n  { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .rule    { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow   { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; }
  .tag     { fill: #eceff1; stroke: none; }
  .t-tag   { fill: #455a64; font-size: 11px; font-weight: 700; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #90a4ae; }
    .t-foot { fill: #b0bec5; }
    .t-inv  { fill: #241708; }
    .card    { fill: #23292e; stroke: #4b565e; }
    .card-n  { fill: #1c2226; stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .rule    { stroke: #46515a; }
    .arrow   { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .tag     { fill: #333c43; }
    .t-tag   { fill: #b0bec5; }
  }
</style>

<rect class="card-c1" x="28" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="42" y="52">一、开场 prompt</text>
<text class="t-mute sm" x="42" y="84">只填一次</text>
<text class="t-main bd" x="42" y="102">把出发地、目的地与</text>
<text class="t-main bd" x="42" y="119">停留天数换成你的信息，</text>
<text class="t-main bd" x="42" y="136">日期与身份可留白。</text>
<text class="t-main bd" x="42" y="153">贴给 AI 设定角色。</text>
<text class="t-mute sm" x="42" y="178">两种版本</text>
<text class="t-main bd" x="42" y="196">完整版给自建与本地 AI。</text>
<text class="t-main bd" x="42" y="213">商业服务版拿掉会让</text>
<text class="t-main bd" x="42" y="230">对话被记住的细节。</text>
<rect class="card-c2" x="269" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="283" y="52">二、五项调查</text>
<text class="t-mute sm" x="283" y="84">逐项复制粘贴，不必改字</text>
<text class="t-main bd" x="283" y="102">数字环境：审查、Tor、</text>
<text class="t-main bd" x="283" y="119">VPN、设备搜查</text>
<text class="t-main bd" x="283" y="136">法律与政治风险</text>
<text class="t-main bd" x="283" y="153">连接与通信：SIM、eSIM</text>
<text class="t-main bd" x="283" y="170">紧急联络与支援网络</text>
<text class="t-main bd" x="283" y="187">实体与监控环境（选用）</text>
<rect class="card-w1" x="510" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="524" y="52">三、核对一手来源</text>
<text class="t-mute sm" x="524" y="84">这一步不能跳过</text>
<text class="t-main bd" x="524" y="102">拿 AI 的答案去对照</text>
<text class="t-main bd" x="524" y="119">文章底部的官方来源。</text>
<text class="t-mute sm" x="524" y="144">一定要核对的四类</text>
<text class="t-main bd" x="524" y="162">紧急电话</text>
<text class="t-main bd" x="524" y="179">法条编号</text>
<text class="t-main bd" x="524" y="196">签证规则</text>
<text class="t-main bd" x="524" y="213">资费</text>
<rect class="card-ok" x="751" y="28" width="201" height="233" rx="8"/>
<text class="t-main h2" x="765" y="52">四、随身紧急卡</text>
<text class="t-mute sm" x="765" y="84">离线也拿得到的那一份</text>
<text class="t-main bd" x="765" y="102">把第四项问到的关键联络</text>
<text class="t-main bd" x="765" y="119">抄成一张卡片。</text>
<text class="t-main bd" x="765" y="136">打印出来过塑，钱包与行李</text>
<text class="t-main bd" x="765" y="153">各放一张。</text>
<text class="t-main bd" x="765" y="170">同步存进手机离线笔记。</text>
<path class="arrow" d="M235 144.5 H256"/>
<path class="arrow-h" d="M263 144.5 L255 139 L255 150 Z"/>
<path class="arrow" d="M476 144.5 H497"/>
<path class="arrow-h" d="M504 144.5 L496 139 L496 150 Z"/>
<path class="arrow" d="M717 144.5 H738"/>
<path class="arrow-h" d="M745 144.5 L737 139 L737 150 Z"/>
<rect class="card-no" x="28" y="275" width="924" height="84" rx="8"/>
<text class="t-main h2" x="44" y="303">AI 会编造电话、法条与资费</text>
<text class="t-main bd" x="44" y="329">语言模型很会「说得很有把握是错的」。把 AI 的回答当成「我接下来该查哪些东西」的起点，不要当成最终答案。</text>
<text class="t-main bd" x="44" y="346">目的地越冷门、公开资料越少，AI 手上的训练数据也越少、越容易乱编，偏偏这种地方最需要可靠信息。</text>
<text class="t-foot" x="28" y="375">这套流程适用任何目的地，跟「东亚东南亚出差」那篇互补：那篇给的是已经查证过的十四地对照，这篇给的是自己查其他地方的方法。</text>
<text class="t-foot" x="28" y="397">问完之后，行前准备照「出差与研讨会的数字准备」的分层清单走一次，两篇合起来才是完整的行前流程。</text>
</svg>
