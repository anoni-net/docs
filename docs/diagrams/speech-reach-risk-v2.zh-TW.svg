<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 802" width="400" height="802" role="img" aria-labelledby="title desc">
<title id="title">有效與安全在四個地方直接衝突，每次行動前先決定要哪一邊</title>
<desc id="desc">上半部是四組互相拉扯的組合，左邊是你想要的，箭頭指向右邊的代價。想讓普通人願意相信，代價是匿名帳號的可信度低，可信度來自實名、履歷與既有關係，而這些正是暴露面。想避開關鍵詞過濾，代價是變形後的表達難懂，只有原本就懂的人看得懂，等於留在同溫層。想讓內容有說服力，代價是說服力來自具體、可查證的細節，而具體正是最容易指向你的部分。想觸及更多人，代價是傳播規模越大越接近相關條款的認定門檻，也越可能被列為重點處理對象。下半部是三種取向：要留下紀錄的人優先把內容存檔到境外並把曝光度壓到最低，要說服特定的人的人走私下與小範圍並放棄公開傳播的規模，要擴散的人接受發布者承擔較高風險，或把內容交給願意承擔的既有管道。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<text class="t-main h1" x="12" y="22">四組矛盾，每一組都沒有兩全的解法</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-w1" x="12" y="44" width="376" height="113" rx="8"/>
<text class="t-main lab" x="26" y="68">你想要的</text>
<text class="t-main h2" x="26" y="88">讓普通人願意相信</text>
<text class="t-main lab" x="26" y="109">代價</text>
<text class="t-mute bd" x="36" y="126">匿名帳號的可信度低。可信度來自實名、</text>
<text class="t-mute bd" x="36" y="143">履歷、既有關係，而這些正是暴露面。</text>
<rect class="card-w1" x="12" y="167" width="376" height="113" rx="8"/>
<text class="t-main lab" x="26" y="191">你想要的</text>
<text class="t-main h2" x="26" y="211">避開關鍵詞過濾</text>
<text class="t-main lab" x="26" y="232">代價</text>
<text class="t-mute bd" x="36" y="249">變形後的表達難懂，只有原本就</text>
<text class="t-mute bd" x="36" y="266">懂的人看得懂，等於留在同溫層。</text>
<rect class="card-w1" x="12" y="290" width="376" height="113" rx="8"/>
<text class="t-main lab" x="26" y="314">你想要的</text>
<text class="t-main h2" x="26" y="334">內容有說服力</text>
<text class="t-main lab" x="26" y="355">代價</text>
<text class="t-mute bd" x="36" y="372">說服力來自具體、可查證的細節，</text>
<text class="t-mute bd" x="36" y="389">而具體正是最容易指向你的部分。</text>
<rect class="card-w1" x="12" y="413" width="376" height="113" rx="8"/>
<text class="t-main lab" x="26" y="437">你想要的</text>
<text class="t-main h2" x="26" y="457">觸及更多人</text>
<text class="t-main lab" x="26" y="478">代價</text>
<text class="t-mute bd" x="36" y="495">傳播規模越大，越接近相關條款的認定</text>
<text class="t-mute bd" x="36" y="512">門檻，也越可能被列為重點處理對象。</text>
<text class="t-main h1" x="12" y="566">每次行動前先決定要哪一邊</text>
<path class="rule" d="M12 576 H388"/>
<rect class="card-c1" x="12" y="588" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="612">要留下紀錄</text>
<text class="t-mute bd" x="26" y="629">優先確保內容能被存檔到境外。發布者的曝光度壓到最低。</text>
<rect class="card-c1" x="12" y="653" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="677">要說服特定的人</text>
<text class="t-mute bd" x="26" y="694">走私下與小範圍。放棄公開傳播的規模。</text>
<rect class="card-c1" x="12" y="718" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="742">要擴散</text>
<text class="t-mute bd" x="26" y="759">接受發布者承擔較高風險。或評估</text>
<text class="t-mute bd" x="26" y="776">把內容交給願意承擔的既有管道。</text>
</svg>
