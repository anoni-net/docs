<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="title desc">
<title id="title">有效与安全在四个地方直接冲突，每次行动前先决定要哪一边</title>
<desc id="desc">上半部是四组互相拉扯的组合，左边是你想要的，箭头指向右边的代价。想让普通人愿意相信，代价是匿名账号的可信度低，可信度来自实名、履历与既有关系，而这些正是暴露面。想避开关键词过滤，代价是变形后的表达难懂，只有原本就懂的人看得懂，等于留在同温层。想让内容有说服力，代价是说服力来自具体、可查证的细节，而具体正是最容易指向你的部分。想触及更多人，代价是传播规模越大越接近相关条款的认定门槛，也越可能被列为重点处理对象。下半部是三种取向：要留下记录的人优先把内容存档到境外并把曝光度压到最低，要说服特定的人的人走私下与小范围并放弃公开传播的规模，要扩散的人接受发布者承担较高风险，或把内容交给愿意承担的既有渠道。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #607d8b; }
  .t-foot { fill: #546e7a; font-size: 13px; }
  .t-inv  { fill: #ffffff; }
  .h1 { font-size: 15px; font-weight: 700; }
  .h2 { font-size: 13.5px; font-weight: 700; }
  .bd { font-size: 12.5px; }
  .sm { font-size: 11.5px; }
  .card    { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-n  { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .rule    { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow   { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; }
  .tag     { fill: #eceff1; stroke: none; }
  .t-tag   { fill: #455a64; font-size: 11px; font-weight: 700; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #90a4ae; }
    .t-foot { fill: #b0bec5; }
    .t-inv  { fill: #241708; }
    .card    { fill: #23292e; stroke: #4b565e; }
    .card-n  { fill: #1c2226; stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .rule    { stroke: #46515a; }
    .arrow   { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .tag     { fill: #333c43; }
    .t-tag   { fill: #b0bec5; }
  }
</style>

<text class="t-mute sm" x="28" y="40">你想要的</text>
<text class="t-mute sm" x="338" y="40">代价</text>
<path class="rule" d="M28 50 H912"/>
<rect class="card-c1" x="28" y="60" width="250" height="39" rx="8"/>
<text class="t-main bd" x="42" y="84.5">让普通人愿意相信</text>
<path class="arrow" d="M288 79.5 H319"/>
<path class="arrow-h" d="M326 79.5 L318 74 L318 85 Z"/>
<rect class="card-w1" x="338" y="60" width="574" height="39" rx="8"/>
<text class="t-main bd" x="352" y="82">匿名账号的可信度低。可信度来自实名、履历、既有关系，而这些正是暴露面。</text>
<rect class="card-c1" x="28" y="109" width="250" height="39" rx="8"/>
<text class="t-main bd" x="42" y="133.5">避开关键词过滤</text>
<path class="arrow" d="M288 128.5 H319"/>
<path class="arrow-h" d="M326 128.5 L318 123 L318 134 Z"/>
<rect class="card-w1" x="338" y="109" width="574" height="39" rx="8"/>
<text class="t-main bd" x="352" y="131">变形后的表达难懂，只有原本就懂的人看得懂，等于留在同温层。</text>
<rect class="card-c1" x="28" y="158" width="250" height="39" rx="8"/>
<text class="t-main bd" x="42" y="182.5">内容有说服力</text>
<path class="arrow" d="M288 177.5 H319"/>
<path class="arrow-h" d="M326 177.5 L318 172 L318 183 Z"/>
<rect class="card-w1" x="338" y="158" width="574" height="39" rx="8"/>
<text class="t-main bd" x="352" y="180">说服力来自具体、可查证的细节，而具体正是最容易指向你的部分。</text>
<rect class="card-c1" x="28" y="207" width="250" height="39" rx="8"/>
<text class="t-main bd" x="42" y="231.5">触及更多人</text>
<path class="arrow" d="M288 226.5 H319"/>
<path class="arrow-h" d="M326 226.5 L318 221 L318 232 Z"/>
<rect class="card-w1" x="338" y="207" width="574" height="39" rx="8"/>
<text class="t-main bd" x="352" y="229">传播规模越大，越接近相关条款的认定门槛，也越可能被列为重点处理对象。</text>
<text class="t-main h2" x="28" y="276">四组矛盾都没有两全的解法，每次行动前先决定要哪一边</text>
<rect class="card" x="28" y="290" width="284" height="103" rx="8"/>
<text class="t-main h2" x="42" y="314">要留下记录</text>
<text class="t-main bd" x="42" y="328">优先确保内容能被存档到境外。</text>
<text class="t-main bd" x="42" y="345">发布者的曝光度压到最低。</text>
<rect class="card" x="328" y="290" width="284" height="103" rx="8"/>
<text class="t-main h2" x="342" y="314">要说服特定的人</text>
<text class="t-main bd" x="342" y="328">走私下与小范围。</text>
<text class="t-main bd" x="342" y="345">放弃公开传播的规模。</text>
<rect class="card" x="628" y="290" width="284" height="103" rx="8"/>
<text class="t-main h2" x="642" y="314">要扩散</text>
<text class="t-main bd" x="642" y="328">接受发布者承担较高风险。</text>
<text class="t-main bd" x="642" y="345">或评估把内容交给</text>
<text class="t-main bd" x="642" y="362">愿意承担的既有渠道。</text>
<text class="t-foot" x="28" y="409">风险不只落在你身上。群组管理者对群内内容负有管理责任，家人与雇主可能被联系，同一群组的其他成员可能一并受影响。</text>
<text class="t-foot" x="28" y="431">评估要不要发的时候，二次传播最常被低估。内容被别人转发、截图、改编之后，传播规模脱离你的控制，责任可能仍然回到最初的来源。</text>
</svg>
