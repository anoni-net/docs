<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 950" width="400" height="950" role="img" aria-labelledby="title desc">
<title id="title">IPFS vs Onion：兩種不同的「去中心化」</title>
<desc id="desc">IPFS vs Onion：兩種不同的「去中心化」</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="38" rx="8"/>
<text class="t-main h2" x="26" y="24">IPFS 與 Onion 解的是兩種不同的「去中心化」</text>
<text class="t-main h1" x="12" y="72">IPFS，解抗刪除問題</text>
<path class="rule" d="M12 82 H388"/>
<rect class="card-n" x="12" y="94" width="376" height="225" rx="8"/>
<text class="t-main h2" x="26" y="118">路徑</text>
<rect class="card" x="26" y="124" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="140">瀏覽器</text>
<text class="t-mute bd" x="40" y="164">&#8595;</text>
<rect class="card" x="26" y="170" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="186">IPFS gateway</text>
<text class="t-mute bd" x="40" y="210">&#8595;</text>
<rect class="card-c3" x="26" y="216" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="232">DHT 查詢</text>
<text class="t-main bd" x="36" y="249">誰有 CID xxx</text>
<text class="t-mute bd" x="40" y="273">&#8595;</text>
<rect class="card" x="26" y="279" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="295">持有 CID 的節點</text>
<rect class="card-ok" x="12" y="329" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="353">做得到</text>
<text class="t-mute bd" x="26" y="370">內容竄改可被偵測，CID 就是 hash。</text>
<text class="t-mute bd" x="26" y="387">任何節點都能 pin 提供，沒有單一可下架的點。</text>
<rect class="card-no" x="12" y="409" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="433">做不到</text>
<text class="t-mute bd" x="26" y="450">客戶端 IP 對 gateway 與 peer 可見，沒有內建匿名。</text>
<text class="t-main h1" x="12" y="500">Onion，解連線匿名問題</text>
<path class="rule" d="M12 510 H388"/>
<rect class="card-n" x="12" y="522" width="376" height="271" rx="8"/>
<text class="t-main h2" x="26" y="546">路徑</text>
<rect class="card" x="26" y="552" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="568">Tor Browser</text>
<text class="t-mute bd" x="40" y="592">&#8595;</text>
<rect class="card" x="26" y="598" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="614">Guard</text>
<text class="t-mute bd" x="40" y="638">&#8595;</text>
<rect class="card" x="26" y="644" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="660">Middle</text>
<text class="t-mute bd" x="40" y="684">&#8595;</text>
<rect class="card-c3" x="26" y="690" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="706">Rendezvous point</text>
<text class="t-main bd" x="36" y="723">HSDir 查詢</text>
<text class="t-mute bd" x="40" y="747">&#8595;</text>
<rect class="card" x="26" y="753" width="348" height="24" rx="6"/>
<text class="t-main lab" x="36" y="769">.onion 服務</text>
<rect class="card-ok" x="12" y="803" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="827">做得到</text>
<text class="t-mute bd" x="26" y="844">客戶端 IP 對服務不可見，服務 IP 對客戶端也不可見。</text>
<text class="t-mute bd" x="26" y="861">不依賴 DNS，.onion 位址就是公鑰 hash。</text>
<rect class="card-no" x="12" y="883" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="907">做不到</text>
<text class="t-mute bd" x="26" y="924">內容存活仰賴 Tor 網路與服務本身的維運。</text>
</svg>
