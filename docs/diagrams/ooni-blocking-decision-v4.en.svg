<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 841" width="400" height="841" role="img" aria-labelledby="title">
<title id="title">The four decision stages in web_connectivity, and where each one stops</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-n, .card-ok, .card-w1 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="24">The same URL measured on both sides</text>
<text class="t-mute bd" x="26" y="41">One measurement from your network on the</text>
<text class="t-mute bd" x="26" y="58">probe side, one from outside by the test</text>
<text class="t-mute bd" x="26" y="75">helper, then compared stage by stage.</text>
<rect class="card-n" x="12" y="103" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="127">Stage 1</text>
<text class="t-main h2" x="26" y="147">Do the DNS answers match?</text>
<text class="t-mute bd" x="26" y="165">Comparing the A and AAAA lookups on both sides</text>
<text class="t-main lab" x="26" y="186">They differ →</text>
<text class="t-mute bd" x="36" y="203">blocking: "dns"</text>
<text class="t-mute bd" x="36" y="220">The answers do not line up</text>
<rect class="card-n" x="12" y="244" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="268">Stage 2</text>
<text class="t-main h2" x="26" y="288">Can the probe complete TCP?</text>
<text class="t-mute bd" x="26" y="306">After confirming the test helper connects</text>
<text class="t-main lab" x="26" y="327">It cannot →</text>
<text class="t-mute bd" x="36" y="344">blocking: "tcp_ip"</text>
<text class="t-mute bd" x="36" y="361">Cannot reach the address</text>
<rect class="card-n" x="12" y="385" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="409">Stage 3</text>
<text class="t-main h2" x="26" y="429">Did the HTTP stage succeed?</text>
<text class="t-mute bd" x="26" y="447">The request goes out and a response comes back</text>
<text class="t-main lab" x="26" y="468">It failed →</text>
<text class="t-mute bd" x="36" y="485">blocking: "http-failure"</text>
<text class="t-mute bd" x="36" y="502">It broke at the HTTP stage</text>
<rect class="card-n" x="12" y="526" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="550">Stage 4</text>
<text class="t-main h2" x="26" y="570">Same content as the test helper got?</text>
<text class="t-mute bd" x="26" y="588">Comparing status, title, body length and body</text>
<text class="t-main lab" x="26" y="609">It differs →</text>
<text class="t-mute bd" x="36" y="626">blocking: "http-diff"</text>
<text class="t-mute bd" x="36" y="643">The response was swapped</text>
<rect class="card-ok" x="12" y="673" width="376" height="74" rx="8"/>
<text class="t-main h2" x="26" y="697">All four pass. blocking:</text>
<text class="t-main h2" x="26" y="716">false, accessible: true</text>
<text class="t-mute bd" x="26" y="733">Both sides normal, content matches.</text>
<rect class="card-w1" x="12" y="757" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="781">A stage that fires ends the comparison</text>
<text class="t-mute bd" x="26" y="798">That is why all four match fields</text>
<text class="t-mute bd" x="26" y="815">stay null in the first three cases.</text>
</svg>
