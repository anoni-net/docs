<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="title desc">
<title id="title">通讯工具在身分绑定与 metadata 这两个轴上的落点</title>
<desc id="desc">一张散点图。横轴是身分绑定方式，左边绑手机号码，右边不绑任何可查的身分。纵轴是 metadata 留在哪，下面是中央服务器看得到全部，上面是没有中央服务器可看。LINE、Telegram、WhatsApp 三个对照组落在左下角。Signal 因为 metadata 最小化设计而偏上，身分仍绑手机号码所以偏左。Matrix 落在中间偏下，房间参与的每个 homeserver 都看得到。Session、SimpleX、Briar 落在右上角，身分不绑手机也没有中央服务器掌握谁跟谁在通讯。位置是相对的，不是量测值。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">两个轴，metadata 留在哪与身份怎么绑</text>
<text class="t-mute bd" x="26" y="41">越靠右上，越少人知道你是谁、又在跟谁通信。</text>
<text class="t-mute bd" x="26" y="58">深色点是主名单，浅色点是页面里的对照组。</text>
<rect class="card" x="12" y="84" width="376" height="340" rx="8"/>
<text class="t-mute bd" x="200" y="100" text-anchor="middle">↑ 没有中央服务器可看</text>
<circle class="card-n" cx="34" cy="363" r="6"/>
<text class="t-main bd" x="45" y="367">LINE</text>
<circle class="card-n" cx="64" cy="339" r="6"/>
<text class="t-main bd" x="75" y="343">Telegram</text>
<circle class="card-n" cx="41" cy="306" r="6"/>
<text class="t-main bd" x="52" y="310">WhatsApp</text>
<circle class="card-c3" cx="127" cy="209" r="6"/>
<text class="t-main bd" x="138" y="213">Signal</text>
<circle class="card-c3" cx="182" cy="296" r="6"/>
<text class="t-main bd" x="193" y="300">Matrix</text>
<circle class="card-c3" cx="277" cy="181" r="6"/>
<text class="t-main bd" x="266" y="185" text-anchor="end">Session</text>
<circle class="card-c3" cx="323" cy="146" r="6"/>
<text class="t-main bd" x="312" y="150" text-anchor="end">SimpleX</text>
<circle class="card-c3" cx="366" cy="123" r="6"/>
<text class="t-main bd" x="355" y="127" text-anchor="end">Briar</text>
<text class="t-mute bd" x="200" y="394" text-anchor="middle">↓ 中央服务器看得到全部</text>
<text class="t-mute bd" x="26" y="414">← 绑手机号码</text>
<text class="t-mute bd" x="374" y="414" text-anchor="end">不绑可查的身份 →</text>
<rect class="card-c1" x="12" y="436" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="460">位置是相对的，不是测量值</text>
<text class="t-mute bd" x="26" y="477">Signal 的身份仍绑手机号码。Matrix 的消</text>
<text class="t-mute bd" x="26" y="494">息 metadata 每个 homeserver 都看得到。</text>
</svg>
