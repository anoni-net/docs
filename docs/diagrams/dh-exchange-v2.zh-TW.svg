<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 583" width="400" height="583" role="img" aria-labelledby="title desc">
<title id="title">Diffie-Hellman 金鑰交換</title>
<desc id="desc">Diffie-Hellman 金鑰交換</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">Diffie-Hellman 金鑰交換</text>
<text class="t-mute bd" x="26" y="41">雙方各自挑一個秘密，只交換公</text>
<text class="t-mute bd" x="26" y="58">開值，各自算出同一把共同金鑰。</text>
<rect class="card-c1" x="12" y="84" width="376" height="134" rx="8"/>
<text class="t-main lab" x="26" y="108">Alice</text>
<text class="t-main h2" x="26" y="128">挑秘密 a</text>
<text class="t-main lab" x="26" y="149">送出</text>
<text class="t-mute bd" x="36" y="166">G^a</text>
<text class="t-main lab" x="26" y="187">收到 G^b 之後</text>
<text class="t-mute bd" x="36" y="204">算 (G^b)^a = G^ab</text>
<rect class="card-c1" x="12" y="228" width="376" height="134" rx="8"/>
<text class="t-main lab" x="26" y="252">Bob</text>
<text class="t-main h2" x="26" y="272">挑秘密 b</text>
<text class="t-main lab" x="26" y="293">送出</text>
<text class="t-mute bd" x="36" y="310">G^b</text>
<text class="t-main lab" x="26" y="331">收到 G^a 之後</text>
<text class="t-mute bd" x="36" y="348">算 (G^a)^b = G^ab</text>
<rect class="card-w1" x="12" y="372" width="376" height="134" rx="8"/>
<text class="t-main lab" x="26" y="396">Eve</text>
<text class="t-main h2" x="26" y="416">網路上看得到的</text>
<text class="t-main lab" x="26" y="437">手上有</text>
<text class="t-mute bd" x="36" y="454">G、G^a、G^b</text>
<text class="t-main lab" x="26" y="475">算不出</text>
<text class="t-mute bd" x="36" y="492">G^ab，卡在離散對數困難性</text>
<rect class="card-ok" x="12" y="516" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="540">共同金鑰 G^ab</text>
<text class="t-mute bd" x="26" y="557">兩邊各自算得出來，中間看到全部訊息的人算不出來。</text>
</svg>
