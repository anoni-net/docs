<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" width="400" height="446" role="img" aria-labelledby="title desc">
<title id="title">四層工具之間的關係，哪一層包住哪一層</title>
<desc id="desc">四個工具層的結構關係。連線層的 Tor 工具家族是核心，環境層的匿名作業系統把整個連線層包在裡面，讓系統預設走 Tor 而且關機不留痕跡。觀測層獨立在旁邊，記錄的是連線遇到了什麼，把封鎖與降速轉成有時間、地點、ASN 的公開資料，它不保護連線。日常隱私基本功橫跨在最底下，通訊軟體、密碼管理與匿名支付這些不管你用哪一層都要。四層不是階梯，挑跟情境相關的那一群讀就好。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-c3" x="12" y="0" width="376" height="110" rx="8"/>
<text class="t-main lab" x="26" y="24">環境層</text>
<text class="t-main h2" x="26" y="44">匿名作業系統</text>
<text class="t-main bd" x="26" y="62">Tails、Whonix、Qubes</text>
<text class="t-main bd" x="26" y="79">整個系統預設走 Tor，關機不留痕跡。這一層把下面的連線</text>
<text class="t-main bd" x="26" y="96">層整個包在裡面，所以裝了 Tails 就等於同時有了連線層。</text>
<rect class="card-c2" x="12" y="120" width="376" height="93" rx="8"/>
<text class="t-main lab" x="26" y="144">連線層</text>
<text class="t-main h2" x="26" y="164">Tor 工具家族</text>
<text class="t-main bd" x="26" y="182">Tor Browser、Snowflake、OnionShare、橋接</text>
<text class="t-main bd" x="26" y="199">把連線藏進多層加密與隨機路徑，讓 IP 與行為難以被追蹤。</text>
<rect class="card-c1" x="12" y="223" width="376" height="92" rx="8"/>
<text class="t-main lab" x="26" y="247">基礎層</text>
<text class="t-main h2" x="26" y="267">日常隱私基本功</text>
<text class="t-mute bd" x="26" y="284">通訊軟體選哪個、密碼怎麼管、要匿名付錢</text>
<text class="t-mute bd" x="26" y="301">時用什麼。不管上面用哪一層，這一層都要。</text>
<rect class="card-n" x="12" y="325" width="376" height="109" rx="8"/>
<text class="t-main lab" x="26" y="349">觀測層</text>
<text class="t-main h2" x="26" y="369">OONI</text>
<text class="t-mute bd" x="26" y="386">把封鎖、降速這些感受，轉成有時</text>
<text class="t-mute bd" x="26" y="403">間、地點、ASN 對得上的公開資料。</text>
<text class="t-mute bd" x="26" y="420">它記錄連線遇到了什麼，本身不保護連線。</text>
</svg>
