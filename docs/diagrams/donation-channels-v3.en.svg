<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1056" width="400" height="1056" role="img" aria-labelledby="title desc">
<title id="title">Three collection channels, and a donor's choice depends on who they are avoiding</title>
<desc id="desc">The upper half compares three collection channels an organisation can offer. Cash scores high on anonymity, medium on compliance burden, low on scale and cannot cross borders, suiting small domestic support at events or via a public mailbox. Cryptocurrency scores medium to high on anonymity, high on compliance burden, high on scale and works across borders, suiting cross-border giving. Prepaid gift cards and convenience-store codes score medium on anonymity, low on compliance burden, medium on scale and are domestic only, giving the lowest-friction route for small domestic gifts. The lower half maps four donor threats to channels. Someone hiding the money trail from family or an employer uses cash, prepaid cards or privacy coins and avoids credit cards and joint bank accounts. Someone avoiding an identity record at the organisation uses cash with no email attached, or privacy coins to a self-custodied wallet, and avoids bank transfers because the account name is retained. Someone avoiding cross-border surveillance uses Monero or shielded Zcash and avoids Bitcoin through a centralised exchange. Someone with a simple preference for leaving no record uses any cash route and avoids electronic payment.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .card    { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-n  { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.2; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.2; }
  .rule    { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card    { fill: #23292e; stroke: #4b565e; }
    .card-n  { fill: #1c2226; stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .rule    { stroke: #46515a; }
  }
</style>

<text class="t-main h1" x="12" y="22">For the organisation: what each channel costs</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-c1" x="12" y="44" width="376" height="169" rx="8"/>
<text class="t-main h2" x="26" y="68">Cash</text>
<text class="t-mute bd" x="26" y="86">Public mailbox, events</text>
<rect class="card-ok" x="26" y="96" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="112" text-anchor="middle">Anonymity High</text>
<rect class="card-w1" x="204" y="96" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="112" text-anchor="middle">Compliance Medium</text>
<rect class="card-no" x="26" y="124" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="140" text-anchor="middle">Scale Low</text>
<rect class="card-no" x="204" y="124" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="140" text-anchor="middle">Cross-border No</text>
<text class="t-mute bd" x="26" y="165">Small domestic support, the lowest-friction</text>
<text class="t-mute bd" x="26" y="182">route. Public fundraising rules cover more</text>
<text class="t-mute bd" x="26" y="199">situations than people expect, so check first.</text>
<rect class="card-w1" x="12" y="225" width="376" height="186" rx="8"/>
<text class="t-main h2" x="26" y="249">Cryptocurrency</text>
<text class="t-mute bd" x="26" y="267">Self-custody or a hosted platform</text>
<rect class="card-ok" x="26" y="277" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="294" text-anchor="middle">Anonymity Med-high</text>
<rect class="card-no" x="204" y="277" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="294" text-anchor="middle">Compliance High</text>
<rect class="card-ok" x="26" y="305" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="322" text-anchor="middle">Scale High</text>
<rect class="card-ok" x="204" y="305" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="322" text-anchor="middle">Cross-border Yes</text>
<text class="t-mute bd" x="26" y="346">Cross-border support for organisations abroad.</text>
<text class="t-mute bd" x="26" y="363">VASP registration, anti-money-laundering and</text>
<text class="t-mute bd" x="26" y="380">tax duties are a clear step up. Sort out</text>
<text class="t-mute bd" x="26" y="397">conversion and accounting first.</text>
<rect class="card-n" x="12" y="423" width="376" height="169" rx="8"/>
<text class="t-main h2" x="26" y="447">Prepaid cards and codes</text>
<text class="t-mute bd" x="26" y="465">Gift cards, store codes</text>
<rect class="card-w1" x="26" y="475" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="492" text-anchor="middle">Anonymity Medium</text>
<rect class="card-ok" x="204" y="475" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="492" text-anchor="middle">Compliance Low</text>
<rect class="card-w1" x="26" y="503" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="520" text-anchor="middle">Scale Medium</text>
<rect class="card-w1" x="204" y="503" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="520" text-anchor="middle">Cross-border Domestic</text>
<text class="t-mute bd" x="26" y="544">Small domestic gifts with no crypto involved.</text>
<text class="t-mute bd" x="26" y="561">Most donors give up at the step of acquiring a</text>
<text class="t-mute bd" x="26" y="578">privacy coin, and this route fills that gap.</text>
<text class="t-main h1" x="12" y="622">For the donor: work out who you are avoiding first</text>
<path class="rule" d="M12 632 H388"/>
<rect class="card" x="12" y="644" width="376" height="93" rx="8"/>
<text class="t-main h2" x="26" y="668">Hiding the money trail</text>
<text class="t-main h2" x="26" y="687">from family or an employer</text>
<text class="t-mute bd" x="26" y="705">Use: cash, prepaid cards, privacy coins</text>
<text class="t-mute bd" x="26" y="723">Avoid: credit cards, joint bank accounts</text>
<rect class="card" x="12" y="747" width="376" height="129" rx="8"/>
<text class="t-main h2" x="26" y="771">Avoiding an identity</text>
<text class="t-main h2" x="26" y="790">record at the organisation</text>
<text class="t-mute bd" x="26" y="808">Use: cash with no email attached,</text>
<text class="t-mute bd" x="26" y="826">privacy coins to a self-custodied wallet</text>
<text class="t-mute bd" x="26" y="844">Avoid: bank transfer, which leaves</text>
<text class="t-mute bd" x="26" y="862">the account name on their books</text>
<rect class="card" x="12" y="886" width="376" height="74" rx="8"/>
<text class="t-main h2" x="26" y="910">Avoiding cross-border surveillance</text>
<text class="t-mute bd" x="26" y="928">Use: Monero, shielded Zcash</text>
<text class="t-mute bd" x="26" y="946">Avoid: Bitcoin through a centralised exchange</text>
<rect class="card" x="12" y="970" width="376" height="74" rx="8"/>
<text class="t-main h2" x="26" y="994">A personal preference for leaving no record</text>
<text class="t-mute bd" x="26" y="1012">Use: any cash route</text>
<text class="t-mute bd" x="26" y="1030">Avoid: any electronic payment</text>
</svg>
