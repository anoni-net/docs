<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 455" width="400" height="455" role="img" aria-labelledby="title">
<title id="title">加密蓋住的只有信件內容，信封外面那一圈沒有</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c3, .card-n, .card-no, .card-w1 { stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-w1" x="12" y="0" width="376" height="160" rx="8"/>
<text class="t-mute lab" x="26" y="24">信封外面</text>
<text class="t-main h2" x="26" y="44">不用解密就看得到</text>
<text class="t-mute bd" x="26" y="61">寄件人</text>
<text class="t-mute bd" x="26" y="78">收件人</text>
<text class="t-mute bd" x="26" y="95">時間與長度</text>
<text class="t-mute bd" x="26" y="112">訊息大小</text>
<text class="t-mute bd" x="26" y="129">主旨（多數情況沒有被加密）</text>
<text class="t-mute bd" x="26" y="146">往返頻率</text>
<rect class="card-c3" x="12" y="170" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="194">信件內容</text>
<text class="t-main h2" x="26" y="214">端對端加密，只有收件人讀得到</text>
<rect class="card-no" x="12" y="238" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="262">於是不用讀內容就知道</text>
<text class="t-mute bd" x="26" y="279">你跟某律師事務所有持續通信</text>
<text class="t-mute bd" x="26" y="296">你今晚跟某記者通了 30 分鐘</text>
<text class="t-mute bd" x="26" y="313">這群人是你固定往來的圈子</text>
<rect class="card-n" x="12" y="337" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="361">加密蓋住的只有中間那一塊</text>
<text class="t-mute bd" x="26" y="378">信封外面那一圈是每一封信、每一通</text>
<text class="t-mute bd" x="26" y="395">電話、每一次連線都會留下的副產品。</text>
<text class="t-mute bd" x="26" y="412">同一個結構套用在電話、Signal 訊息、</text>
<text class="t-mute bd" x="26" y="429">Tor 連線上都成立，只是欄位的名字換掉。</text>
</svg>
