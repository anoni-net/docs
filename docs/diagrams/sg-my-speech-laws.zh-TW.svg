<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 697" width="980" height="697" role="img" aria-labelledby="title desc">
<title id="title">新加坡與馬來西亞各有一組具名的法條，實名底層讓換假名失效</title>
<desc id="desc">左右兩欄分別列出新加坡與馬來西亞管到網路言論的法條。新加坡有 POFMA、FICA、誹謗與藐視法庭，以及《公共秩序法》對集會的寬鬆定義。馬來西亞有 1998 年通訊與多媒體法第 233 條、1948 年煽動法、SOSMA、1966 年社團法，以及各州的宗教執法。下方的橫幅指出兩國共同的實名底層：新加坡的 Singpass、馬來西亞的 MyKad 與 MyDigital ID，加上兩國都強制 SIM 卡實名，帳號、裝置與付款方式往往早就指向法律上的本名。最下方的橫幅說明能見度與組織程度會放大風險，低觸及的貼文、爆紅的貼文與有協調的行動，三者的風險層級不同。</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
