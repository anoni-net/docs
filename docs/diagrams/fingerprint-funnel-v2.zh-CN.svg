<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 513" width="400" height="513" role="img" aria-labelledby="title desc">
<title id="title">每加一项特征，还跟你长得一样的人就少一批</title>
<desc id="desc">一个由上往下收窄的漏斗，分成六阶。最上面一阶最宽，代表所有浏览器。往下每一阶加入一项浏览器指纹的特征，人群就缩小一次：加上时区之后剩下同一个时区的人，加上语言与操作系统之后还是很多人，加上屏幕与窗口尺寸之后范围明显缩小，加上绘图硬件之后剩下不多，加上完整的字体清单之后常常就只剩你一个。每一阶的宽度是示意，不是测量到的数字。底下注记 EFF 在 2010 年的 Panopticlick 研究收集了 470,161 个浏览器样本，其中 83.6% 的指纹是唯一的。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<text class="t-main h1" x="12" y="22">每加一项特征，还跟你长得一样的人就少一批</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-c1" x="26" y="50" width="348" height="26" rx="6"/>
<text class="t-main h2" x="200" y="68" text-anchor="middle">所有人</text>
<text class="t-mute bd" x="200" y="88" text-anchor="middle">还没量任何东西</text>
<rect class="card-c1" x="50" y="104" width="300" height="26" rx="6"/>
<text class="t-main h2" x="200" y="122" text-anchor="middle">同一个时区的人</text>
<text class="t-mute bd" x="200" y="142" text-anchor="middle">加上时区</text>
<rect class="card-c2" x="74" y="158" width="253" height="26" rx="6"/>
<text class="t-main h2" x="200" y="176" text-anchor="middle">还是很多人</text>
<text class="t-mute bd" x="200" y="196" text-anchor="middle">加上语言与操作系统</text>
<rect class="card-c2" x="97" y="212" width="205" height="26" rx="6"/>
<text class="t-main h2" x="200" y="230" text-anchor="middle">范围明显缩小</text>
<text class="t-mute bd" x="200" y="250" text-anchor="middle">加上屏幕与窗口尺寸</text>
<rect class="card-c3" x="121" y="266" width="158" height="26" rx="6"/>
<text class="t-main h2" x="200" y="284" text-anchor="middle">剩下不多</text>
<text class="t-mute bd" x="200" y="304" text-anchor="middle">加上绘图硬件</text>
<rect class="card-w3" x="145" y="320" width="110" height="26" rx="6"/>
<text class="t-onfill h2" x="200" y="338" text-anchor="middle">就是你</text>
<text class="t-mute bd" x="200" y="358" text-anchor="middle">加上完整的字体清单</text>
<rect class="card-n" x="12" y="378" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="402">为什么没有「清除指纹」这个按钮</text>
<text class="t-mute bd" x="26" y="419">没有一项特征单独认得出你，凑在一起就可以。指</text>
<text class="t-mute bd" x="26" y="436">纹不是被存下来的东西，所以也没有东西可以清除。</text>
<text class="t-mute bd" x="26" y="453">每一阶的宽度是示意，不是测量到的数字。EFF 在</text>
<text class="t-mute bd" x="26" y="470">2010 年的 Panopticlick 研究收集 470,161</text>
<text class="t-mute bd" x="26" y="487">个浏览器样本，其中 83.6% 的指纹是唯一的。</text>
</svg>
