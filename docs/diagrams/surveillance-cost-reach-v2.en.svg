<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" width="400" height="624" role="img" aria-labelledby="title desc">
<title id="title">Cost and reach run in opposite directions across the first four layers, and the fifth is off that line</title>
<desc id="desc">Four paired bars, left to right: platforms and ads, telecoms, state and law enforcement, and commercial spyware. The upward bar is how many people that layer reaches, and it gets shorter to the right: platforms and ads reach everyone, while commercial spyware works from a short list. The downward bar is the cost of using it on one person, and it gets longer to the right: platforms and ads cost almost nothing, while a commercial spyware licence runs to tens of thousands of dollars. The two measures run in opposite directions, which is why capability is not the same as being used on you. A band underneath carries the fifth layer, open-source intelligence profiling: the material is your own public speech and event information, the cost sits at the level of the leftmost column, and the target selection resembles the rightmost, so the pattern of the first four does not hold there.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="91" rx="8"/>
<text class="t-main h2" x="26" y="24">The more people it covers,</text>
<text class="t-main h2" x="26" y="43">the less it costs per person</text>
<text class="t-mute bd" x="26" y="60">Top to bottom, reach falls and</text>
<text class="t-mute bd" x="26" y="77">the cost of one target rises.</text>
<rect class="card-no" x="12" y="105" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="129">Platforms and advertising</text>
<rect class="card-no" x="26" y="139" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="156" text-anchor="middle">Reach Everyone</text>
<rect class="card-ok" x="204" y="139" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="156" text-anchor="middle">Cost Near zero</text>
<text class="t-mute bd" x="26" y="180">No target selection needed, and</text>
<text class="t-mute bd" x="26" y="197">more collection pays better.</text>
<rect class="card-w2" x="12" y="221" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="245">Telecoms</text>
<rect class="card-no" x="26" y="255" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="272" text-anchor="middle">Reach All subscribers</text>
<rect class="card-ok" x="204" y="255" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="272" text-anchor="middle">Cost Already collected</text>
<text class="t-main bd" x="26" y="296">Call records and location retained by law.</text>
<rect class="card-w1" x="12" y="320" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="344">State and law enforcement</text>
<rect class="card-ok" x="26" y="354" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="370" text-anchor="middle">Reach Named targets</text>
<rect class="card-no" x="204" y="354" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="370" text-anchor="middle">Cost Needs a court order</text>
<text class="t-mute bd" x="26" y="395">Requested from the operator,</text>
<text class="t-mute bd" x="26" y="412">one specific person at a time.</text>
<rect class="card-c1" x="12" y="436" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="460">Commercial spyware</text>
<rect class="card-ok" x="26" y="470" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="486" text-anchor="middle">Reach A very short list</text>
<rect class="card-no" x="204" y="470" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="486" text-anchor="middle">Cost Tens of thousands per use</text>
<text class="t-mute bd" x="26" y="511">Licensing is expensive and</text>
<text class="t-mute bd" x="26" y="528">the target list is short.</text>
<rect class="card-n" x="12" y="558" width="376" height="54" rx="8"/>
<text class="t-mute bd" x="26" y="581">Open-source intelligence profiling</text>
<text class="t-mute bd" x="26" y="598">does not follow this pattern.</text>
</svg>
