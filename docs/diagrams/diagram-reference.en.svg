<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1147" width="400" height="1147" role="img" aria-labelledby="title desc">
<title id="title">Diagram layout reference</title>
<desc id="desc">A reference that uses every layout element and every colour token once.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; stroke: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .arrow { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="110" rx="8"/>
<text class="t-mute lab" x="26" y="24">eyebrow, a small label in t-mute</text>
<text class="t-main h2" x="26" y="44">title, the card heading, h2 14px bold</text>
<text class="t-mute bd" x="26" y="62">sub, the subtitle, bd 13px</text>
<text class="t-mute bd" x="26" y="79">lines, a paragraph. Wrapping is left</text>
<text class="t-mute bd" x="26" y="96">to the layout, never hand-broken.</text>
<rect class="card-n" x="12" y="120" width="376" height="119" rx="8"/>
<text class="t-main h2" x="26" y="144">chips, two columns, each</text>
<text class="t-main h2" x="26" y="163">carrying its own name and value</text>
<rect class="card-ok" x="26" y="173" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="190" text-anchor="middle">Good ok</text>
<rect class="card-w1" x="204" y="173" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="190" text-anchor="middle">Medium w1</text>
<rect class="card-no" x="26" y="201" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="218" text-anchor="middle">Warning no</text>
<rect class="card-n" x="204" y="201" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="218" text-anchor="middle">Neutral n</text>
<rect class="card" x="12" y="249" width="376" height="148" rx="8"/>
<text class="t-main h2" x="26" y="273">blocks, labelled sections</text>
<text class="t-main lab" x="26" y="294">First section</text>
<text class="t-mute bd" x="36" y="311">One item per line</text>
<text class="t-mute bd" x="36" y="328">A second item</text>
<text class="t-main lab" x="26" y="349">Second section</text>
<text class="t-mute bd" x="36" y="366">The label is lab 13px bold,</text>
<text class="t-mute bd" x="36" y="383">the body indented by 10px</text>
<text class="t-main h1" x="12" y="433">h, a section heading with a rule</text>
<path class="rule" d="M12 443 H388"/>
<rect class="card-n" x="12" y="455" width="376" height="228" rx="8"/>
<text class="t-main h2" x="26" y="479">chain, a top-to-bottom flow</text>
<rect class="card" x="26" y="485" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="505">Start</text>
<text class="t-main bd" x="38" y="523">A node subtitle</text>
<path class="arrow" d="M200 533 V545"/>
<path class="arrow-h" d="M196 544 L204 544 L200 551 Z"/>
<rect class="card-c3" x="26" y="551" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="571">Relay</text>
<text class="t-main bd" x="38" y="589">A node that needs emphasis changes tone</text>
<path class="arrow" d="M200 599 V611"/>
<path class="arrow-h" d="M196 610 L204 610 L200 617 Z"/>
<rect class="card" x="26" y="617" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="637">End</text>
<text class="t-main bd" x="38" y="655">The connector runs down the centre line</text>
<text class="t-main h1" x="12" y="719">A three-step ramp, lightest to darkest</text>
<path class="rule" d="M12 729 H388"/>
<rect class="card-c1" x="12" y="741" width="376" height="58" rx="8"/>
<text class="t-mute lab" x="26" y="765">card-c1</text>
<text class="t-main h2" x="26" y="785">Lightest, first layer</text>
<rect class="card-c2" x="12" y="807" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="831">card-c2</text>
<text class="t-main h2" x="26" y="851">Middle layer</text>
<rect class="card-c3" x="12" y="873" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="897">card-c3</text>
<text class="t-main h2" x="26" y="917">Darkest, top layer</text>
<rect class="card-w1" x="12" y="945" width="376" height="58" rx="8"/>
<text class="t-mute lab" x="26" y="969">card-w1</text>
<text class="t-main h2" x="26" y="989">Lightest, warning or rising cost</text>
<rect class="card-w2" x="12" y="1011" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="1035">card-w2</text>
<text class="t-main h2" x="26" y="1055">Middle layer</text>
<rect class="card-w3" x="12" y="1077" width="376" height="58" rx="8"/>
<text class="t-onfill lab" x="26" y="1101">card-w3</text>
<text class="t-onfill h2" x="26" y="1121">Darkest, saturated fill, text uses t-onfill</text>
</svg>
