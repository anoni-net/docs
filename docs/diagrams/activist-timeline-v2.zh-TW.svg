<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 762" width="400" height="762" role="img" aria-labelledby="title desc">
<title id="title">動員前、行動現場、行動之後，三個階段各有各的準備</title>
<desc id="desc">三個並排的階段，用箭頭串起來，底下有一條橫幅代表貫穿全程的跨組織協作。動員前是風險最低、時間最多的階段，要做的是通訊群組的設計與隔離、雲端文件先撤到 Cryptpad、密碼管理器與帳號清單、個人帳號的隱私審計、一次性手機的取捨，以及活動公開資訊的揭露節奏。行動現場要做的是出門前的裝置鎖定設定、現場拍照與錄影的判斷、選擇 Signal 或離線 mesh，以及緊急聯絡人與失聯流程。行動之後要處理的是刪除證據前的合規考量、媒體曝光時的身分管理，以及取得法律支援的管道。底下的橫幅是跨組織協作，貫穿三個階段，包含資訊最小化原則、共筆與檔案交換工具的選擇、群組命名與訊息政策。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="236" rx="8"/>
<text class="t-main lab" x="26" y="24">動員前準備</text>
<text class="t-main h2" x="26" y="44">風險最低，時間最多</text>
<text class="t-main lab" x="26" y="65">要做的事</text>
<text class="t-mute bd" x="36" y="82">通訊群組的設計與隔離</text>
<text class="t-mute bd" x="36" y="99">雲端文件先撤到 Cryptpad</text>
<text class="t-mute bd" x="36" y="116">密碼管理器與帳號清單</text>
<text class="t-mute bd" x="36" y="133">個人帳號的隱私審計</text>
<text class="t-mute bd" x="36" y="150">一次性手機的取捨</text>
<text class="t-mute bd" x="36" y="167">活動公開資訊的揭露節奏</text>
<text class="t-main lab" x="26" y="188">為什麼在這裡</text>
<text class="t-mute bd" x="36" y="205">多數人卡關的原因，是把 30 分</text>
<text class="t-mute bd" x="36" y="222">鐘能做完的事拖到當天才想起來。</text>
<rect class="card-c2" x="12" y="246" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="270">行動現場</text>
<text class="t-main h2" x="26" y="290">來不及做新設定的階段</text>
<text class="t-main lab" x="26" y="311">要做的事</text>
<text class="t-main bd" x="36" y="328">出門前的裝置鎖定設定</text>
<text class="t-main bd" x="36" y="345">現場拍照與錄影的判斷</text>
<text class="t-main bd" x="36" y="362">Signal 與離線 mesh 的選擇</text>
<text class="t-main bd" x="36" y="379">緊急聯絡人與失聯流程</text>
<text class="t-main lab" x="26" y="400">為什麼在這裡</text>
<text class="t-main bd" x="36" y="417">被臨檢時手機被翻看，群組對話與照片庫會一起暴露。</text>
<rect class="card-w1" x="12" y="441" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="465">行動之後</text>
<text class="t-main h2" x="26" y="485">風險不會跟著散場結束</text>
<text class="t-main lab" x="26" y="506">要做的事</text>
<text class="t-mute bd" x="36" y="523">刪除「證據」前的合規考量</text>
<text class="t-mute bd" x="36" y="540">媒體曝光時的身分管理</text>
<text class="t-mute bd" x="36" y="557">取得法律支援的管道</text>
<text class="t-main lab" x="26" y="578">為什麼在這裡</text>
<text class="t-mute bd" x="36" y="595">抗爭結束後被告時，公司會用內部</text>
<text class="t-mute bd" x="36" y="612">IT 紀錄、門禁卡與存取紀錄追究。</text>
<rect class="card-n" x="12" y="644" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="668">跨組織協作，三個階段都適用</text>
<text class="t-mute bd" x="26" y="685">資訊最小化原則。共筆與檔案交換</text>
<text class="t-mute bd" x="26" y="702">工具的選擇。群組命名與訊息政策。</text>
<text class="t-mute bd" x="26" y="719">跨組織協調的共筆放在一般雲端硬碟，後來被</text>
<text class="t-mute bd" x="26" y="736">截圖外流到對立陣營，這是實際發生過的情況。</text>
</svg>
