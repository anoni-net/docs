<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 910" width="400" height="910" role="img" aria-labelledby="title">
<title id="title">三種收款管道各有取捨，捐款人依自己要躲的對象選通道</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card, .card-c1, .card-n, .card-no, .card-ok, .card-w1 { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<text class="t-main h1" x="12" y="22">組織方：三種收款管道的取捨</text>
<path class="rule" d="M12 32 H388"/>
<rect class="card-c1" x="12" y="44" width="376" height="152" rx="8"/>
<text class="t-main h2" x="26" y="68">現金</text>
<text class="t-mute bd" x="26" y="86">公開信箱、活動現場</text>
<rect class="card-ok" x="26" y="96" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="112" text-anchor="middle">匿名度 高</text>
<rect class="card-w1" x="204" y="96" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="112" text-anchor="middle">合規負擔 中</text>
<rect class="card-no" x="26" y="124" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="140" text-anchor="middle">規模化 低</text>
<rect class="card-no" x="204" y="124" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="140" text-anchor="middle">跨境 不行</text>
<text class="t-mute bd" x="26" y="165">境內小額支持，門檻最低的一條路。公益勸募</text>
<text class="t-mute bd" x="26" y="182">條例適用的情境多，先確認自己在不在裡面。</text>
<rect class="card-w1" x="12" y="206" width="376" height="152" rx="8"/>
<text class="t-main h2" x="26" y="230">加密貨幣</text>
<text class="t-mute bd" x="26" y="248">自管錢包或託管平台</text>
<rect class="card-ok" x="26" y="258" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="274" text-anchor="middle">匿名度 中至高</text>
<rect class="card-no" x="204" y="258" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="274" text-anchor="middle">合規負擔 高</text>
<rect class="card-ok" x="26" y="286" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="302" text-anchor="middle">規模化 高</text>
<rect class="card-ok" x="204" y="286" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="302" text-anchor="middle">跨境 行</text>
<text class="t-mute bd" x="26" y="327">跨境支持境外組織。VASP、洗錢防制與稅</text>
<text class="t-mute bd" x="26" y="344">務的負擔明顯高一截，換匯與會計要先排好。</text>
<rect class="card-n" x="12" y="368" width="376" height="152" rx="8"/>
<text class="t-main h2" x="26" y="392">預付卡與代碼</text>
<text class="t-mute bd" x="26" y="410">預付禮物卡、超商代碼</text>
<rect class="card-w1" x="26" y="420" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="436" text-anchor="middle">匿名度 中</text>
<rect class="card-ok" x="204" y="420" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="436" text-anchor="middle">合規負擔 低</text>
<rect class="card-w1" x="26" y="448" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="464" text-anchor="middle">規模化 中</text>
<rect class="card-w1" x="204" y="448" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="464" text-anchor="middle">跨境 限境內</text>
<text class="t-mute bd" x="26" y="489">境內小額，捐款人不必碰加密貨幣。多數捐款人走到</text>
<text class="t-mute bd" x="26" y="506">「取得隱私幣」那一步就放棄，這條路補的是那個缺口。</text>
<text class="t-main h1" x="12" y="558">捐款人：先問要躲的是誰，再選通道</text>
<path class="rule" d="M12 568 H388"/>
<rect class="card" x="12" y="580" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="604">想躲家人或雇主看到金流</text>
<text class="t-mute bd" x="26" y="621">走：現金、預付卡、隱私幣</text>
<text class="t-mute bd" x="26" y="638">避開：信用卡、共用銀行帳戶</text>
<rect class="card" x="12" y="662" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="686">想躲組織方留下身分紀錄</text>
<text class="t-mute bd" x="26" y="703">走：不留 email 的現金捐贈、隱私幣到自管錢包</text>
<text class="t-mute bd" x="26" y="720">避開：銀行匯款，戶名會留在對方的帳上</text>
<rect class="card" x="12" y="744" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="768">想躲跨境監控</text>
<text class="t-mute bd" x="26" y="785">走：Monero、Zcash 遮蔽交易</text>
<text class="t-mute bd" x="26" y="802">避開：比特幣到中心化交易所</text>
<rect class="card" x="12" y="826" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="850">純粹個人偏好不留紀錄</text>
<text class="t-mute bd" x="26" y="867">走：任意現金管道</text>
<text class="t-mute bd" x="26" y="884">避開：任何電子支付</text>
</svg>
