<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 765" width="400" height="765" role="img" aria-labelledby="title">
<title id="title">三层防护各自对付一种对手，做完第一层就挡掉大部分的损失</title>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c3, .card-n, .card-no { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
  }
</style>

<rect class="card-c3" x="12" y="0" width="376" height="203" rx="8"/>
<text class="t-main lab" x="26" y="24">第一层</text>
<text class="t-main h2" x="26" y="44">诈骗与账号入侵</text>
<text class="t-main bd" x="26" y="62">以自动化撒网为主，实际造成金钱损失的是这一种</text>
<text class="t-main lab" x="26" y="83">做什么</text>
<text class="t-main bd" x="36" y="100">密码管理器，每个网站不同密码</text>
<text class="t-main bd" x="36" y="117">两步验证，能用强的就用强的</text>
<text class="t-main bd" x="36" y="134">系统与浏览器保持更新</text>
<text class="t-main bd" x="36" y="151">对急着要你处理的消息，换一个渠道确认</text>
<text class="t-main lab" x="26" y="172">要花多久</text>
<text class="t-main bd" x="36" y="189">约一小时。从 email 开始，接着是网银与常用通信软件</text>
<rect class="card-c1" x="12" y="213" width="376" height="220" rx="8"/>
<text class="t-mute lab" x="26" y="237">第二层</text>
<text class="t-main h2" x="26" y="257">商业数据收集</text>
<text class="t-mute bd" x="26" y="275">平台、广告商、数据掮客持续在做，不针对你个人</text>
<text class="t-main lab" x="26" y="296">做什么</text>
<text class="t-mute bd" x="36" y="313">手机权限与广告标识符</text>
<text class="t-mute bd" x="36" y="330">全盘加密与开机密码</text>
<text class="t-mute bd" x="36" y="347">日常通信改用端到端加密</text>
<text class="t-mute bd" x="36" y="364">备份，以及还原得回来的验证</text>
<text class="t-mute bd" x="36" y="381">账号盘点</text>
<text class="t-main lab" x="26" y="402">要花多久</text>
<text class="t-mute bd" x="36" y="419">几个晚上。一次做一项，不必一口气做完</text>
<rect class="card-n" x="12" y="443" width="376" height="152" rx="8"/>
<text class="t-mute lab" x="26" y="467">第三层</text>
<text class="t-main h2" x="26" y="487">针对性调查</text>
<text class="t-mute bd" x="26" y="505">具备法律程序或技术资源，多数人不在名单上</text>
<text class="t-main lab" x="26" y="526">做什么</text>
<text class="t-mute bd" x="36" y="543">触发条件见文章的「什么时候该把标准拉高」</text>
<text class="t-main lab" x="26" y="564">要花多久</text>
<text class="t-mute bd" x="36" y="581">视情境。换身份与换设备改变的是几个记录能不能被串起来</text>
<rect class="card-no" x="12" y="613" width="376" height="140" rx="8"/>
<text class="t-main h2" x="26" y="637">被高估的做法，各自有用途，常被误当成防护主力</text>
<text class="t-mute bd" x="26" y="654">VPN 换掉谁看得到你的连接。无痕模式</text>
<text class="t-mute bd" x="26" y="671">清掉本机记录，平台与 ISP 照样认得你。</text>
<text class="t-mute bd" x="26" y="688">定期换密码已被 NIST 明文取消要求。换手机</text>
<text class="t-mute bd" x="26" y="705">号码要先解绑旧账号，旧号码会被回收再配发。</text>
<text class="t-mute bd" x="26" y="722">贴镜头贴纸挡镜头有效，多数人担心的是麦克风。删掉</text>
<text class="t-mute bd" x="26" y="739">app 停止的是往后的收集，已经给出去的数据不会消失。</text>
</svg>
