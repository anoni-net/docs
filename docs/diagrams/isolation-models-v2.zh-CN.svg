<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 637" width="400" height="637" role="img" aria-labelledby="title desc">
<title id="title">Tails、Whonix、Qubes 三种隔离结构长得不一样</title>
<desc id="desc">三个系统的结构对照。Tails 是整机重置，从 USB 开机，一次工作阶段全部在里面，关机后整个消失，全部流量强制走 Tor。Whonix 是在你原本的操作系统里架两台虚拟机，Workstation 给你做事，它的流量只能经过 Gateway 出去，Gateway 强制走 Tor，主机系统照常使用。Qubes 是用 Xen hypervisor 把一台电脑切成多个独立的 qube，工作、个人、金融各自一个，要走 Tor 的话另外装一个 Whonix qube。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="168" rx="8"/>
<text class="t-main lab" x="26" y="24">Tails</text>
<text class="t-main h2" x="26" y="44">整机重置</text>
<text class="t-main lab" x="26" y="65">结构</text>
<text class="t-mute bd" x="36" y="82">一次工作阶段，从 USB 开机</text>
<text class="t-mute bd" x="36" y="99">你的全部工作都在里面，浏览、文件、通讯都在这里</text>
<text class="t-mute bd" x="36" y="116">全部流量强制走 Tor</text>
<text class="t-main lab" x="26" y="137">关机之后</text>
<text class="t-mute bd" x="36" y="154">整个消失，除非另外开 Persistent Storage</text>
<rect class="card-c2" x="12" y="178" width="376" height="130" rx="8"/>
<text class="t-main lab" x="26" y="202">Whonix</text>
<text class="t-main h2" x="26" y="222">两台虚拟机分工</text>
<text class="t-main lab" x="26" y="243">结构</text>
<text class="t-main bd" x="36" y="260">你原本的操作系统照常使用</text>
<text class="t-main bd" x="36" y="277">Workstation 是你做事的地方，连不到外面</text>
<text class="t-main bd" x="36" y="294">Gateway 是唯一的出口，强制走 Tor</text>
<rect class="card-w1" x="12" y="318" width="376" height="168" rx="8"/>
<text class="t-main lab" x="26" y="342">Qubes OS</text>
<text class="t-main h2" x="26" y="362">一个任务一个 qube</text>
<text class="t-main lab" x="26" y="383">结构</text>
<text class="t-mute bd" x="36" y="400">Xen hypervisor 切开硬件</text>
<text class="t-mute bd" x="36" y="417">工作、个人、金融各自一个 qube</text>
<text class="t-mute bd" x="36" y="434">Whonix 要另外装</text>
<text class="t-main lab" x="26" y="455">界线</text>
<text class="t-mute bd" x="36" y="472">qube 之间预设互不相通，只有 Whonix 那一个走 Tor</text>
<rect class="card-n" x="12" y="502" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="526">三套的差别不在谁比较安全，在于界线画在哪一层</text>
<text class="t-mute bd" x="26" y="543">Tails 一小时上手，做完就没了，适合一次性任务。</text>
<text class="t-mute bd" x="26" y="560">Whonix 保留工作状态，跨平台，</text>
<text class="t-mute bd" x="26" y="577">理解双 VM 要花半天到一天。</text>
<text class="t-mute bd" x="26" y="594">Qubes 把界线画在硬件层，隔离最彻底，代价是挑硬件</text>
<text class="t-mute bd" x="26" y="611">（VT-d、建议 16 GB 以上内存）与大约一周的适应期。</text>
</svg>
