<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 423" width="400" height="423" role="img" aria-labelledby="title desc">
<title id="title">Zcash 遮蔽交易：可見 vs 不可見</title>
<desc id="desc">Zcash 遮蔽交易：可見 vs 不可見</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">Zcash 遮蔽交易，可見與不可見</text>
<text class="t-mute bd" x="26" y="41">Alice 寄給 Bob，鏈上留下的是一份</text>
<text class="t-mute bd" x="26" y="58">zk-SNARK 證明，只有幾百 bytes。</text>
<rect class="card-ok" x="12" y="84" width="376" height="126" rx="8"/>
<text class="t-main lab" x="26" y="108">鏈上記錄，任何人都能看</text>
<text class="t-main h2" x="26" y="128">可見</text>
<text class="t-mute bd" x="26" y="145">zk-SNARK proof，密碼學憑證</text>
<text class="t-mute bd" x="26" y="162">nullifier，防止 double-spend</text>
<text class="t-mute bd" x="26" y="179">new commitment，新建立的 note</text>
<text class="t-mute bd" x="26" y="196">透明手續費</text>
<rect class="card-no" x="12" y="220" width="376" height="126" rx="8"/>
<text class="t-main lab" x="26" y="244">僅 Alice 與 Bob 知道</text>
<text class="t-main h2" x="26" y="264">不可見</text>
<text class="t-mute bd" x="26" y="281">寄件人位址</text>
<text class="t-mute bd" x="26" y="298">收件人位址</text>
<text class="t-mute bd" x="26" y="315">金額</text>
<text class="t-mute bd" x="26" y="332">跟其他交易的圖譜關聯</text>
<rect class="card-n" x="12" y="356" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="380">驗證者能做的只有一件事</text>
<text class="t-mute bd" x="26" y="397">驗證這個 proof 是有效的，無法還原任何不可見欄位。</text>
</svg>
