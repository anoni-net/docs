<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 630" width="400" height="630" role="img" aria-labelledby="title desc">
<title id="title">Double Ratchet：每則訊息一把獨立金鑰</title>
<desc id="desc">Double Ratchet：每則訊息一把獨立金鑰</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="24">Double Ratchet，每則訊息一把獨立金鑰</text>
<text class="t-mute bd" x="26" y="41">Alice 的傳送金鑰鏈往前推進，每一格對應一則訊息。</text>
<rect class="card-n" x="12" y="67" width="376" height="339" rx="8"/>
<text class="t-main h2" x="26" y="91">金鑰鏈怎麼走</text>
<rect class="card-c1" x="26" y="97" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="113">K_A1</text>
<text class="t-main bd" x="36" y="130">送出 M1</text>
<text class="t-mute bd" x="40" y="154">&#8595;</text>
<rect class="card-c1" x="26" y="160" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="176">K_A2</text>
<text class="t-main bd" x="36" y="193">送出 M2</text>
<text class="t-mute bd" x="40" y="217">&#8595;</text>
<rect class="card-w3" x="26" y="223" width="348" height="41" rx="6"/>
<text class="t-onfill lab" x="36" y="239">DH ratchet</text>
<text class="t-onfill bd" x="36" y="256">收到對方訊息時跑一次新 DH</text>
<text class="t-mute bd" x="40" y="280">&#8595;</text>
<rect class="card-c1" x="26" y="286" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="302">K_A3</text>
<text class="t-main bd" x="36" y="319">送出 M3</text>
<text class="t-mute bd" x="40" y="343">&#8595;</text>
<rect class="card-c1" x="26" y="349" width="348" height="41" rx="6"/>
<text class="t-main lab" x="36" y="365">K_A4</text>
<text class="t-main bd" x="36" y="382">送出 M4</text>
<rect class="card-ok" x="12" y="416" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="440">對稱 ratchet</text>
<text class="t-mute bd" x="26" y="457">每送一則訊息推進一格，舊金鑰立即丟棄，這是前向保密。</text>
<rect class="card-w1" x="12" y="481" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="505">DH ratchet</text>
<text class="t-mute bd" x="26" y="522">收到對方訊息時跑一次新 DH，金鑰</text>
<text class="t-mute bd" x="26" y="539">鏈整段重置，這是後向保密（PCS）。</text>
<rect class="card-n" x="12" y="563" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="587">每則訊息有獨立金鑰</text>
<text class="t-mute bd" x="26" y="604">加密後立即丟掉，攻擊者拿到當下的 K 也無法還原其他訊息。</text>
</svg>
