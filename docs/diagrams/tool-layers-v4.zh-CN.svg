<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" width="400" height="446" role="img" aria-labelledby="title">
<title id="title">四层工具之间的关系，哪一层包住哪一层</title>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c2, .card-c3, .card-n { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-c3" x="12" y="0" width="376" height="110" rx="8"/>
<text class="t-main lab" x="26" y="24">环境层</text>
<text class="t-main h2" x="26" y="44">匿名操作系统</text>
<text class="t-main bd" x="26" y="62">Tails、Whonix、Qubes</text>
<text class="t-main bd" x="26" y="79">整个系统预设走 Tor，关机不留痕迹。这一层把下面的连线</text>
<text class="t-main bd" x="26" y="96">层整个包在里面，所以装了 Tails 就等于同时有了连线层。</text>
<rect class="card-c2" x="12" y="120" width="376" height="93" rx="8"/>
<text class="t-main lab" x="26" y="144">连线层</text>
<text class="t-main h2" x="26" y="164">Tor 工具家族</text>
<text class="t-main bd" x="26" y="182">Tor Browser、Snowflake、OnionShare、桥接</text>
<text class="t-main bd" x="26" y="199">把连线藏进多层加密与随机路径，让 IP 与行为难以被追踪。</text>
<rect class="card-c1" x="12" y="223" width="376" height="92" rx="8"/>
<text class="t-mute lab" x="26" y="247">基础层</text>
<text class="t-main h2" x="26" y="267">日常隐私基本功</text>
<text class="t-mute bd" x="26" y="284">通讯软件选哪个、密码怎么管、要匿名付钱</text>
<text class="t-mute bd" x="26" y="301">时用什么。不管上面用哪一层，这一层都要。</text>
<rect class="card-n" x="12" y="325" width="376" height="109" rx="8"/>
<text class="t-mute lab" x="26" y="349">观测层</text>
<text class="t-main h2" x="26" y="369">OONI</text>
<text class="t-mute bd" x="26" y="386">把封锁、降速这些感受，转成有时</text>
<text class="t-mute bd" x="26" y="403">间、地点、ASN 对得上的公开数据。</text>
<text class="t-mute bd" x="26" y="420">它记录连线遇到了什么，本身不保护连线。</text>
</svg>
