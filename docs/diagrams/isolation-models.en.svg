<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 434" width="970" height="434" role="img" aria-labelledby="title desc">
<title id="title">Tails, Whonix, and Qubes draw the boundary in three different places</title>
<desc id="desc">The structure of three systems side by side. Tails is a whole-machine reset booted from USB: one session holds everything, it disappears at shutdown, and all traffic is forced through Tor. Whonix runs two virtual machines inside your usual operating system: the Workstation is where you work and its traffic can only leave through the Gateway, which forces it through Tor, while the host system carries on as normal. Qubes uses the Xen hypervisor to split one computer into separate qubes, one each for work, personal, and finance, with a Whonix qube installed separately if Tor is needed.</desc>
<style>
  /* Colours follow the palette in community/brand-assets.md. This file is a standalone
     SVG pulled in by an img tag, so it cannot reach the page CSS variables and the hex
     values have to be literal. Orange marks what is exposed and cyan what is protected,
     matching the other diagrams on the site. */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .sys { fill: #212121; font-size: 18px; font-weight: 700; }
  .sys-sub { fill: #546e7a; font-size: 12.5px; }
  .outer { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.4; }
  .outer-gone { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .outer-lbl { fill: #78909c; font-size: 11.5px; }
  .inner { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.2; }
  .inner-tor { fill: #e6f4fb; stroke: #0089bf; stroke-width: 1.4; }
  .inner-lbl { fill: #212121; font-size: 13.5px; font-weight: 600; }
  .inner-note { fill: #78909c; font-size: 11px; }
  .flow { stroke: #0089bf; stroke-width: 1.8; fill: none; }
  .flow-head { fill: #0089bf; }
  .flow-lbl { fill: #0089bf; font-size: 11.5px; font-weight: 600; }
  .foot { fill: #546e7a; font-size: 12.5px; }

  @media (prefers-color-scheme: dark) {
    .sys { fill: #eceff1; }
    .sys-sub { fill: #b0bec5; }
    .outer { fill: #23292e; stroke: #4b565e; }
    .outer-gone { fill: #23292e; stroke: #4b565e; }
    .outer-lbl { fill: #90a4ae; }
    .inner { fill: #2c343a; stroke: #4b565e; }
    .inner-tor { fill: #0d2b38; stroke: #4dbfff; }
    .inner-lbl { fill: #eceff1; }
    .inner-note { fill: #90a4ae; }
    .flow { stroke: #4dbfff; }
    .flow-head { fill: #4dbfff; }
    .flow-lbl { fill: #4dbfff; }
    .foot { fill: #b0bec5; }
  }
</style>

<text class="sys"     x="30" y="42">Tails</text>
<text class="sys-sub" x="30" y="62">Whole-machine reset</text>
<rect class="outer-gone" x="30" y="80" width="280" height="230" rx="9"/>
<text class="outer-lbl" x="46" y="102">One session, booted from USB</text>
<rect class="inner" x="52" y="116" width="236" height="120" rx="7"/>
<text class="inner-lbl"  x="170" y="168" text-anchor="middle">Everything you do</text>
<text class="inner-note" x="170" y="188" text-anchor="middle">browsing, files, and messaging</text>
<text class="flow-lbl"  x="170" y="256" text-anchor="middle">All traffic forced through Tor</text>
<text class="outer-lbl" x="170" y="280" text-anchor="middle">Gone when you shut down</text>
<text class="outer-lbl" x="170" y="298" text-anchor="middle">unless Persistent Storage is enabled</text>

<text class="sys"     x="374" y="42">Whonix</text>
<text class="sys-sub" x="374" y="62">Two VMs, separate jobs</text>
<rect class="outer" x="374" y="80" width="280" height="230" rx="9"/>
<text class="outer-lbl" x="390" y="102">Your usual OS carries on as normal</text>
<rect class="inner" x="396" y="116" width="236" height="66" rx="7"/>
<text class="inner-lbl"  x="514" y="144" text-anchor="middle">Workstation</text>
<text class="inner-note" x="514" y="164" text-anchor="middle">where you work, no direct route out</text>
<path class="flow" d="M514 182 V206"/>
<path class="flow-head" d="M514 218 L507 202 L521 202 Z"/>
<rect class="inner-tor" x="396" y="226" width="236" height="66" rx="7"/>
<text class="inner-lbl"  x="514" y="254" text-anchor="middle">Gateway</text>
<text class="inner-note" x="514" y="274" text-anchor="middle">the only exit, forced through Tor</text>

<text class="sys"     x="718" y="42">Qubes OS</text>
<text class="sys-sub" x="718" y="62">One qube per task</text>
<rect class="outer" x="718" y="80" width="222" height="230" rx="9"/>
<text class="outer-lbl" x="734" y="102">Xen hypervisor splits the hardware</text>
<rect class="inner" x="736" y="116" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="781" y="150" text-anchor="middle">Work</text>
<rect class="inner" x="836" y="116" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="881" y="150" text-anchor="middle">Personal</text>
<rect class="inner" x="736" y="186" width="90" height="58" rx="6"/>
<text class="inner-lbl" x="781" y="220" text-anchor="middle">Finance</text>
<rect class="inner-tor" x="836" y="186" width="90" height="58" rx="6"/>
<text class="inner-lbl"  x="881" y="213" text-anchor="middle">Whonix</text>
<text class="inner-note" x="881" y="231" text-anchor="middle">extra install</text>
<text class="outer-lbl" x="829" y="272" text-anchor="middle">qubes cannot reach each other by default</text>
<text class="outer-lbl" x="829" y="292" text-anchor="middle">only the Whonix one uses Tor</text>

<text class="foot" x="30" y="348">Tails takes an hour to learn and leaves nothing behind, which suits one-off tasks.</text>
<text class="foot" x="30" y="368">Whonix keeps your work and runs anywhere, at the cost of half a day to understand the two-VM split.</text>
<text class="foot" x="30" y="388">Qubes draws the boundary at the hardware layer, and asks for fussy hardware and about a week of adjustment.</text>
<text class="foot" x="30" y="408">The three differ in which layer the boundary sits at, not in how secure they are.</text>
</svg>
