<rect class="card-c3" x="28" y="28" width="884" height="118" rx="8"/>
<text class="t-main h1" x="44" y="56">Shared baseline: what an ordinary person should have in place</text>
<text class="t-main bd" x="44" y="82">If none of the scenarios matches you, start here. Every other article assumes you have done this one, and it lists what should</text>
<text class="t-main bd" x="44" y="99">push you up into a specific scenario.</text>
<text class="t-main bd" x="44" y="116">It covers how three kinds of adversary differ, measures ranked by what they actually achieve, measures that are overrated, and</text>
<text class="t-main bd" x="44" y="133">when to raise your standard.</text>
<path class="arrow" d="M470 150 V177"/>
