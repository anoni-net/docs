<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="title desc">
<title id="title">A reading map for the scenarios, starting from one shared baseline</title>
<desc id="desc">At the top sits the shared baseline, what an ordinary person should have in place, which every reader starts from and which every other article assumes. Below it the scenarios split into four groups. The first goes by your role: journalists protecting sources, activists preparing for mobilisation, election observers protecting themselves, and advocacy organisations building anonymous donation channels. The second goes by your situation: anonymous socialising for LGBTQ+ people, and digital preparation for survivors of domestic violence. The third goes by where you speak: publishing on mainland Chinese platforms, and posting online in Singapore and Malaysia. The fourth goes by travel and external events: preparing for business trips and conferences, generating a destination briefing with AI before you go, and preparing for network shutdowns. One person can fall into several groups at once, and the articles cross-reference each other.</desc>
