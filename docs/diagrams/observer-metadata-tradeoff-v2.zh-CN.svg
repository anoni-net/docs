<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 810" width="400" height="810" role="img" aria-labelledby="title desc">
<title id="title">同一组 metadata，既让记录可信也让人曝险</title>
<desc id="desc">上方的蓝框说明现场记录承载的张力：让记录作为证据可信的 metadata，正好也是让人曝险的那些 metadata。一张带时间戳记与 GPS 坐标的照片，是某个违规在特定时间地点发生过的有力证据，同一组 EXIF 数据在被扣押的设备上，可以定位你以及画面里任何可辨识的人。下方左右两栏是逐项要做的决定。左栏是保留 metadata，判准是记录的价值在于可验证而画面中的人不会因此受害，例如空的票箱、张贴出来的开票结果、没有可辨识面孔的排队人潮。右栏是去除或避免 metadata，判准是记录可能指认出会因此陷入危险的人，例如选务人员、面露恐惧的投票人、在不友善环境中的同行观察员，做法是拍摄时就让脸孔不入镜，影像离开设备前先清除 EXIF。最下方列出现场记录的四项实务。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="24">现场记录承载的张力</text>
<text class="t-mute bd" x="26" y="41">让记录「作为证据可信」的 metadata，</text>
<text class="t-mute bd" x="26" y="58">正好也是「让人曝险」的那些 metadata。</text>
<text class="t-mute bd" x="26" y="75">一张带时间戳记与 GPS 坐标的照片，是「某个违规在特</text>
<text class="t-mute bd" x="26" y="92">定时间地点发生过」的有力证据。同一组 EXIF 数据，在</text>
<text class="t-mute bd" x="26" y="109">被扣押的设备上，可以定位你以及画面里任何可辨识的人。</text>
<text class="t-main h1" x="12" y="159">这件事没有通用的正确答案，只有逐项要做的决定</text>
<path class="rule" d="M12 169 H388"/>
<rect class="card-ok" x="12" y="181" width="376" height="200" rx="8"/>
<text class="t-main h2" x="26" y="205">保留 metadata</text>
<text class="t-mute bd" x="26" y="223">判准：记录的价值在于可验证，而画面中的人不会因此受害</text>
<text class="t-main lab" x="26" y="244">适用的画面</text>
<text class="t-mute bd" x="36" y="261">空的票箱</text>
<text class="t-mute bd" x="36" y="278">张贴出来的开票结果</text>
<text class="t-mute bd" x="36" y="295">没有可辨识面孔的排队人潮</text>
<text class="t-mute bd" x="36" y="312">公职人员执行职务的过程</text>
<text class="t-main lab" x="26" y="333">这样做的理由</text>
<text class="t-mute bd" x="36" y="350">时间戳记与坐标让记录可以被第三方查证。</text>
<text class="t-mute bd" x="36" y="367">拿掉之后，这张照片只剩下你的证词。</text>
<rect class="card-no" x="12" y="391" width="376" height="217" rx="8"/>
<text class="t-main h2" x="26" y="415">去除或避免 metadata</text>
<text class="t-mute bd" x="26" y="433">判准：记录可能指认出会因此陷入危险的人</text>
<text class="t-main lab" x="26" y="454">适用的画面</text>
<text class="t-mute bd" x="36" y="471">选务人员</text>
<text class="t-mute bd" x="36" y="488">面露恐惧的投票人</text>
<text class="t-mute bd" x="36" y="505">在不友善环境中的同行观察员</text>
<text class="t-mute bd" x="36" y="522">任何可辨识的一般投票人</text>
<text class="t-main lab" x="26" y="543">怎么做</text>
<text class="t-mute bd" x="36" y="560">拍摄时就让脸孔与可辨识细节不入镜。影</text>
<text class="t-mute bd" x="36" y="577">像离开设备前先清除 EXIF，在证明不带</text>
<text class="t-mute bd" x="36" y="594">metadata 之前，把每个文件都当成带着。</text>
<rect class="card" x="12" y="624" width="376" height="174" rx="8"/>
<text class="t-main h2" x="26" y="648">现场记录的四项实务</text>
<text class="t-mute bd" x="26" y="665">拍文件与环境，不拍脸，除非那张脸本身就是违规</text>
<text class="t-mute bd" x="26" y="682">事实，而且当事人同意或那是公职人员执行职务。</text>
<text class="t-mute bd" x="26" y="699">保留一份离线、可验证的备份。本机的加</text>
<text class="t-mute bd" x="26" y="716">密副本在网络允许时再同步给任务团队。</text>
<text class="t-mute bd" x="26" y="733">用结构化的工具记票数与事件。任务发的表</text>
<text class="t-mute bd" x="26" y="750">单或共用的加密文档，能让记录格式一致。</text>
<text class="t-mute bd" x="26" y="767">不要把身份写进记录里。名字不是关键信息时，用</text>
<text class="t-mute bd" x="26" y="784">角色代称，例如「主任管理员」、「第 4 站观察员」。</text>
</svg>
