<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 528" width="400" height="528" role="img" aria-labelledby="title">
<title id="title">通訊工具在身分綁定與 metadata 這兩個軸上的落點</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card, .card-c1, .card-c3, .card-n { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">兩個軸，metadata 留在哪與身分怎麼綁</text>
<text class="t-mute bd" x="26" y="41">越靠右上，越少人知道你是誰、又在跟誰通訊。</text>
<text class="t-mute bd" x="26" y="58">深色點是主名單，淺色點是頁面裡的對照組。</text>
<rect class="card" x="12" y="84" width="376" height="348" rx="8"/>
<text class="t-mute bd" x="200" y="108" text-anchor="middle">↑ 沒有中央伺服器可看</text>
<circle class="card-n" cx="34" cy="371" r="6"/>
<text class="t-main bd" x="45" y="375">LINE</text>
<circle class="card-n" cx="64" cy="347" r="6"/>
<text class="t-main bd" x="75" y="351">Telegram</text>
<circle class="card-n" cx="41" cy="314" r="6"/>
<text class="t-main bd" x="52" y="318">WhatsApp</text>
<circle class="card-c3" cx="127" cy="217" r="6"/>
<text class="t-main bd" x="138" y="221">Signal</text>
<circle class="card-c3" cx="182" cy="304" r="6"/>
<text class="t-main bd" x="193" y="308">Matrix</text>
<circle class="card-c3" cx="277" cy="189" r="6"/>
<text class="t-main bd" x="266" y="193" text-anchor="end">Session</text>
<circle class="card-c3" cx="323" cy="154" r="6"/>
<text class="t-main bd" x="312" y="158" text-anchor="end">SimpleX</text>
<circle class="card-c3" cx="366" cy="131" r="6"/>
<text class="t-main bd" x="355" y="135" text-anchor="end">Briar</text>
<text class="t-mute bd" x="200" y="402" text-anchor="middle">↓ 中央伺服器看得到全部</text>
<text class="t-mute bd" x="26" y="422">← 綁手機號碼</text>
<text class="t-mute bd" x="374" y="422" text-anchor="end">不綁可查的身分 →</text>
<rect class="card-c1" x="12" y="444" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="468">位置是相對的，不是量測值</text>
<text class="t-mute bd" x="26" y="485">Signal 的身分仍綁手機號碼。Matrix 的訊</text>
<text class="t-mute bd" x="26" y="502">息 metadata 每個 homeserver 都看得到。</text>
</svg>
