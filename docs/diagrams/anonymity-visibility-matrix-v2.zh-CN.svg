<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 625" width="400" height="625" role="img" aria-labelledby="title desc">
<title id="title">四个概念各自遮蔽观察者能看到的哪一部分</title>
<desc id="desc">一张四行三列的对照表。三个栏位是观察者可能看到的三件事：你是谁、你的行为能否被串起来、你说什么。四个行是匿名、假名、机密性、隐私。匿名遮住你是谁与行为关联，不处理内容。假名遮住你是谁，行为关联看得到，不处理内容。机密性遮住内容，你是谁与行为关联都看得到。隐私三件事都由你决定揭露给谁。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="24">观察者看得到什么</text>
<text class="t-mute bd" x="26" y="41">你是谁，连得到真实身份吗</text>
<text class="t-mute bd" x="26" y="58">你的行为，多次行为能被串起来吗</text>
<text class="t-mute bd" x="26" y="75">你说什么，读得到消息内容吗</text>
<rect class="card-c1" x="12" y="103" width="376" height="120" rx="8"/>
<text class="t-main lab" x="26" y="127">Anonymity</text>
<text class="t-main h2" x="26" y="147">匿名</text>
<rect class="card-ok" x="26" y="157" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="174" text-anchor="middle">你是谁 看不到</text>
<rect class="card-ok" x="204" y="157" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="174" text-anchor="middle">你的行为 看不到</text>
<rect class="card-n" x="26" y="185" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="202" text-anchor="middle">你说什么 不涉及</text>
<rect class="card-c1" x="12" y="233" width="376" height="120" rx="8"/>
<text class="t-main lab" x="26" y="257">Pseudonymity</text>
<text class="t-main h2" x="26" y="277">假名</text>
<rect class="card-ok" x="26" y="287" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="304" text-anchor="middle">你是谁 看不到</text>
<rect class="card-no" x="204" y="287" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="304" text-anchor="middle">你的行为 看得到</text>
<rect class="card-n" x="26" y="315" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="332" text-anchor="middle">你说什么 不涉及</text>
<rect class="card-c1" x="12" y="363" width="376" height="120" rx="8"/>
<text class="t-main lab" x="26" y="387">Confidentiality</text>
<text class="t-main h2" x="26" y="407">机密性</text>
<rect class="card-no" x="26" y="417" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="434" text-anchor="middle">你是谁 看得到</text>
<rect class="card-no" x="204" y="417" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="434" text-anchor="middle">你的行为 看得到</text>
<rect class="card-ok" x="26" y="445" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="462" text-anchor="middle">你说什么 看不到</text>
<rect class="card-c1" x="12" y="493" width="376" height="120" rx="8"/>
<text class="t-main lab" x="26" y="517">Privacy</text>
<text class="t-main h2" x="26" y="537">隐私</text>
<rect class="card-c1" x="26" y="547" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="564" text-anchor="middle">你是谁 你决定</text>
<rect class="card-c1" x="204" y="547" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="564" text-anchor="middle">你的行为 你决定</text>
<rect class="card-c1" x="26" y="575" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="592" text-anchor="middle">你说什么 你决定</text>
</svg>
