<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 545" width="400" height="545" role="img" aria-labelledby="title">
<title id="title">What each of the four concepts hides from an observer</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .card-c1, .card-n, .card-no, .card-ok { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="24">What an observer sees</text>
<text class="t-mute bd" x="26" y="41">Who you are: linkable to your real identity?</text>
<text class="t-mute bd" x="26" y="58">Your activity: can your actions be linked?</text>
<text class="t-mute bd" x="26" y="75">What you say: can the content be read?</text>
<rect class="card-c1" x="12" y="103" width="376" height="100" rx="8"/>
<text class="t-main h2" x="26" y="127">Anonymity</text>
<rect class="card-ok" x="26" y="137" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="154" text-anchor="middle">Who you are Hidden</text>
<rect class="card-ok" x="204" y="137" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="154" text-anchor="middle">Your activity Hidden</text>
<rect class="card-n" x="26" y="165" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="182" text-anchor="middle">What you say Not covered</text>
<rect class="card-c1" x="12" y="213" width="376" height="100" rx="8"/>
<text class="t-main h2" x="26" y="237">Pseudonymity</text>
<rect class="card-ok" x="26" y="247" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="264" text-anchor="middle">Who you are Hidden</text>
<rect class="card-no" x="204" y="247" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="264" text-anchor="middle">Your activity Visible</text>
<rect class="card-n" x="26" y="275" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="292" text-anchor="middle">What you say Not covered</text>
<rect class="card-c1" x="12" y="323" width="376" height="100" rx="8"/>
<text class="t-main h2" x="26" y="347">Confidentiality</text>
<rect class="card-no" x="26" y="357" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="374" text-anchor="middle">Who you are Visible</text>
<rect class="card-no" x="204" y="357" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="374" text-anchor="middle">Your activity Visible</text>
<rect class="card-ok" x="26" y="385" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="402" text-anchor="middle">What you say Hidden</text>
<rect class="card-c1" x="12" y="433" width="376" height="100" rx="8"/>
<text class="t-main h2" x="26" y="457">Privacy</text>
<rect class="card-c1" x="26" y="467" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="484" text-anchor="middle">Who you are You decide</text>
<rect class="card-c1" x="204" y="467" width="170" height="24" rx="12"/>
<text class="t-main chip" x="289" y="484" text-anchor="middle">Your activity You decide</text>
<rect class="card-c1" x="26" y="495" width="170" height="24" rx="12"/>
<text class="t-main chip" x="111" y="512" text-anchor="middle">What you say You decide</text>
</svg>
