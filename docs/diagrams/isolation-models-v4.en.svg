<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 775" width="400" height="775" role="img" aria-labelledby="title">
<title id="title">Tails, Whonix, and Qubes draw the boundary in three different places</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-c2, .card-n, .card-w1 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="185" rx="8"/>
<text class="t-mute lab" x="26" y="24">Tails</text>
<text class="t-main h2" x="26" y="44">Whole-machine reset</text>
<text class="t-main lab" x="26" y="65">Structure</text>
<text class="t-mute bd" x="36" y="82">One session, booted from USB</text>
<text class="t-mute bd" x="36" y="99">Everything you do sits inside it:</text>
<text class="t-mute bd" x="36" y="116">browsing, files and messaging</text>
<text class="t-mute bd" x="36" y="133">All traffic forced through Tor</text>
<text class="t-main lab" x="26" y="154">On shutdown</text>
<text class="t-mute bd" x="36" y="171">Gone, unless Persistent Storage is enabled</text>
<rect class="card-c2" x="12" y="195" width="376" height="164" rx="8"/>
<text class="t-main lab" x="26" y="219">Whonix</text>
<text class="t-main h2" x="26" y="239">Two VMs, separate jobs</text>
<text class="t-main lab" x="26" y="260">Structure</text>
<text class="t-main bd" x="36" y="277">Your usual OS carries on as normal</text>
<text class="t-main bd" x="36" y="294">The Workstation is where you</text>
<text class="t-main bd" x="36" y="311">work, with no direct route out</text>
<text class="t-main bd" x="36" y="328">The Gateway is the only</text>
<text class="t-main bd" x="36" y="345">exit, forced through Tor</text>
<rect class="card-w1" x="12" y="369" width="376" height="185" rx="8"/>
<text class="t-mute lab" x="26" y="393">Qubes OS</text>
<text class="t-main h2" x="26" y="413">One qube per task</text>
<text class="t-main lab" x="26" y="434">Structure</text>
<text class="t-mute bd" x="36" y="451">Xen hypervisor splits the hardware</text>
<text class="t-mute bd" x="36" y="468">Work, personal and finance each get a qube</text>
<text class="t-mute bd" x="36" y="485">Whonix is an extra install</text>
<text class="t-main lab" x="26" y="506">Boundaries</text>
<text class="t-mute bd" x="36" y="523">Qubes cannot reach each other by default,</text>
<text class="t-mute bd" x="36" y="540">and only the Whonix one uses Tor</text>
<rect class="card-n" x="12" y="570" width="376" height="193" rx="8"/>
<text class="t-main h2" x="26" y="594">The three differ in which layer the boundary</text>
<text class="t-main h2" x="26" y="613">sits at, not in how secure they are</text>
<text class="t-mute bd" x="26" y="630">Tails takes an hour to learn and leaves</text>
<text class="t-mute bd" x="26" y="647">nothing behind, which suits one-off tasks.</text>
<text class="t-mute bd" x="26" y="664">Whonix keeps your work and runs</text>
<text class="t-mute bd" x="26" y="681">anywhere, at the cost of half a day</text>
<text class="t-mute bd" x="26" y="698">to understand the two-VM split.</text>
<text class="t-mute bd" x="26" y="715">Qubes draws the boundary at the hardware layer,</text>
<text class="t-mute bd" x="26" y="732">and asks for fussy hardware (VT-d, 16 GB of</text>
<text class="t-mute bd" x="26" y="749">memory or more) and about a week of adjustment.</text>
</svg>
