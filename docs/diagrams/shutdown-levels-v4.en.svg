<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1049" width="400" height="1049" role="img" aria-labelledby="title">
<title id="title">Shutdowns come in four levels, and each one leaves you different options</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-w1, .card-w2, .card-w3 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="221" rx="8"/>
<text class="t-mute lab" x="26" y="24">Level 1</text>
<text class="t-main h2" x="26" y="44">Throttling and intermittent loss</text>
<text class="t-mute bd" x="26" y="62">Small files get through, large ones do</text>
<text class="t-mute bd" x="26" y="80">not. Text-only services still work.</text>
<text class="t-main lab" x="26" y="101">Still available</text>
<text class="t-mute bd" x="36" y="118">Text messaging</text>
<text class="t-mute bd" x="36" y="135">Low-bandwidth ways of working</text>
<text class="t-mute bd" x="36" y="152">Offline editing, sent when a window opens</text>
<text class="t-main lab" x="26" y="173">Common misreading</text>
<text class="t-mute bd" x="36" y="190">Blaming your own device and rebooting,</text>
<text class="t-mute bd" x="36" y="207">reinstalling apps, resetting the router.</text>
<rect class="card-w1" x="12" y="231" width="376" height="222" rx="8"/>
<text class="t-mute lab" x="26" y="255">Level 2</text>
<text class="t-main h2" x="26" y="275">Specific services blocked</text>
<text class="t-mute bd" x="26" y="293">Other sites load on the same connection.</text>
<text class="t-mute bd" x="26" y="311">The only level you can confirm with</text>
<text class="t-mute bd" x="26" y="329">public measurement such as OONI.</text>
<text class="t-main lab" x="26" y="350">Still available</text>
<text class="t-mute bd" x="36" y="367">Any channel that is not blocked</text>
<text class="t-mute bd" x="36" y="384">Circumvention tools</text>
<text class="t-main lab" x="26" y="405">Common misreading</text>
<text class="t-mute bd" x="36" y="422">Treating one app that will not</text>
<text class="t-mute bd" x="36" y="439">open as a dead connection.</text>
<rect class="card-w2" x="12" y="463" width="376" height="308" rx="8"/>
<text class="t-main lab" x="26" y="487">Level 3</text>
<text class="t-main h2" x="26" y="507">Regional blackout</text>
<text class="t-main bd" x="26" y="525">Switching Wi-Fi or carrier gives the same</text>
<text class="t-main bd" x="26" y="543">result, and people nearby see it too.</text>
<text class="t-main bd" x="26" y="561">Signal bars tell you nothing. A call or</text>
<text class="t-main bd" x="26" y="579">SMS shows whether only data was cut.</text>
<text class="t-main lab" x="26" y="600">Still available</text>
<text class="t-main bd" x="36" y="617">Whatever you stored on the device in advance</text>
<text class="t-main bd" x="36" y="634">Bluetooth and local-network</text>
<text class="t-main bd" x="36" y="651">links to people nearby</text>
<text class="t-main bd" x="36" y="668">USB sticks, paper, talking in person</text>
<text class="t-main lab" x="26" y="689">Common misreading</text>
<text class="t-main bd" x="36" y="706">Assuming every wireless function is</text>
<text class="t-main bd" x="36" y="723">gone. Bluetooth and local networks</text>
<text class="t-main bd" x="36" y="740">skip the carrier and the internet,</text>
<text class="t-main bd" x="36" y="757">so they keep working at this level.</text>
<rect class="card-w3" x="12" y="781" width="376" height="256" rx="8"/>
<text class="t-onfill lab" x="26" y="805">Level 4</text>
<text class="t-onfill h2" x="26" y="825">Power goes down too</text>
<text class="t-onfill bd" x="26" y="843">No diagnosis needed. The problem shifts</text>
<text class="t-onfill bd" x="26" y="861">from messages not sending to the device</text>
<text class="t-onfill bd" x="26" y="879">shutting down in a few hours.</text>
<text class="t-onfill lab" x="26" y="900">Still available</text>
<text class="t-onfill bd" x="36" y="917">However long the battery lasts</text>
<text class="t-onfill bd" x="36" y="934">Paper</text>
<text class="t-onfill bd" x="36" y="951">Meeting arrangements agreed in advance</text>
<text class="t-onfill lab" x="26" y="972">Common misreading</text>
<text class="t-onfill bd" x="36" y="989">Still focusing on communication tools</text>
<text class="t-onfill bd" x="36" y="1006">rather than power. Power banks and a dimmed</text>
<text class="t-onfill bd" x="36" y="1023">screen decide how much time you have left.</text>
</svg>
