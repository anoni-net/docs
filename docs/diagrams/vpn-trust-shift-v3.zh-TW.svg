<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1091" width="400" height="1091" role="img" aria-labelledby="title desc">
<title id="title">VPN 換掉的是那個單點是誰，Tor 把它拆掉</title>
<desc id="desc">三種連線方式的對照。直接連的時候，ISP 同時知道你是誰與你連哪，網站看到你的真實 IP。經過 VPN 的時候，ISP 只看到你連上 VPN，改由 VPN 業者同時知道你是誰與你連哪，網站看到 VPN 的 IP。經過 Tor 的時候，ISP 只看到你在用 Tor，Guard 知道你是誰但不知道你連哪，Middle 兩邊都不知道，Exit 知道你連哪但不知道你是誰，網站看到出口節點的 IP。前兩種各有一個節點同時知道兩件事，Tor 沒有。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .arrow { stroke: #90a4ae; stroke-width: 1.6; fill: none; }
  .arrow-h { fill: #90a4ae; stroke: none; }
  .card { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .arrow { stroke: #6b7780; }
    .arrow-h { fill: #6b7780; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="230" rx="8"/>
<text class="t-main lab" x="26" y="24">直接連</text>
<text class="t-main h2" x="26" y="44">只有一個節點，它什麼都知道</text>
<rect class="card" x="26" y="50" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="70">你</text>
<path class="arrow" d="M200 80 V92"/>
<path class="arrow-h" d="M196 91 L204 91 L200 98 Z"/>
<rect class="card-w3" x="26" y="98" width="348" height="48" rx="6"/>
<text class="t-onfill lab" x="38" y="118">ISP</text>
<text class="t-onfill bd" x="38" y="136">知道你是誰，也知道你連哪</text>
<path class="arrow" d="M200 146 V158"/>
<path class="arrow-h" d="M196 157 L204 157 L200 164 Z"/>
<rect class="card" x="26" y="164" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="184">網站</text>
<text class="t-main bd" x="38" y="202">看到你的真實 IP</text>
<rect class="card-n" x="12" y="240" width="376" height="296" rx="8"/>
<text class="t-main lab" x="26" y="264">經過 VPN</text>
<text class="t-main h2" x="26" y="284">單點換人</text>
<rect class="card" x="26" y="290" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="310">你</text>
<path class="arrow" d="M200 320 V332"/>
<path class="arrow-h" d="M196 331 L204 331 L200 338 Z"/>
<rect class="card-ok" x="26" y="338" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="358">ISP</text>
<text class="t-main bd" x="38" y="376">只看到你連上 VPN</text>
<path class="arrow" d="M200 386 V398"/>
<path class="arrow-h" d="M196 397 L204 397 L200 404 Z"/>
<rect class="card-w3" x="26" y="404" width="348" height="48" rx="6"/>
<text class="t-onfill lab" x="38" y="424">VPN 業者</text>
<text class="t-onfill bd" x="38" y="442">知道你是誰，也知道你連哪</text>
<path class="arrow" d="M200 452 V464"/>
<path class="arrow-h" d="M196 463 L204 463 L200 470 Z"/>
<rect class="card" x="26" y="470" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="490">網站</text>
<text class="t-main bd" x="38" y="508">看到 VPN 的 IP</text>
<rect class="card-n" x="12" y="546" width="376" height="428" rx="8"/>
<text class="t-main lab" x="26" y="570">經過 Tor</text>
<text class="t-main h2" x="26" y="590">單點被拆開</text>
<rect class="card" x="26" y="596" width="348" height="30" rx="6"/>
<text class="t-main lab" x="38" y="616">你</text>
<path class="arrow" d="M200 626 V638"/>
<path class="arrow-h" d="M196 637 L204 637 L200 644 Z"/>
<rect class="card-ok" x="26" y="644" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="664">ISP</text>
<text class="t-main bd" x="38" y="682">只看到你在用 Tor</text>
<path class="arrow" d="M200 692 V704"/>
<path class="arrow-h" d="M196 703 L204 703 L200 710 Z"/>
<rect class="card-ok" x="26" y="710" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="730">Guard</text>
<text class="t-main bd" x="38" y="748">知道你是誰，不知道你連哪</text>
<path class="arrow" d="M200 758 V770"/>
<path class="arrow-h" d="M196 769 L204 769 L200 776 Z"/>
<rect class="card-ok" x="26" y="776" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="796">Middle</text>
<text class="t-main bd" x="38" y="814">兩邊都不知道</text>
<path class="arrow" d="M200 824 V836"/>
<path class="arrow-h" d="M196 835 L204 835 L200 842 Z"/>
<rect class="card-ok" x="26" y="842" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="862">Exit</text>
<text class="t-main bd" x="38" y="880">知道你連哪，不知道你是誰</text>
<path class="arrow" d="M200 890 V902"/>
<path class="arrow-h" d="M196 901 L204 901 L200 908 Z"/>
<rect class="card" x="26" y="908" width="348" height="48" rx="6"/>
<text class="t-main lab" x="38" y="928">網站</text>
<text class="t-main bd" x="38" y="946">看到出口節點的 IP</text>
<rect class="card-c1" x="12" y="990" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="1014">橘色那一格是同時知道你是誰與你連哪的節點</text>
<text class="t-mute bd" x="26" y="1031">VPN 把它從 ISP 換成 VPN 業者，數量沒有變。</text>
<text class="t-mute bd" x="26" y="1048">Tor 把這兩件事拆給三個互不相干的中繼，任何一個節</text>
<text class="t-mute bd" x="26" y="1065">點都湊不出完整的答案，所以不需要信任其中任何一個。</text>
</svg>
