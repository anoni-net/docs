<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 812" width="400" height="812" role="img" aria-labelledby="title">
<title id="title">三層帳號分流，彼此不共用任何一個識別項</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card, .card-c1, .card-c2, .card-n, .card-w1 { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">分流的基礎</text>
<text class="t-mute bd" x="26" y="41">不同層的帳號不共用 email、不共用 username、</text>
<text class="t-mute bd" x="26" y="58">不共用瀏覽器、不共用密碼管理器資料夾。</text>
<rect class="card-c1" x="12" y="86" width="376" height="168" rx="8"/>
<text class="t-mute lab" x="26" y="110">日常層</text>
<text class="t-main h2" x="26" y="130">長期，跟你的本名綁在一起</text>
<text class="t-main lab" x="26" y="151">裡面有什麼</text>
<text class="t-mute bd" x="36" y="168">email、社群</text>
<text class="t-mute bd" x="36" y="185">銀行、串流服務</text>
<text class="t-mute bd" x="36" y="202">工作與學校相關帳號</text>
<text class="t-main lab" x="26" y="223">預設假設</text>
<text class="t-mute bd" x="36" y="240">家人或同事看到也沒關係。</text>
<rect class="card-c2" x="12" y="264" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="288">社群層</text>
<text class="t-main h2" x="26" y="308">長期，跟日常層完全不交集</text>
<text class="t-main lab" x="26" y="329">裡面有什麼</text>
<text class="t-main bd" x="36" y="346">社群活動的帳號</text>
<text class="t-main bd" x="36" y="363">性傾向相關內容的互動</text>
<text class="t-main bd" x="36" y="380">LGBTQ+ 朋友的聯絡方式</text>
<text class="t-main lab" x="26" y="401">預設假設</text>
<text class="t-main bd" x="36" y="418">能參與社群，但不被串連回日常層。頭</text>
<text class="t-main bd" x="36" y="435">像不用任何家人或同事看得到的照片。</text>
<rect class="card-w1" x="12" y="459" width="376" height="185" rx="8"/>
<text class="t-mute lab" x="26" y="483">探索層</text>
<text class="t-main h2" x="26" y="503">短期，用完就丟</text>
<text class="t-main lab" x="26" y="524">裡面有什麼</text>
<text class="t-mute bd" x="36" y="541">交友 app</text>
<text class="t-mute bd" x="36" y="558">匿名社群</text>
<text class="t-mute bd" x="36" y="575">探索期的測試帳號</text>
<text class="t-main lab" x="26" y="596">預設假設</text>
<text class="t-mute bd" x="36" y="613">風險最高的一層。跟社群層也要分開，</text>
<text class="t-mute bd" x="36" y="630">位置與照片的暴露面都比另外兩層大。</text>
<rect class="card" x="12" y="660" width="376" height="140" rx="8"/>
<text class="t-main h2" x="26" y="684">每一層各自要有的四樣東西</text>
<text class="t-mute bd" x="26" y="701">自己的 email（郵件別名可以從同一個信箱長出</text>
<text class="t-mute bd" x="26" y="718">多個對外地址）、自己的瀏覽器 profile、自</text>
<text class="t-mute bd" x="26" y="735">己的密碼管理器 vault、自己的兩階段驗證群組。</text>
<text class="t-mute bd" x="26" y="752">註冊時避開平台用手機號與通訊錄做的反向匹</text>
<text class="t-mute bd" x="26" y="769">配。帳號存在之後還要防頭像反查、username</text>
<text class="t-mute bd" x="26" y="786">重複、發文時段與寫作風格這幾種串連途徑。</text>
</svg>
