<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 555" width="1060" height="555" role="img" aria-labelledby="title desc">
<title id="title">Agree the attribution level with your source, section by section</title>
<desc id="desc">Four stacked bands running from dark to light, representing the four attribution levels a reporter and a source can agree on, with the source's exposure shrinking as you move down. The first level is on the record, meaning the name and job title can be printed, so the story carries the name, the title and the direct quote. The second level is anonymous quotation, meaning the content can be quoted under a role description, so the story carries a line such as an engineer who worked on the project said. The third level is background, used only to understand the situation and direct verification, with the source neither named nor quoted. The fourth level is not for use, where nothing enters the story at all. The red box below warns that anonymous quotation is the level that goes wrong most often, because the role description can identify the person on its own: if only three people at a company match the description, the description names all three.</desc>
<style>
  /* 配色對齊 community/brand-assets.md 的色票。這個檔案是被 img 標籤引用的獨立 SVG，
     取不到頁面的 CSS 變數，只能寫死 hex。深色模式在檔案內自己處理，站上 palette
     切換的狀態不會傳進獨立的 SVG 檔。 */
