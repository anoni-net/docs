<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 686" width="400" height="686" role="img" aria-labelledby="title">
<title id="title">威胁模型填完之后长什么样子的模拟结果</title>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-n, .card-no, .card-ok { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="24">两个轴，先量威胁再量防护</text>
<text class="t-mute bd" x="26" y="41">横轴是这个组合的实际威胁，从低到</text>
<text class="t-mute bd" x="26" y="58">高。纵轴是你现在的防护，从厚到薄。</text>
<text class="t-mute bd" x="26" y="75">把「要保护的东西」跟「对手是</text>
<text class="t-mute bd" x="26" y="92">谁」配成一组，才落得进某一格。</text>
<rect class="card-n" x="12" y="120" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="144">威胁低，防护厚</text>
<text class="t-main h2" x="26" y="164">过度防护</text>
<text class="t-mute bd" x="26" y="182">成本花在这里回收不了，可以放掉</text>
<text class="t-main lab" x="26" y="203">例子</text>
<text class="t-mute bd" x="36" y="220">家庭群组闲聊，对手是国家级情报监控</text>
<text class="t-mute bd" x="36" y="237">追剧记录，对手是执法调阅</text>
<rect class="card-ok" x="12" y="261" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="285">威胁高，防护厚</text>
<text class="t-main h2" x="26" y="305">已经防住</text>
<text class="t-mute bd" x="26" y="323">保持现状，定期回头确认还有效</text>
<text class="t-main lab" x="26" y="344">例子</text>
<text class="t-mute bd" x="36" y="361">银行账户，对手是诈骗集团</text>
<text class="t-mute bd" x="36" y="378">主要 email，对手是账号盗用</text>
<rect class="card-c1" x="12" y="402" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="426">威胁低，防护薄</text>
<text class="t-main h2" x="26" y="446">可以接受</text>
<text class="t-mute bd" x="26" y="464">知道有风险，决定先不处理</text>
<text class="t-main lab" x="26" y="485">例子</text>
<text class="t-mute bd" x="36" y="502">公开帖子，对手是随意路人</text>
<text class="t-mute bd" x="36" y="519">看过哪些新闻，对手是广告追踪</text>
<rect class="card-no" x="12" y="543" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="567">威胁高，防护薄</text>
<text class="t-main h2" x="26" y="587">还没补上</text>
<text class="t-mute bd" x="26" y="605">这一格就是你的下一步</text>
<text class="t-main lab" x="26" y="626">例子</text>
<text class="t-mute bd" x="36" y="643">云端相册，对手是平台数据泄漏</text>
<text class="t-mute bd" x="36" y="660">旧账号重复使用的密码，对手是撞库攻击</text>
</svg>
