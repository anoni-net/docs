<text class="t-main h2" x="28" y="40">For the organisation: what each collection channel costs</text>
<text class="t-mute sm" x="262" y="70" text-anchor="middle">ANONYMITY</text>
<text class="t-mute sm" x="350" y="70" text-anchor="middle">COMPLIANCE</text>
<text class="t-mute sm" x="438" y="70" text-anchor="middle">SCALE</text>
<text class="t-mute sm" x="526" y="70" text-anchor="middle">CROSS-BORDER</text>
<text class="t-mute sm" x="588" y="70">WHERE IT FITS</text>
<path class="rule" d="M28 80 H912"/>
<rect class="card-c1" x="28" y="92" width="884" height="98" rx="8"/>
<text class="t-main h2" x="44" y="120">Cash</text>
<text class="t-mute sm" x="44" y="138">Public mailbox, events</text>
<rect class="card-ok" x="224" y="106" width="76" height="20" rx="10"/>
<text class="t-main sm" x="262" y="120.5" text-anchor="middle">High</text>
<rect class="card-w1" x="312" y="106" width="76" height="20" rx="10"/>
<text class="t-main sm" x="350" y="120.5" text-anchor="middle">Medium</text>
<rect class="card-no" x="400" y="106" width="76" height="20" rx="10"/>
<text class="t-main sm" x="438" y="120.5" text-anchor="middle">Low</text>
<rect class="card-no" x="488" y="106" width="76" height="20" rx="10"/>
<text class="t-main sm" x="526" y="120.5" text-anchor="middle">No</text>
<text class="t-mute bd" x="588" y="119">Small domestic support, the lowest-friction</text>
<text class="t-mute bd" x="588" y="136">route.</text>
<text class="t-mute bd" x="588" y="153">Public fundraising rules cover more situations</text>
<text class="t-mute bd" x="588" y="170">than people expect, so check first.</text>
<rect class="card-w1" x="28" y="200" width="884" height="98" rx="8"/>
<text class="t-main h2" x="44" y="228">Cryptocurrency</text>
<text class="t-mute sm" x="44" y="246">Self-custody or a hosted</text>
<text class="t-mute sm" x="44" y="263">platform</text>
<rect class="card-ok" x="224" y="214" width="76" height="20" rx="10"/>
<text class="t-main sm" x="262" y="228.5" text-anchor="middle">Med-high</text>
<rect class="card-no" x="312" y="214" width="76" height="20" rx="10"/>
<text class="t-main sm" x="350" y="228.5" text-anchor="middle">High</text>
<rect class="card-ok" x="400" y="214" width="76" height="20" rx="10"/>
<text class="t-main sm" x="438" y="228.5" text-anchor="middle">High</text>
<rect class="card-ok" x="488" y="214" width="76" height="20" rx="10"/>
<text class="t-main sm" x="526" y="228.5" text-anchor="middle">Yes</text>
<text class="t-mute bd" x="588" y="227">Cross-border support for organisations abroad.</text>
<text class="t-mute bd" x="588" y="244">VASP registration, anti-money-laundering and</text>
<text class="t-mute bd" x="588" y="261">tax duties are a clear step up. Sort out</text>
<text class="t-mute bd" x="588" y="278">conversion and accounting first.</text>
<rect class="card-n" x="28" y="308" width="884" height="81" rx="8"/>
<text class="t-main h2" x="44" y="336">Prepaid cards and</text>
<text class="t-main h2" x="44" y="353">codes</text>
<text class="t-mute sm" x="44" y="372">Gift cards, store codes</text>
<rect class="card-w1" x="224" y="322" width="76" height="20" rx="10"/>
<text class="t-main sm" x="262" y="336.5" text-anchor="middle">Medium</text>
<rect class="card-ok" x="312" y="322" width="76" height="20" rx="10"/>
<text class="t-main sm" x="350" y="336.5" text-anchor="middle">Low</text>
<rect class="card-w1" x="400" y="322" width="76" height="20" rx="10"/>
<text class="t-main sm" x="438" y="336.5" text-anchor="middle">Medium</text>
<rect class="card-w1" x="488" y="322" width="76" height="20" rx="10"/>
<text class="t-main sm" x="526" y="336.5" text-anchor="middle">Domestic</text>
<text class="t-mute bd" x="588" y="335">Small domestic gifts with no crypto involved.</text>
<text class="t-mute bd" x="588" y="352">Most donors give up at the step of acquiring a</text>
<text class="t-mute bd" x="588" y="369">privacy coin, and this route fills that gap.</text>
<text class="t-main h2" x="28" y="419">For the donor: work out who you are avoiding, then pick the channel</text>
<rect class="card" x="28" y="433" width="434" height="118" rx="8"/>
<text class="t-main h2" x="44" y="461">Hiding the money trail from family or an employer</text>
<text class="t-mute bd" x="44" y="485">Use: cash, prepaid cards, privacy coins</text>
<text class="t-mute bd" x="44" y="502">Avoid: credit cards, joint bank accounts</text>
<rect class="card" x="478" y="433" width="434" height="118" rx="8"/>
<text class="t-main h2" x="494" y="461">Avoiding an identity record at the organisation</text>
<text class="t-mute bd" x="494" y="485">Use: cash with no email attached, privacy coins to a</text>
<text class="t-mute bd" x="494" y="502">self-custodied wallet</text>
<text class="t-mute bd" x="494" y="519">Avoid: bank transfer, which leaves the account name on their</text>
<text class="t-mute bd" x="494" y="536">books</text>
<rect class="card" x="28" y="565" width="434" height="84" rx="8"/>
<text class="t-main h2" x="44" y="593">Avoiding cross-border surveillance</text>
<text class="t-mute bd" x="44" y="617">Use: Monero, shielded Zcash</text>
<text class="t-mute bd" x="44" y="634">Avoid: Bitcoin through a centralised exchange</text>
<rect class="card" x="478" y="565" width="434" height="84" rx="8"/>
<text class="t-main h2" x="494" y="593">A personal preference for leaving no record</text>
<text class="t-mute bd" x="494" y="617">Use: any cash route</text>
<text class="t-mute bd" x="494" y="634">Avoid: any electronic payment</text>
<text class="t-foot" x="28" y="665">There is no single most anonymous option. Most organisations mix them: cash and prepaid cards day to day, crypto across borders,</text>
<text class="t-foot" x="28" y="687">bank transfer for named donors.</text>
<text class="t-foot" x="28" y="709">Offering both paths lets people who want anonymity have one while people who want to be named still are. Forcing everyone down</text>
<text class="t-foot" x="28" y="731">one path serves neither.</text>
</svg>
