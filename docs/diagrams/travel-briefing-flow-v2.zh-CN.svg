<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 796" width="400" height="796" role="img" aria-labelledby="title desc">
<title id="title">从开场 prompt 到随身紧急卡的四步</title>
<desc id="desc">四个并排的步骤，用箭头串起来。第一步是开场 prompt，把出发地、目的地与停留天数换成你的信息，贴给 AI 设定角色，只需要填一次。第二步是五项调查，逐项复制粘贴即可，内容是数字环境（审查、Tor、VPN、设备搜查）、法律与政治风险、连接与通信（SIM 与 eSIM）、紧急联络与支援网络，以及选用的实体与监控环境。第三步是核对一手来源，拿 AI 的答案去对照文章底部的官方来源，紧急电话、法条编号、签证规则与资费一定要回到一手来源核对。第四步是随身紧急卡，把第四项问到的关键联络抄成卡片，打印出来过塑，钱包与行李各放一张，并同步存进手机离线笔记。最下方的红框提醒 AI 会编造电话、法条与资费。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="168" rx="8"/>
<text class="t-main lab" x="26" y="24">一、开场 prompt</text>
<text class="t-main h2" x="26" y="44">只填一次</text>
<text class="t-main lab" x="26" y="65">要改的地方</text>
<text class="t-mute bd" x="36" y="82">把出发地、目的地与停留天数换成你的信息，</text>
<text class="t-mute bd" x="36" y="99">日期与身份可留白。贴给 AI 设定角色。</text>
<text class="t-main lab" x="26" y="120">两种版本</text>
<text class="t-mute bd" x="36" y="137">完整版给自建与本地 AI。商业服</text>
<text class="t-mute bd" x="36" y="154">务版拿掉会让对话被记住的细节。</text>
<rect class="card-c2" x="12" y="178" width="376" height="164" rx="8"/>
<text class="t-main lab" x="26" y="202">二、五项调查</text>
<text class="t-main h2" x="26" y="222">逐项复制粘贴，不必改字</text>
<text class="t-main lab" x="26" y="243">五项</text>
<text class="t-main bd" x="36" y="260">数字环境：审查、Tor、VPN、设备搜查</text>
<text class="t-main bd" x="36" y="277">法律与政治风险</text>
<text class="t-main bd" x="36" y="294">连接与通信：SIM、eSIM</text>
<text class="t-main bd" x="36" y="311">紧急联络与支援网络</text>
<text class="t-main bd" x="36" y="328">实体与监控环境（选用）</text>
<rect class="card-ok" x="12" y="352" width="376" height="185" rx="8"/>
<text class="t-main lab" x="26" y="376">三、核对一手来源</text>
<text class="t-main h2" x="26" y="396">这一步不能跳过</text>
<text class="t-main lab" x="26" y="417">怎么做</text>
<text class="t-mute bd" x="36" y="434">拿 AI 的答案去对照文章底部的官方来源。</text>
<text class="t-main lab" x="26" y="455">一定要核对的四类</text>
<text class="t-mute bd" x="36" y="472">紧急电话</text>
<text class="t-mute bd" x="36" y="489">法条编号</text>
<text class="t-mute bd" x="36" y="506">签证规则</text>
<text class="t-mute bd" x="36" y="523">资费</text>
<rect class="card-w1" x="12" y="547" width="376" height="113" rx="8"/>
<text class="t-main lab" x="26" y="571">四、随身紧急卡</text>
<text class="t-main h2" x="26" y="591">离线也拿得到的那一份</text>
<text class="t-main lab" x="26" y="612">怎么做</text>
<text class="t-mute bd" x="36" y="629">把第四项问到的关键联络抄成一张卡片。打印出来过</text>
<text class="t-mute bd" x="36" y="646">塑，钱包与行李各放一张。同步存进手机离线笔记。</text>
<rect class="card-no" x="12" y="678" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="702">AI 会编造电话、法条与资费</text>
<text class="t-mute bd" x="26" y="719">语言模型很会「说得很有把握是错的」。把 AI 的回答当</text>
<text class="t-mute bd" x="26" y="736">成「我接下来该查哪些东西」的起点，不要当成最终答案。</text>
<text class="t-mute bd" x="26" y="753">目的地越冷门、公开资料越少，AI 手上的训练数据</text>
<text class="t-mute bd" x="26" y="770">也越少、越容易乱编，偏偏这种地方最需要可靠信息。</text>
</svg>
