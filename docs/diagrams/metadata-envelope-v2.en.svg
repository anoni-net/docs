<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 491" width="400" height="491" role="img" aria-labelledby="title desc">
<title id="title">Encryption covers the letter, not the envelope around it</title>
<desc id="desc">An envelope diagram. On the outside of the envelope are the sender, the recipient, the time and duration, the message size, the subject line, and how often the two exchange messages, all readable without decrypting anything. Inside the envelope is a locked block standing for the end-to-end encrypted letter, which only the recipient can read. To the right are three conclusions drawn from the outside of the envelope alone: that you and a law firm are in regular contact, that you spoke to a reporter for thirty minutes tonight, and that this set of people is your regular circle.</desc>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-w1" x="12" y="0" width="376" height="160" rx="8"/>
<text class="t-main lab" x="26" y="24">On the envelope</text>
<text class="t-main h2" x="26" y="44">Readable without decrypting anything</text>
<text class="t-mute bd" x="26" y="61">Sender</text>
<text class="t-mute bd" x="26" y="78">Recipient</text>
<text class="t-mute bd" x="26" y="95">Time and duration</text>
<text class="t-mute bd" x="26" y="112">Message size</text>
<text class="t-mute bd" x="26" y="129">Subject line (usually not encrypted)</text>
<text class="t-mute bd" x="26" y="146">How often you exchange</text>
<rect class="card-c3" x="12" y="170" width="376" height="77" rx="8"/>
<text class="t-main lab" x="26" y="194">The letter</text>
<text class="t-main h2" x="26" y="214">End-to-end encrypted, only</text>
<text class="t-main h2" x="26" y="233">the recipient reads it</text>
<rect class="card-no" x="12" y="257" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="281">So without reading a word, they know</text>
<text class="t-mute bd" x="26" y="298">You and a law firm are in regular contact</text>
<text class="t-mute bd" x="26" y="315">You spoke to a reporter for 30 minutes tonight</text>
<text class="t-mute bd" x="26" y="332">This set of people is your regular circle</text>
<rect class="card-n" x="12" y="356" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="380">Encryption covers the middle block only</text>
<text class="t-mute bd" x="26" y="397">The ring around it is the by-product of every</text>
<text class="t-mute bd" x="26" y="414">letter, every call, and every connection.</text>
<text class="t-mute bd" x="26" y="431">The same shape holds for a phone call,</text>
<text class="t-mute bd" x="26" y="448">a Signal message, or a Tor circuit.</text>
<text class="t-mute bd" x="26" y="465">Only the field names change.</text>
</svg>
