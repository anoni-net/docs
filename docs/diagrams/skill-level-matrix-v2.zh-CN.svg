<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" width="400" height="668" role="img" aria-labelledby="title desc">
<title id="title">同一个层级在三个工具上分别代表什么</title>
<desc id="desc">三栏三行的对照表。三栏是 Tor、Tails、OONI，三行是认识、实作、贡献三个层级。认识层适合任何想了解的人，在 Tor 是说得出洋葱路由与三层中继，在 Tails 是说得出跟一般操作系统差在哪，在 OONI 是说得出它在测什么。实作层适合记者与公民社会工作者，在 Tor 是装好浏览器并会用桥接，在 Tails 是做出开机U盘并从 USB 进系统，在 OONI 是执行 Probe 产出检测报告。贡献层适合开源社群成员，在 Tor 是架 Relay、Bridge 或 WebTunnel，在 Tails 是备份 Persistent Storage 与用 GnuPG 管理密钥，在 OONI 是用命令行执行指定测试、整理观测名单与分析原始数据。三栏各自独立，不必依序点满。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
  }
</style>

<rect class="card-n" x="12" y="0" width="376" height="106" rx="8"/>
<text class="t-main h2" x="26" y="24">三栏各自独立，不必依序点满</text>
<text class="t-mute bd" x="26" y="41">Tor 是匿名上网的基础，Tails 把整个环境</text>
<text class="t-mute bd" x="26" y="58">拉到高安全需求，OONI 观测与测量网络审查。</text>
<text class="t-mute bd" x="26" y="75">同一个层级在三个工具上不是同一件事。挑跟你想参</text>
<text class="t-mute bd" x="26" y="92">与的主题相关的那一栏，从目前所在的那一格往上走。</text>
<rect class="card-c1" x="12" y="120" width="376" height="172" rx="8"/>
<text class="t-main lab" x="26" y="144">任何想了解的人</text>
<text class="t-main h2" x="26" y="164">认识</text>
<text class="t-main lab" x="26" y="185">Tor</text>
<text class="t-mute bd" x="36" y="202">说得出洋葱路由与三层中继怎么运作</text>
<text class="t-main lab" x="26" y="223">Tails</text>
<text class="t-mute bd" x="36" y="240">说得出 Tails 跟一般操作系统差在哪</text>
<text class="t-main lab" x="26" y="261">OONI</text>
<text class="t-mute bd" x="36" y="278">说得出 OONI 在测什么、为什么要测</text>
<rect class="card-c2" x="12" y="302" width="376" height="172" rx="8"/>
<text class="t-main lab" x="26" y="326">记者、公民社会工作者</text>
<text class="t-main h2" x="26" y="346">实作</text>
<text class="t-main lab" x="26" y="367">Tor</text>
<text class="t-main bd" x="36" y="384">装好 Tor Browser，会用桥接连线</text>
<text class="t-main lab" x="26" y="405">Tails</text>
<text class="t-main bd" x="36" y="422">做出开机 U 盘，从 USB 进系统</text>
<text class="t-main lab" x="26" y="443">OONI</text>
<text class="t-main bd" x="36" y="460">执行 Probe 产出报告，看得懂 Explorer 的结果</text>
<rect class="card-c3" x="12" y="484" width="376" height="172" rx="8"/>
<text class="t-main lab" x="26" y="508">开源社群成员</text>
<text class="t-main h2" x="26" y="528">贡献</text>
<text class="t-main lab" x="26" y="549">Tor</text>
<text class="t-main bd" x="36" y="566">架 Relay、Bridge 或 WebTunnel</text>
<text class="t-main lab" x="26" y="587">Tails</text>
<text class="t-main bd" x="36" y="604">备份 Persistent Storage，用 GnuPG 管理密钥</text>
<text class="t-main lab" x="26" y="625">OONI</text>
<text class="t-main bd" x="36" y="642">命令行执行指定测试，整理名单、分析原始数据</text>
</svg>
