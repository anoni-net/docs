<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 810" width="400" height="810" role="img" aria-labelledby="title">
<title id="title">同一組 metadata，既讓紀錄可信也讓人曝險</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card, .card-c1, .card-no, .card-ok { stroke-width: 1.3; }
  .card { fill: #ffffff; stroke: #cfd8dc; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-no { fill: #fdecea; stroke: #d32f2f; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .rule { stroke: #46515a; }
    .card { fill: #23292e; stroke: #4b565e; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="123" rx="8"/>
<text class="t-main h2" x="26" y="24">現場紀錄承載的張力</text>
<text class="t-mute bd" x="26" y="41">讓紀錄「作為證據可信」的 metadata，</text>
<text class="t-mute bd" x="26" y="58">正好也是「讓人曝險」的那些 metadata。</text>
<text class="t-mute bd" x="26" y="75">一張帶時間戳記與 GPS 座標的照片，是「某個違規在特</text>
<text class="t-mute bd" x="26" y="92">定時間地點發生過」的有力證據。同一組 EXIF 資料，在</text>
<text class="t-mute bd" x="26" y="109">被扣押的裝置上，可以定位你以及畫面裡任何可辨識的人。</text>
<text class="t-main h1" x="12" y="159">這件事沒有通用的正確答案，只有逐項要做的決定</text>
<path class="rule" d="M12 169 H388"/>
<rect class="card-ok" x="12" y="181" width="376" height="200" rx="8"/>
<text class="t-main h2" x="26" y="205">保留 metadata</text>
<text class="t-mute bd" x="26" y="223">判準：紀錄的價值在於可驗證，而畫面中的人不會因此受害</text>
<text class="t-main lab" x="26" y="244">適用的畫面</text>
<text class="t-mute bd" x="36" y="261">空的票匭</text>
<text class="t-mute bd" x="36" y="278">張貼出來的開票結果</text>
<text class="t-mute bd" x="36" y="295">沒有可辨識面孔的排隊人潮</text>
<text class="t-mute bd" x="36" y="312">公職人員執行職務的過程</text>
<text class="t-main lab" x="26" y="333">這樣做的理由</text>
<text class="t-mute bd" x="36" y="350">時間戳記與座標讓紀錄可以被第三方查證。</text>
<text class="t-mute bd" x="36" y="367">拿掉之後，這張照片只剩下你的證詞。</text>
<rect class="card-no" x="12" y="391" width="376" height="217" rx="8"/>
<text class="t-main h2" x="26" y="415">去除或避免 metadata</text>
<text class="t-mute bd" x="26" y="433">判準：紀錄可能指認出會因此陷入危險的人</text>
<text class="t-main lab" x="26" y="454">適用的畫面</text>
<text class="t-mute bd" x="36" y="471">選務人員</text>
<text class="t-mute bd" x="36" y="488">面露恐懼的投票人</text>
<text class="t-mute bd" x="36" y="505">在不友善環境中的同行觀察員</text>
<text class="t-mute bd" x="36" y="522">任何可辨識的一般投票人</text>
<text class="t-main lab" x="26" y="543">怎麼做</text>
<text class="t-mute bd" x="36" y="560">拍攝時就讓臉孔與可辨識細節不入鏡。影</text>
<text class="t-mute bd" x="36" y="577">像離開裝置前先清除 EXIF，在證明不帶</text>
<text class="t-mute bd" x="36" y="594">metadata 之前，把每個檔案都當成帶著。</text>
<rect class="card" x="12" y="624" width="376" height="174" rx="8"/>
<text class="t-main h2" x="26" y="648">現場記錄的四項實務</text>
<text class="t-mute bd" x="26" y="665">拍文件與環境，不拍臉，除非那張臉本身就是違規</text>
<text class="t-mute bd" x="26" y="682">事實，而且當事人同意或那是公職人員執行職務。</text>
<text class="t-mute bd" x="26" y="699">保留一份離線、可驗證的備份。本機的加</text>
<text class="t-mute bd" x="26" y="716">密副本在網路允許時再同步給任務團隊。</text>
<text class="t-mute bd" x="26" y="733">用結構化的工具記票數與事件。任務發的表</text>
<text class="t-mute bd" x="26" y="750">單或共用的加密文件，能讓紀錄格式一致。</text>
<text class="t-mute bd" x="26" y="767">不要把身分寫進紀錄裡。名字不是關鍵資訊時，用</text>
<text class="t-mute bd" x="26" y="784">角色代稱，例如「主任管理員」、「第 4 站觀察員」。</text>
</svg>
