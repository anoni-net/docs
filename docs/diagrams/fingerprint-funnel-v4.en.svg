<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" role="img" aria-labelledby="title">
<title id="title">Each measured trait removes another batch of people who still look like you</title>
<style>
  text { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1, .card-c2, .card-c3, .card-n, .card-w3 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; }
  .card-c3 { fill: #80d1ff; stroke: #0089bf; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-c3 { fill: #14495f; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<text class="t-main h1" x="12" y="22">Each trait added removes another batch</text>
<text class="t-main h1" x="12" y="42">of people who still look like you</text>
<path class="rule" d="M12 52 H388"/>
<rect class="card-c1" x="26" y="70" width="348" height="26" rx="6"/>
<text class="t-main h2" x="200" y="88" text-anchor="middle">Everyone</text>
<text class="t-mute bd" x="200" y="108" text-anchor="middle">Nothing measured yet</text>
<rect class="card-c1" x="50" y="124" width="300" height="26" rx="6"/>
<text class="t-main h2" x="200" y="142" text-anchor="middle">Everyone in your time zone</text>
<text class="t-mute bd" x="200" y="162" text-anchor="middle">Add time zone</text>
<rect class="card-c2" x="74" y="178" width="253" height="26" rx="6"/>
<text class="t-main h2" x="200" y="196" text-anchor="middle">Still a lot of people</text>
<text class="t-mute bd" x="200" y="216" text-anchor="middle">Add language and OS</text>
<rect class="card-c2" x="97" y="232" width="205" height="26" rx="6"/>
<text class="t-main h2" x="200" y="250" text-anchor="middle">Noticeably narrower</text>
<text class="t-mute bd" x="200" y="270" text-anchor="middle">Add screen and window size</text>
<rect class="card-c3" x="121" y="286" width="158" height="26" rx="6"/>
<text class="t-main h2" x="200" y="304" text-anchor="middle">Not many left</text>
<text class="t-mute bd" x="200" y="324" text-anchor="middle">Add graphics hardware</text>
<rect class="card-w3" x="145" y="340" width="110" height="26" rx="6"/>
<text class="t-onfill h2" x="200" y="358" text-anchor="middle">You</text>
<text class="t-mute bd" x="200" y="378" text-anchor="middle">Add the full font list</text>
<rect class="card-n" x="12" y="398" width="376" height="140" rx="8"/>
<text class="t-main h2" x="26" y="422">Why there is no button to clear a fingerprint</text>
<text class="t-mute bd" x="26" y="439">No single trait identifies you. Together</text>
<text class="t-mute bd" x="26" y="456">they do. A fingerprint is not something that</text>
<text class="t-mute bd" x="26" y="473">gets stored, so there is nothing to clear.</text>
<text class="t-mute bd" x="26" y="490">Step widths are illustrative, not measured. EFF's</text>
<text class="t-mute bd" x="26" y="507">2010 Panopticlick study collected 470,161 browser</text>
<text class="t-mute bd" x="26" y="524">samples, of which 83.6% had a unique fingerprint.</text>
</svg>
