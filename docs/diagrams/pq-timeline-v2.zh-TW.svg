<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 496" width="400" height="496" role="img" aria-labelledby="title desc">
<title id="title">後量子密碼（PQC）遷移時程</title>
<desc id="desc">後量子密碼（PQC）遷移時程</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-c2 { fill: #b3e3ff; stroke: #26b3ff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-c2 { fill: #10394b; stroke: #26b3ff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="38" rx="8"/>
<text class="t-main h2" x="26" y="24">後量子密碼（PQC）遷移時程</text>
<rect class="card-n" x="12" y="50" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="74">2023</text>
<text class="t-main h2" x="26" y="94">Signal PQXDH</text>
<rect class="card-n" x="12" y="118" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="142">2024</text>
<text class="t-main h2" x="26" y="162">NIST FIPS 203、204、205</text>
<rect class="card-c2" x="12" y="186" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="210">2024</text>
<text class="t-main h2" x="26" y="230">Chrome 124、Cloudflare PQC</text>
<rect class="card-c2" x="12" y="254" width="376" height="58" rx="8"/>
<text class="t-main lab" x="26" y="278">2025</text>
<text class="t-main h2" x="26" y="298">Firefox 132、AWS KMS PQC、OpenSSH 9.9</text>
<rect class="card-w1" x="12" y="322" width="376" height="76" rx="8"/>
<text class="t-main lab" x="26" y="346">2030 到 2035</text>
<text class="t-main h2" x="26" y="366">主要系統應完成轉換</text>
<text class="t-mute bd" x="26" y="384">NIST、NSA、ENISA 的目標區間</text>
<rect class="card-w3" x="12" y="408" width="376" height="76" rx="8"/>
<text class="t-onfill lab" x="26" y="432">2040</text>
<text class="t-onfill h2" x="26" y="452">舊密碼學不應再有重要部署</text>
<text class="t-onfill bd" x="26" y="470">硬時間表</text>
</svg>
