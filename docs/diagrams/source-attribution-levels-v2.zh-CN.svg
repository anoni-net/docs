<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 605" width="400" height="605" role="img" aria-labelledby="title desc">
<title id="title">跟来源约定引用层级，逐段确认比整场一次确认可靠</title>
<desc id="desc">四层由深到浅的横条，代表记者与消息来源可以约定的四种引用层级，越往下来源的暴露面越小。第一层是具名，意思是可以写出姓名与职称，报道里会出现姓名、职称与原话。第二层是匿名引用，意思是可以引述内容但用角色代称，报道里会出现像「一位参与该项目的工程师表示」这样的句子。第三层是背景，只用来理解事情与指引查证方向，来源不出现也不被引述。第四层是不使用，内容完全不进入报道。下方的红框提醒匿名引用最容易出事，因为代称本身可能就足以指认，一家公司里符合描述的只有三个人时，代称等于点名了三个人。</desc>
<style>
  text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; stroke-width: 1.3; }
  .card-no { fill: #fdecea; stroke: #d32f2f; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-no { fill: #35181a; stroke: #e57373; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
  }
</style>

<rect class="card-no" x="12" y="0" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="24">具名</text>
<text class="t-main lab" x="26" y="45">意思</text>
<text class="t-mute bd" x="36" y="62">可以写出姓名与职称</text>
<text class="t-main lab" x="26" y="83">报道里会出现什么</text>
<text class="t-mute bd" x="36" y="100">姓名、职称、原话</text>
<rect class="card-w2" x="12" y="124" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="148">匿名引用</text>
<text class="t-main lab" x="26" y="169">意思</text>
<text class="t-main bd" x="36" y="186">可以引述内容，用角色代称</text>
<text class="t-main lab" x="26" y="207">报道里会出现什么</text>
<text class="t-main bd" x="36" y="224">「一位参与该项目的工程师表示」</text>
<rect class="card-w1" x="12" y="248" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="272">背景</text>
<text class="t-main lab" x="26" y="293">意思</text>
<text class="t-mute bd" x="36" y="310">只用来理解事情、指引查证方向</text>
<text class="t-main lab" x="26" y="331">报道里会出现什么</text>
<text class="t-mute bd" x="36" y="348">来源不出现，也不引述</text>
<rect class="card-n" x="12" y="372" width="376" height="114" rx="8"/>
<text class="t-main h2" x="26" y="396">不使用</text>
<text class="t-main lab" x="26" y="417">意思</text>
<text class="t-mute bd" x="36" y="434">完全不进入报道</text>
<text class="t-main lab" x="26" y="455">报道里会出现什么</text>
<text class="t-mute bd" x="36" y="472">无</text>
<rect class="card-c1" x="12" y="504" width="376" height="89" rx="8"/>
<text class="t-main h2" x="26" y="528">匿名引用最容易出事</text>
<text class="t-mute bd" x="26" y="545">代称本身可能就足以指认。一家公司里符合「参与该项目的</text>
<text class="t-mute bd" x="26" y="562">工程师」描述的只有三个人时，这个代称等于点名了三个人。</text>
<text class="t-mute bd" x="26" y="579">谈的时候把描述再放宽一级，或者改走背景层级。</text>
</svg>
