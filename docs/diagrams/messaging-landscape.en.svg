<text class="ax-end"  x="138" y="412" text-anchor="end">A central server</text>
<text class="ax-end"  x="138" y="428" text-anchor="end">sees everything</text>

<text class="ax-end"  x="150" y="456" text-anchor="start">Bound to a phone number</text>
<text class="ax-name" x="505" y="456" text-anchor="middle">How identity is bound</text>
<text class="ax-end"  x="872" y="456" text-anchor="end">No lookupable identity</text>

