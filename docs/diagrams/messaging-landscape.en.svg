<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 552" width="920" height="552" role="img" aria-labelledby="title desc">
<title id="title">Where messaging tools land on identity binding and metadata</title>
<desc id="desc">A scatter plot. The horizontal axis is how identity is bound, from a phone number on the left to no lookupable identity on the right. The vertical axis is where metadata sits, from a central server seeing everything at the bottom to no central server to look at, at the top. LINE, Telegram, and WhatsApp, the comparison group, sit in the lower left. Signal sits higher because of its metadata-minimising design, and still to the left because identity is tied to a phone number. Matrix sits centre-low, since every homeserver in a room can see the traffic. Session, SimpleX, and Briar sit in the upper right, with no phone binding and no central server holding who talks to whom. Positions are relative rather than measured.</desc>
<style>
  /* Colours follow the palette in community/brand-assets.md. This file is a standalone
     SVG pulled in by an img tag, so it cannot reach the page CSS variables and the hex
     values have to be literal. Orange marks what is exposed and cyan what is protected,
     matching the other diagrams on the site. */
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans GB", "Source Han Sans TC", sans-serif; }
  .axis { stroke: #cdcdcd; stroke-width: 1.5; }
  .guide { stroke: #cdcdcd; stroke-width: 1; stroke-dasharray: 4 5; opacity: .7; }
  .ax-name { fill: #546e7a; font-size: 13.5px; font-weight: 700; }
  .ax-end { fill: #90a4ae; font-size: 12px; }
  .dot-main { fill: #0089bf; }
  .dot-ref { fill: #ef6c00; }
  .lbl { fill: #212121; font-size: 14px; font-weight: 600; }
  .lbl-note { fill: #78909c; font-size: 11.5px; }
  .legend { fill: #546e7a; font-size: 12.5px; }
  .foot { fill: #546e7a; font-size: 13px; }

  @media (prefers-color-scheme: dark) {
    .axis { stroke: #45505a; }
    .guide { stroke: #4b565e; }
    .ax-name { fill: #b0bec5; }
    .ax-end { fill: #78909c; }
    .dot-main { fill: #4dbfff; }
    .dot-ref { fill: #ff8c1a; }
    .lbl { fill: #eceff1; }
    .lbl-note { fill: #90a4ae; }
    .legend { fill: #b0bec5; }
    .foot { fill: #b0bec5; }
  }
</style>

<line class="axis" x1="150" y1="60" x2="150" y2="432"/>
<line class="axis" x1="150" y1="432" x2="872" y2="432"/>
<line class="guide" x1="150" y1="250" x2="872" y2="250"/>
<line class="guide" x1="505" y1="60" x2="505" y2="432"/>

<text class="ax-end"  x="138" y="76"  text-anchor="end">No central server</text>
<text class="ax-end"  x="138" y="92"  text-anchor="end">to look at</text>
<text class="ax-name" x="138" y="242" text-anchor="end">metadata</text>
