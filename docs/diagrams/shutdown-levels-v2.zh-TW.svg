<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 874" width="400" height="874" role="img" aria-labelledby="title desc">
<title id="title">斷網分四級，每一級還剩下的選項不同</title>
<desc id="desc">四層由淺到深的橫條，代表網路中斷的四個等級，越往下可用的選項越少。第一級是降速與間歇中斷，判斷方式是小檔案過得去、大檔案過不去，還剩下文字通訊與離線編輯之後等時機送出，最常見的誤判是當成自己的裝置壞了而反覆重開機。第二級是特定服務被擋，判斷方式是同一條線路上別的網站開得起來，還剩下沒有被擋的其他管道，最常見的誤判是一個 app 開不起來就認定整條線路斷了。第三級是區域全斷，判斷方式是換 Wi-Fi、換門號結果相同而且旁邊的人也一樣，還剩下事先存好的東西、藍牙與區域網路、實體傳遞，最常見的誤判是以為藍牙與區域網路也跟著失效。第四級是連電力一起中斷，不必判斷就很明顯，還剩下電池撐得住的時間、紙本與事先約好的見面方式，最常見的誤判是重點還放在通訊工具而沒有換成電力管理。</desc>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .t-onfill { fill: #212121; }
  .h1   { font-size: 15px; font-weight: 700; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .chip { font-size: 13px; }
  .rule { stroke: #cfd8dc; stroke-width: 1.2; fill: none; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; stroke-width: 1.3; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; stroke-width: 1.3; }
  .card-w2 { fill: #f8b878; stroke: #ef6c00; stroke-width: 1.3; }
  .card-w3 { fill: #ef6c00; stroke: #c85a00; stroke-width: 1.3; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .t-onfill { fill: #241708; }
    .rule { stroke: #46515a; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
    .card-w2 { fill: #7d4b19; stroke: #ff8c1a; }
    .card-w3 { fill: #ff8c1a; stroke: #ffa64d; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="203" rx="8"/>
<text class="t-main lab" x="26" y="24">第一級</text>
<text class="t-main h2" x="26" y="44">降速與間歇中斷</text>
<text class="t-mute bd" x="26" y="62">小檔案過得去，大檔案過不去。純文字的服務仍然可用。</text>
<text class="t-main lab" x="26" y="83">還剩下</text>
<text class="t-mute bd" x="36" y="100">文字通訊</text>
<text class="t-mute bd" x="36" y="117">低頻寬的工作方式</text>
<text class="t-mute bd" x="36" y="134">離線編輯之後等時機送出</text>
<text class="t-main lab" x="26" y="155">最常見的誤判</text>
<text class="t-mute bd" x="36" y="172">當成自己的裝置壞了，反覆重</text>
<text class="t-mute bd" x="36" y="189">開機、重裝 app、重設路由器。</text>
<rect class="card-w1" x="12" y="213" width="376" height="187" rx="8"/>
<text class="t-main lab" x="26" y="237">第二級</text>
<text class="t-main h2" x="26" y="257">特定服務被擋</text>
<text class="t-mute bd" x="26" y="275">同一條線路上別的網站開得起來。四級裡</text>
<text class="t-mute bd" x="26" y="293">唯一能用 OONI 這類公開量測確認的一級。</text>
<text class="t-main lab" x="26" y="314">還剩下</text>
<text class="t-mute bd" x="36" y="331">沒有被擋的其他管道</text>
<text class="t-mute bd" x="36" y="348">規避工具</text>
<text class="t-main lab" x="26" y="369">最常見的誤判</text>
<text class="t-mute bd" x="36" y="386">一個 app 開不起來，就認定整條線路斷了。</text>
<rect class="card-w2" x="12" y="410" width="376" height="221" rx="8"/>
<text class="t-main lab" x="26" y="434">第三級</text>
<text class="t-main h2" x="26" y="454">區域全斷</text>
<text class="t-main bd" x="26" y="472">換 Wi-Fi、換門號結果相同，旁邊的人也一樣。訊號格數</text>
<text class="t-main bd" x="26" y="490">幫不上忙。撥電話或送簡訊可以分辨被切掉的是不是數據。</text>
<text class="t-main lab" x="26" y="511">還剩下</text>
<text class="t-main bd" x="36" y="528">裝置上事先存好的東西</text>
<text class="t-main bd" x="36" y="545">藍牙與區域網路的近距離連線</text>
<text class="t-main bd" x="36" y="562">隨身碟、紙本、當面說明</text>
<text class="t-main lab" x="26" y="583">最常見的誤判</text>
<text class="t-main bd" x="36" y="600">以為所有無線功能都失效。藍牙與區域網路</text>
<text class="t-main bd" x="36" y="617">不經過電信商與網際網路，這一級仍然運作。</text>
<rect class="card-w3" x="12" y="641" width="376" height="221" rx="8"/>
<text class="t-onfill lab" x="26" y="665">第四級</text>
<text class="t-onfill h2" x="26" y="685">連電力一起中斷</text>
<text class="t-onfill bd" x="26" y="703">不必判斷，很明顯。問題從「訊息送</text>
<text class="t-onfill bd" x="26" y="721">不出去」換成「幾小時之後會關機」。</text>
<text class="t-onfill lab" x="26" y="742">還剩下</text>
<text class="t-onfill bd" x="36" y="759">電池撐得住的那段時間</text>
<text class="t-onfill bd" x="36" y="776">紙本</text>
<text class="t-onfill bd" x="36" y="793">事先約好的見面方式</text>
<text class="t-onfill lab" x="26" y="814">最常見的誤判</text>
<text class="t-onfill bd" x="36" y="831">重點還放在通訊工具，沒有換成電力管理。行動</text>
<text class="t-onfill bd" x="36" y="848">電源與調暗螢幕在這一級決定你還有多少時間。</text>
</svg>
