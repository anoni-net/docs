<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 788" width="400" height="788" role="img" aria-labelledby="title">
<title id="title">web_connectivity 的四個判定階段，差異出現在哪一階就停在哪一階</title>
<style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif; }
  .t-main { fill: #212121; }
  .t-mute { fill: #546e7a; }
  .h2   { font-size: 14px; font-weight: 700; }
  .lab  { font-size: 13px; font-weight: 700; }
  .bd   { font-size: 13px; }
  .card-c1, .card-n, .card-ok, .card-w1 { stroke-width: 1.3; }
  .card-c1 { fill: #e0f4ff; stroke: #4dbfff; }
  .card-n { fill: #f4f6f7; stroke: #b0bec5; }
  .card-ok { fill: #e8f5e9; stroke: #4caf50; }
  .card-w1 { fill: #fdf0e4; stroke: #f8b878; }

  @media (prefers-color-scheme: dark) {
    .t-main { fill: #eceff1; }
    .t-mute { fill: #b0bec5; }
    .card-c1 { fill: #0d2b38; stroke: #4dbfff; }
    .card-n { fill: #1c2226; stroke: #46515a; }
    .card-ok { fill: #17301a; stroke: #4caf50; }
    .card-w1 { fill: #2b1f16; stroke: #8a5420; }
  }
</style>

<rect class="card-c1" x="12" y="0" width="376" height="72" rx="8"/>
<text class="t-main h2" x="26" y="24">同一個網址，兩邊各測一次</text>
<text class="t-mute bd" x="26" y="41">Probe 端從你所在的網路測一次，test helper</text>
<text class="t-mute bd" x="26" y="58">從外部網路測一次，接著逐階段比對差異。</text>
<rect class="card-n" x="12" y="86" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="110">第 1 階</text>
<text class="t-main h2" x="26" y="130">DNS 解析結果一致嗎</text>
<text class="t-mute bd" x="26" y="148">比對兩邊的 A 與 AAAA 查詢結果</text>
<text class="t-main lab" x="26" y="169">不一致 →</text>
<text class="t-mute bd" x="36" y="186">blocking: "dns"</text>
<text class="t-mute bd" x="36" y="203">解析結果對不上</text>
<rect class="card-n" x="12" y="227" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="251">第 2 階</text>
<text class="t-main h2" x="26" y="271">Probe 連得上 TCP 嗎</text>
<text class="t-mute bd" x="26" y="289">先確認 test helper 那一端連得上</text>
<text class="t-main lab" x="26" y="310">連不上 →</text>
<text class="t-mute bd" x="36" y="327">blocking: "tcp_ip"</text>
<text class="t-mute bd" x="36" y="344">連不到目標位址</text>
<rect class="card-n" x="12" y="368" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="392">第 3 階</text>
<text class="t-main h2" x="26" y="412">HTTP 階段成功嗎</text>
<text class="t-mute bd" x="26" y="430">請求送得出去，也收得到回應</text>
<text class="t-main lab" x="26" y="451">失敗 →</text>
<text class="t-mute bd" x="36" y="468">blocking: "http-failure"</text>
<text class="t-mute bd" x="36" y="485">HTTP 階段就斷了</text>
<rect class="card-n" x="12" y="509" width="376" height="131" rx="8"/>
<text class="t-mute lab" x="26" y="533">第 4 階</text>
<text class="t-main h2" x="26" y="553">內容跟 test helper 拿到的一樣嗎</text>
<text class="t-mute bd" x="26" y="571">比對狀態碼、標題、內文長度與 body</text>
<text class="t-main lab" x="26" y="592">不一樣 →</text>
<text class="t-mute bd" x="36" y="609">blocking: "http-diff"</text>
<text class="t-mute bd" x="36" y="626">回應被換掉了</text>
<rect class="card-ok" x="12" y="656" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="680">四階都通過 blocking: false accessible: true</text>
<text class="t-mute bd" x="26" y="697">兩邊都正常，內容也相符。</text>
<rect class="card-w1" x="12" y="721" width="376" height="55" rx="8"/>
<text class="t-main h2" x="26" y="745">判定在哪一階停下，後面就不再比對</text>
<text class="t-mute bd" x="26" y="762">前三種情況下四個 match 欄位全是 null，原因就在這裡。</text>
</svg>
