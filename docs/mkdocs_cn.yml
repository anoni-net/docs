docs_dir: !ENV [DOCS_DIR, "zh-CN"]
site_name: !ENV [SITE_NAME, "匿名网络社群 anoni.net/Docs"]
site_url: !ENV [SITE_URL, "https://anoni.net/docs/zh-cn/"]
edit_uri:
  !ENV [EDIT_URI, "https://github.com/anoni-net/docs/blob/main/docs/zh-CN/"]

site_description:
  !ENV [SITE_DESC, "推广与翻译匿名网络 Tor、Tails 与 OONI 观测工具"]
site_author: anoni.net Volunteer
repo_url: https://github.com/anoni-net/docs
repo_name: 匿名网络社群文件
copyright: "CC-BY 4.0 2023-2026 anoni.net Docs Project"
nav:
  - index.md
  - !ENV [NAV_GUIDES, "指南"]:
      - guides/index.md
      - !ENV [NAV_BASICS, "概念"]:
          - basics/index.md
          - basics/internet-freedom.md
          - basics/anonymity-vs-privacy.md
          - basics/threat-model.md
          - basics/metadata.md
          - basics/platform-tracking.md
          - basics/browser-fingerprinting.md
          - basics/surveillance-capability.md
          - basics/multiple-identities.md
          - basics/payments-anonymity.md
      # 子分组沿用 tools/index.md 的四层分法，侧边栏与索引页看到的是同一套结构。
      # 改这里的分组时同步改那一页，不要各写各的。
      - !ENV [NAV_TOOLS, "工具"]:
          - tools/index.md
          - tools/what-is-anonymity-network.md
          - "连线层：Tor 工具家族":
              - tools/what-is-tor.md
              - tools/tor-browser-advanced.md
              - tools/tor-snowflake.md
              - tools/signal-proxy.md
              - tools/onionshare.md
              - tools/vpn-guide.md
              - tools/encrypted-dns.md
          - "环境层：匿名作业系统":
              - tools/what-is-tails.md
              - tools/tails-vs-whonix-vs-qubes.md
              - tools/grapheneos.md
          - "观测层：审查的可验证记录":
              - tools/what-is-ooni.md
              - tools/ooni-run-v2.md
          - "日常隐私基本功":
              - tools/messaging-comparison.md
              - tools/what-is-cryptpad.md
              - tools/password-manager.md
              - tools/asian-diceware.md
              - tools/email-alias.md
              - tools/crypto-privacy-spectrum.md
              - tools/ai-privacy.md
      # 顺序与分组跟着 scenarios/index.md 的「已上线」「撰写中」两节走。撰写中的页面
      # 目前是大纲加可用段落，收进独立分组让读者点进去之前就知道。写完了就移上来。
      - !ENV [NAV_SCENARIOS, "场景"]:
          - scenarios/index.md
          - scenarios/everyday-baseline.md
          - scenarios/journalist.md
          - scenarios/activist.md
          - scenarios/lgbtq.md
          - scenarios/nonprofit-anonymous-donation.md
          - scenarios/mainland-speech.md
          - scenarios/asia-travel.md
          - scenarios/travel-ai-briefing.md
          - "撰写中（2026 Q3）":
              - scenarios/domestic-violence.md
              - scenarios/election-observer.md
      - !ENV [NAV_ADVANCED, "进阶"]:
          - advanced/index.md
          - advanced/e2ee.md
          - advanced/post-quantum.md
          - advanced/dweb-ipfs-onion.md
          - advanced/zk-identity-payments.md
          - advanced/mistaken-for-anonymity.md
      - !ENV [NAV_REPORTS, "报告"]:
          - reports/index.md
  # taiwan/index.md 把法规那三篇分成「个资与身分」「金流」「制度与技术交界」，各自
  # 只有一篇。侧边栏做成三个单页分组只会更难扫，所以合并成「法规与制度」一组。
  - !ENV [NAV_TAIWAN, "在地脉络"]:
      - taiwan/index.md
      - "连线层的在地观测":
          - taiwan/ooni-checklist.md
          - taiwan/ooni-asn-coverage.md
          - taiwan/tor-relay-watcher.md
      - "法规与制度":
          - taiwan/pdpa-2025.md
          - taiwan/vasp-2026.md
          - taiwan/whistleblower-law.md
  - !ENV [NAV_UTILS, "小工具"]:
      - utils/index.md
      - utils/threat-model.md
      - utils/passphrase.md
      - utils/qrcode.md
      - utils/qr-read.md
      - utils/strip-metadata.md
      - utils/clean-url.md
      - utils/invisible.md
      - utils/leaks.md
  - !ENV [NAV_GAMES, "互动与呈现"]:
      - games/index.md
      - games/onion-routing.md
      - games/onion-rendezvous.md
      - games/tor-network.md
  - !ENV [NAV_POST, "信息更新"]:
      - blog/index.md
      - !ENV [NAV_CHANGELOG, "软件更新日志"]:
          - changelog/index.md
          - changelog/tor.md
          - changelog/tails.md
          - changelog/arti.md
          - changelog/ooni.md
  - !ENV [NAV_COMMUNITY, "社群"]:
      - community/index.md
      - "加入社群":
          - community/how-to-contribute.md
          - community/tools.md
          - community/skill-level.md
          - community/tor-project-ecosystem.md
          - community/upload-sensitive.md
          - community/governance.md
      - "文档与开发":
          - community/contributor-handbook.md
          - community/i18n.md
          - community/zh-hant-naming.md
          - community/become-anoni.md
          - community/setup-repo.md
          - community/brand-assets.md
      - "架设节点":
          - community/setup-tor-relay.md
          - community/setup-tor-webtunnel.md
          - community/pin-ipfs-mirror.md
      - "读懂观测资料":
          - community/ooni-data-format.md
          - community/ooni-blocking-determination.md
          - community/ooni-nettests-map.md
          - community/asn-coverage-howto.md
          - community/onionoo-mcp.md
      - "2026 主题":
          - community/roadmap-2026.md
          - community/privacy-guide.md
          - community/relay-on-campus.md
          - community/payments-research.md
      - !ENV [NAV_EVENT, "活动参与"]:
          - activity/index.md
          - activity/coscup-2026-cfp.md
          - activity/coscup-2026.md
          - event-workshop-2025.md
          - !ENV [NAV_EVENT_PREPARE, "筹备页面"]:
              - event-workshop-2025-prepare.md
  - !ENV [NAV_ABOUT, "关于我们"]:
      - about/index.md
      - contact.md
      - help/index.md
      - offline.md
theme:
  name: material
  logo: assets/images/logo-white.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: light blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  language: !ENV [LANGUAGE, "zh"]
  custom_dir: !ENV [OVERRIDES, "overrides_cn"]
  features:
    - navigation.top
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.action.view
    - content.action.edit
    - content.tooltips
    - content.code.copy
    - content.footnote.tooltips
extra:
  # 每一筆分析資料都帶著這個標籤，改版前後才比較得出來。CI 由 build_docs.yml
  # 帶 commit 短碼進來，本機建置就是 dev。
  build_tag: !ENV [BUILD_TAG, "dev"]
  alternate:
    # zh-TW 是網站預設語系，建在根路徑，沒有獨立語系區段。理由見 mkdocs.yml 的註解。
    - name: 臺灣正體（zh-TW）
      link: /docs/
      lang: zh-TW
    - name: 简体中文（zh-CN）
      link: /docs/zh-cn/
      lang: zh-CN
    - name: English (en-US)
      link: /docs/en/
      lang: en
  social:
    - icon: material/home
      link: https://anoni.net/docs/
    - icon: fontawesome/brands/github
      link: https://github.com/anoni-net/docs
    - icon: simple/torbrowser
      link: http://docs.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/
    - icon: material/email-plus
      link: https://form.anoni.net/s/cmc9ceju1000dlj017fiathzq
extra_css:
  - stylesheets/extra.css
# vega 三件套（約 820 KB）不放在這裡。放進 extra_javascript 等於全站每一頁都載，
# 而全站 198 頁裡只有 3 頁畫圖表。改成那三頁各自在內文裡引用，見 snippets/vega.md。
# privacy plugin 照樣會把它們抓成本地檔案，只是現在只有需要的頁面才連過去。
#
# 底下這一個檔案的檔名同時含 vega、vega-lite、vega-embed，是為了通過
# mkdocs-charts-plugin 在 on_config 的相依檢查，理由寫在那個檔案裡。
# tools/test_chart_assets.mjs 守著這個安排。
extra_javascript:
  - js/vega-vega-lite-vega-embed-ondemand.js
hooks:
  - hooks/latest_posts.py
  - hooks/offline_index.py
plugins:
  - search:
      lang:
        - zh
        - en
  - redirects:
      redirect_maps:
        # 2026 扁平结构 → 7 分类改版（ceaf889）旧网址止血
        'internet-freedom-matter.md': 'basics/internet-freedom.md'
        'what-is-anonymous-network.md': 'tools/what-is-anonymity-network.md'
        'what-is-ooni.md': 'tools/what-is-ooni.md'
        'what-is-tails.md': 'tools/what-is-tails.md'
        'what-is-tor.md': 'tools/what-is-tor.md'
        'tor-snowflake.md': 'tools/tor-snowflake.md'
        'ooni-asns-coverage.md': 'taiwan/ooni-asn-coverage.md'
        'ooni-weblists.md': 'taiwan/ooni-checklist.md'
        'watcher-tor-relays.md': 'taiwan/tor-relay-watcher.md'
        'ooni-i18n.md': 'community/i18n.md'
        'setup-repo.md': 'community/setup-repo.md'
        'setup-tor-relay.md': 'community/setup-tor-relay.md'
        'setup-skill-level.md': 'community/skill-level.md'
        'about/community/index.md': 'community/index.md'
        'about/community/participate.md': 'community/how-to-contribute.md'
        'about/community/communication-tools.md': 'community/tools.md'
        # GSC 404 補漏（2026-07-22 匯出）：C 分類頁→section index、E blog→blog index、F report/→reports
        'about/community.md': 'community/index.md'
        'about/send-censorship.md': 'about/index.md'
        'blog/2025/01/project-relaunch-2025.md': 'blog/index.md'
        'blog/2025/01/專案重啟-2025.md': 'blog/index.md'
        'blog/2026/02/ooni-全新的匿名憑證系統.md': 'blog/index.md'
        'community/campus-relay-faq.md': 'community/index.md'
        'community/campus-tor-relay-proposal.md': 'community/index.md'
        'community/campus-tor-relay-sop.md': 'community/index.md'
        'regional.md': 'taiwan/index.md'
        'regional/tor-relay-watcher.md': 'taiwan/index.md'
        'report/interseclab-the-internet-coup.md': 'reports/index.md'
        'report/interseclab-the-internet-coup/index_3.md': 'reports/index.md'
        'report/interseclab-the-internet-coup/index_5.md': 'reports/index.md'
        'report/interseclab-the-internet-coup/index_8.md': 'reports/index.md'
        'reports/interseclab-madlink.md': 'reports/index.md'
        'reports/interseclab-madlink/index_3.md': 'reports/index.md'
        'reports/interseclab-madlink/index_6.md': 'reports/index.md'
        'reports/interseclab-network-coup.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_1.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_2.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_3.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_4.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_5.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_6.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_7.md': 'reports/index.md'
        'reports/interseclab-network-coup/index_8.md': 'reports/index.md'
  - social:
      cards_layout_options:
        font_family: Noto Sans SC
        color: "#ffffff"
        background_color: "#00aeff"
  - privacy:
      assets_exclude:
        - aa.anoni.net/*
        - static.cloudflareinsights.com/*
  - git-revision-date-localized:
      type: iso_datetime
      locale: en
      enable_creation_date: true
      enable_parallel_processing: true
  - blog:
      post_url_date_format: yyyy/MM
      post_url_format: "{date}/{slug}"
      archive: true
      categories: true
      categories_name: !ENV [CATE_NAME, "文章类型"]
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
        as_update: git
      categories:
        - categories
        - tages
      pretty_print: false
      abstract_chars_count: -1
  - charts:
      vega_theme_light: powerbi
      vega_theme_dark: carbong100
      integrations:
        mkdocs_material:
          themes_light:
            - default
          themes_dark:
            - slate
markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
  - pymdownx.snippets:
      base_path: [".", ".."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {}
  - footnotes
