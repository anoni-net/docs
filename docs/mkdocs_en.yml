theme:
  name: material
  logo: assets/images/logo-white.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: light blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  language: !ENV [LANGUAGE, "zh-TW"]
  custom_dir: !ENV [OVERRIDES, "overrides"]
  features:
    - navigation.top
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.action.view
    - content.action.edit
    - content.tooltips
    - content.code.copy
    - content.footnote.tooltips
extra:
  alternate:
    - name: English (en-US)
      link: /docs/en/
      lang: en
    # zh-TW 是網站預設語系，建在根路徑，沒有獨立語系區段。理由見 mkdocs.yml 的註解。
    - name: 臺灣正體（zh-TW）
      link: /docs/
      lang: zh-TW
    - name: 簡體中文（zh-CN）
      link: /docs/zh-cn/
      lang: zh-CN
  social:
    - icon: material/home
      link: https://anoni.net/docs/en/
    - icon: fontawesome/brands/github
      link: https://github.com/anoni-net/docs
    - icon: simple/torbrowser
      link: http://docs.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/en/
    - icon: material/email-plus
      link: https://form.anoni.net/s/w21855zpca072rvgp0s2govj
extra_css:
  - stylesheets/extra.css
# vega 三件套（約 820 KB）不放在這裡。放進 extra_javascript 等於全站每一頁都載，
# 而全站 198 頁裡只有 3 頁畫圖表。改成那三頁各自在內文裡引用，見 snippets/vega.md。
# privacy plugin 照樣會把它們抓成本地檔案，只是現在只有需要的頁面才連過去。
#
# 底下這一個檔案的檔名同時含 vega、vega-lite、vega-embed，是為了通過
# mkdocs-charts-plugin 在 on_config 的相依檢查，理由寫在那個檔案裡。
# tools/test_chart_assets.mjs 守著這個安排。
extra_javascript:
  - js/vega-vega-lite-vega-embed-ondemand.js
hooks:
  - hooks/latest_posts.py
  - hooks/offline_index.py
plugins:
  - search:
      lang:
        - zh
        - en
  - redirects:
      redirect_maps:
        # offline-install 併進 offline（安裝說明與離線內容管理收成一頁）
        'offline-install.md': 'offline.md'
        # 2026 flat → categorised restructure (3aa2a65). Pages whose English content
        # still exists point at the article; only genuinely dropped pages fall back
        # to the nearest live section index.
        'internet-freedom-matter.md': 'basics/internet-freedom.md'
        'intro/index.md': 'basics/index.md'
        'what-is-tails.md': 'tools/what-is-tails.md'
        'what-is-tor.md': 'tools/what-is-tor.md'
        'what-is-anonymous-network.md': 'tools/what-is-anonymity-network.md'
        'tor-snowflake.md': 'tools/tor-snowflake.md'
        'what-is-ooni.md': 'tools/what-is-ooni.md'
        'ooni-asns-coverage.md': 'regional/ooni-asn-coverage.md'
        'ooni-weblists.md': 'regional/ooni-checklist.md'
        'watcher-tor-relays.md': 'regional/tor-relay-watcher.md'
        'ooni-i18n.md': 'community/i18n.md'
        'setup-repo.md': 'community/setup-repo.md'
        'setup-tor-relay.md': 'community/setup-tor-relay.md'
        'setup-skill-level.md': 'community/skill-level.md'
        # GSC 404 補漏（2026-07-22 匯出）：C 分類頁→section index、E blog→blog index、F report/→reports
        'about/community.md': 'community/index.md'
        'about/community/communication-tools.md': 'community/index.md'
        'about/community/participate.md': 'community/index.md'
        'about/send-censorship.md': 'about/index.md'
        'advanced.md': 'advanced/index.md'
        'blog/2025/01/專案重啟-2025.md': 'blog/index.md'
        'blog/2025/01/项目重启-2025.md': 'blog/index.md'
        'blog/2025/02/g0v-hackath65n.md': 'blog/index.md'
