<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />

  <!-- 這頁在建置後會同時出現在 /docs/games/ 與 /docs/zh-tw/games/ 兩個網址，

       語言由 ?lang= 決定，同一份檔案服務三個語系，所以正規網址不帶參數。 -->
  <link rel="canonical" href="https://anoni.net/docs/games/onion-routing/" />
  <!-- OG 寫死在這裡，因為這頁不經過 mkdocs 的模板。三個語系共用同一份程式，
       抓取預覽的爬蟲不會執行 JS，所以這裡固定用預設語系 zh-TW 的文案與正規網址。 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tor 路由解謎 · anoni.net" />
  <meta property="og:description" content="自己挑 3 個中繼組成 Tor 的 guard、middle、exit 路徑，避開被監聽的節點、把 3 跳分散到不同 ASN，遇到封鎖改走橋接。四個關卡各對應一項真實的選路考量。" />
  <meta property="og:image" content="https://assets.anoni.net/games/onion-routing.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="2990" />
  <meta property="og:image:height" content="1706" />
  <meta property="og:url" content="https://anoni.net/docs/games/onion-routing/" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Tor 路由解謎 · anoni.net" />
  <meta property="twitter:description" content="自己挑 3 個中繼組成 Tor 的 guard、middle、exit 路徑，避開被監聽的節點、把 3 跳分散到不同 ASN，遇到封鎖改走橋接。四個關卡各對應一項真實的選路考量。" />
  <meta property="twitter:image" content="https://assets.anoni.net/games/onion-routing.png" />
  <!-- 結構化資料。與 OG 同樣寫死，理由相同：這頁不經 mkdocs 模板，抓取的爬蟲不執行 JS。
       @id 用完整網址加片段，三件作品與著陸頁互相指涉時才能連成同一張圖。 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "VideoGame",
        "@id": "https://anoni.net/docs/games/onion-routing/#work",
        "name": "Tor 路由解謎",

        "url": "https://anoni.net/docs/games/onion-routing/",
        "description": "可操作的解謎。將訊息從你送到對岸的收件人，自行挑選 3 個中繼組成 Tor 的 guard、middle、exit 路徑，過程中要避開被監聽的節點、將 3 跳分散到不同 ASN，遇到封鎖則改走橋接。四個關卡各對應一項真實的選路考量。",
        "image": "https://assets.anoni.net/games/onion-routing.png",
        "inLanguage": ["zh-Hant", "zh-Hans", "en"],
        "genre": ["解謎", "教育"],
        "applicationCategory": "GameApplication",
        "gamePlatform": "Web browser",
        "playMode": "SinglePlayer",
        "browserRequirements": "需要支援 WebGPU 或 WebGL2 的瀏覽器，免安裝",
        "isAccessibleForFree": true,
        "isFamilyFriendly": true,
        "license": "https://github.com/anoni-net/docs/blob/main/LICENSE",
        "author": { "@id": "https://anoni.net/#organization" },
        "publisher": { "@id": "https://anoni.net/#organization" },
        "isPartOf": { "@id": "https://anoni.net/docs/games/#collection" },
        "about": [
          { "@type": "Thing", "name": "Tor", "sameAs": "https://www.torproject.org/" },
          { "@type": "Thing", "name": "洋蔥路由", "sameAs": "https://en.wikipedia.org/wiki/Onion_routing" },
          { "@type": "Thing", "name": "自治系統（ASN）", "sameAs": "https://en.wikipedia.org/wiki/Autonomous_system_(Internet)" }
        ]
      },
      {
        "@type": "Organization",
        "@id": "https://anoni.net/#organization",
        "name": "匿名網路社群 anoni.net",
        "url": "https://anoni.net/"
      },
      {
        "@type": "CollectionPage",
        "@id": "https://anoni.net/docs/games/#collection",
        "name": "互動與呈現",
        "url": "https://anoni.net/docs/games/"
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "文件", "item": "https://anoni.net/docs/" },
          { "@type": "ListItem", "position": 2, "name": "互動與呈現", "item": "https://anoni.net/docs/games/" },
          { "@type": "ListItem", "position": 3, "name": "Tor 路由解謎" }
        ]
      }
    ]
  }

  <style>
    :root {
      --cyan: #00aeff; --cyan-600: #009ee6; --cyan-800: #006d99;
      --ink: #eaf6ff; --muted: #9fb6c8;
      --panel: rgba(9, 16, 26, .82); --panel-b: rgba(0, 174, 255, .28);
      --danger: #ff5a5a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070e; }
    body { font: 14px/1.6 -apple-system, "Noto Sans TC", "PingFang TC", system-ui, sans-serif; color: var(--ink); }
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }
    a { color: var(--cyan); }

    .panel {
      position: fixed; z-index: 10; background: var(--panel);
      border: 1px solid var(--panel-b); border-radius: 14px;
      backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
    }

    /* 左上：品牌 + 任務 */
    #top { left: 14px; top: 14px; max-width: min(90vw, 340px); padding: 13px 15px; }
    #brand-title { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .3px; }
    #brand-tagline { margin: 2px 0 9px; color: var(--muted); font-size: 12.5px; }
    #level-name { font-weight: 700; color: var(--cyan); font-size: 13px; margin-bottom: 3px; }
    #objective { color: var(--ink); font-size: 13px; }
    #backend { display: inline-block; margin-top: 9px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); }
    #backend.gpu { color: #57e39a; } #backend.gl { color: #ffcf5c; } #backend.err { color: var(--danger); }
    #langs { margin-top: 8px; font-size: 11px; color: var(--muted); }
    #langs a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.18); }
    #langs a:hover { color: #fff; border-bottom-color: rgba(255,255,255,.5); }
    #langs .on { color: #fff; font-weight: 700; }
    #backlink { margin-top: 6px; font-size: 11px; color: var(--muted); }
    #backlink a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.18); }
    #backlink a:hover { color: #fff; border-bottom-color: rgba(255,255,255,.5); }
    #langs i { margin: 0 6px; opacity: .4; font-style: normal; }

    /* 圖例 */
    #legend-toggle { top: 14px; right: 14px; padding: 8px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink); }
    #legend { right: 14px; top: 54px; padding: 12px 15px; max-width: 240px; display: none; }
    #legend.open { display: block; }
    .lg-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 4px 0; }
    .lg-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 8px currentColor; flex: none; }
    .lg-note { margin-top: 8px; color: var(--muted); font-size: 11.5px; }
    .lg-regions { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; }
    .lg-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }
    .lg-dot.sm { width: 9px; height: 9px; }
    #legend-toggle:focus-visible, #hint-close:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    /* 底部操作區 */
    #dock { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 13px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: min(94vw, 620px); }
    #hops { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .hop { min-width: 150px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 10px; padding: 7px 11px; }
    .hop-label { font-size: 11px; color: var(--muted); }
    .slot-val { font-size: 13px; font-weight: 700; color: var(--muted); }
    .slot-val.filled { color: var(--cyan); }
    #actions { display: flex; gap: 10px; }
    button { font: inherit; font-weight: 800; border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer; }
    #btn-send { background: var(--cyan); color: #06121c; box-shadow: 0 4px 16px rgba(0,174,255,.35); }
    #btn-send:disabled { opacity: .5; cursor: default; }
    #btn-reset { background: rgba(255,255,255,.08); color: var(--ink); }
    button:active { transform: translateY(1px); }
    .feedback { min-height: 0; max-width: 560px; text-align: center; font-size: 13px; color: var(--danger); opacity: 0; transition: opacity .2s; }
    .feedback.show { opacity: 1; }

    /* Tooltip */
    #tooltip { position: fixed; z-index: 20; display: none; pointer-events: none; background: rgba(6,12,20,.94); border: 1px solid var(--panel-b); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 700; }

    /* 教學卡 */
    #card { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(3,6,12,.6); backdrop-filter: blur(4px); padding: 20px; }
    #card.show { display: flex; }
    #card-inner { background: var(--panel); border: 1px solid var(--panel-b); border-radius: 18px; max-width: 460px; padding: 24px 26px; box-shadow: 0 20px 70px rgba(0,0,0,.6); }
    #card-title { margin: 0 0 10px; font-size: 18px; color: var(--cyan); }
    #card-body { color: var(--ink); font-size: 14px; line-height: 1.75; }
    #card-actions { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #card-link { font-size: 13px; font-weight: 700; text-decoration: none; }
    #btn-next { background: var(--cyan); color: #06121c; margin-left: auto; }

    /* 提示 */
    #hint { left: 50%; bottom: 130px; transform: translateX(-50%); z-index: 9; max-width: min(90vw, 480px); padding: 8px 14px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    #hint.hidden { display: none; }
    #hint-close { cursor: pointer; color: var(--cyan); font-weight: 800; }

    @media (max-width: 560px) {
      #top { max-width: 74vw; padding: 11px 13px; }
      #brand-title { font-size: 15px; }
      /* 三張跳位卡改成擠在同一列。原本各佔一列，操作區會吃掉螢幕下半，把節點壓在面板後面 */
      #dock { padding: 10px 12px; gap: 8px; bottom: 12px; }
      #hops { gap: 6px; width: 100%; flex-wrap: nowrap; }
      .hop { min-width: 0; flex: 1; padding: 6px 8px; }
      .hop-label { font-size: 10px; }
      .slot-val { font-size: 11.5px; }
      button { padding: 9px 16px; white-space: nowrap; flex: none; }
    }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "../vendor/three.webgpu.min.js",
      "three/webgpu": "../vendor/three.webgpu.min.js",
      "three/tsl": "../vendor/three.tsl.min.js",
      "three/addons/": "../vendor/jsm/"
  } }
  </script>
</head>
<body>
  <div id="top" class="panel">
    <h1 id="brand-title">Tor 路由解謎</h1>
    <div id="brand-tagline">把訊息安全送到對岸</div>
    <div id="level-name">關卡</div>
    <div id="objective">目標</div>
    <div id="backend">偵測中…</div>
    <div id="langs"></div>
    <!-- 這頁對爬蟲來說原本是死路，站內連結一條都沒有，對使用者也沒有回去的路。
         靜態寫死 zh-TW 版本讓爬蟲讀得到，其他語系由 i18n 換掉整段（含連結網址）。 -->
    <div id="backlink">← <a href="../">互動與呈現</a>　延伸閱讀 <a href="../../tools/what-is-tor/">什麼是 Tor</a>、<a href="../../taiwan/ooni-asn-coverage/">台灣 ASN 觀測涵蓋</a></div>
  </div>

  <div id="legend-toggle" class="panel" role="button" tabindex="0">圖例</div>
  <div id="legend" class="panel"><div id="legend-body"></div></div>

  <div id="tooltip"></div>

  <div id="hint" class="panel">
    <span id="hint-text"></span>
    <span id="hint-close" role="button" tabindex="0">知道了</span>
  </div>

  <div id="dock" class="panel">
    <div id="hops">
      <div class="hop"><div class="hop-label" id="hop-label-0">入口</div><div class="slot-val" id="slot-0">—</div></div>
      <div class="hop"><div class="hop-label" id="hop-label-1">中繼</div><div class="slot-val" id="slot-1">—</div></div>
      <div class="hop"><div class="hop-label" id="hop-label-2">出口</div><div class="slot-val" id="slot-2">—</div></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div id="actions">
      <button id="btn-reset">重選</button>
      <button id="btn-send">送出訊息</button>
    </div>
  </div>

  <div id="card">
    <div id="card-inner">
      <h2 id="card-title"></h2>
      <div id="card-body"></div>
      <div id="card-actions">
        <a id="card-link" href="#" target="_top"></a>
        <button id="btn-next">下一關</button>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
