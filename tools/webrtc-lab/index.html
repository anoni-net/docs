<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WebRTC 實驗台（內部用）</title>
<!--
  issue #553 的實驗台，量 WebRTC DataChannel 在同一個區網裡傳離線包的可行性。

  這一頁不是文件站的內容。它放在 tools/ 底下，mkdocs 看不到，所以不會進 nav、
  不會進 sitemap，也不會被預快取清單收走。實驗結束就整個刪掉。

  第一階段只回答 issue 的 H1：只開 DataChannel 的 SDP 有多大，換算成 QR 影格是
  幾張、播多久。交換描述先用手動複製貼上，QR 那一段等 H1 的數字出來再決定要不要接。

  === 不送任何資料 ===

  整頁沒有 fetch、XMLHttpRequest、sendBeacon、WebSocket，也沒有載入任何外部資源。
  唯一對外的東西是 WebRTC 自己的連線，而它只在同一個區網裡找對方，沒有 STUN 也
  沒有 TURN。量測結果要自己按「匯出紀錄」存成檔案。

  === 怎麼跑 ===

  兩台裝置各開一次這一頁，或者同一台開兩個分頁。一邊按「我是發起方」，把產生的
  描述貼給另一邊，另一邊按「我是回應方」貼上、產生回應描述，再貼回發起方。
  連上之後任一邊都可以送檔案。

  本機測試直接開檔案就行。跨裝置要用 http 或 https 供裝，手機那端開 file:// 拿不到
  同一份頁面。
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 52rem;
    padding: 1rem 1rem 4rem;
  }
  h1 { font-size: 1.3rem; }
  h2 { border-top: 1px solid currentColor; font-size: 1rem; margin-top: 1.6rem; padding-top: 1rem; }
  textarea {
    box-sizing: border-box;
    font-family: ui-monospace, monospace;
    font-size: 0.75rem;
    min-height: 7rem;
    width: 100%;
  }
  button { font-size: 0.95rem; margin: 0.2rem 0.4rem 0.2rem 0; padding: 0.4rem 0.9rem; }
  button[disabled] { opacity: 0.45; }
  table { border-collapse: collapse; font-size: 0.85rem; width: 100%; }
  td, th { border-bottom: 1px solid rgba(128,128,128,0.35); padding: 0.25rem 0.4rem; text-align: left; }
  td:last-child, th:last-child { text-align: right; }
  .note { font-size: 0.8rem; opacity: 0.75; }
  .state { font-family: ui-monospace, monospace; font-size: 0.85rem; }
  progress { width: 100%; }
</style>
</head>
<body>

<h1>WebRTC 實驗台</h1>
<p class="note">
  issue #553 的量測工具，內部用，不對外發布。這一頁不送出任何資料，量測結果要自己按下方的「匯出紀錄」存檔。
</p>

<h2>一、角色</h2>
<button id="btn-offer">我是發起方，產生描述</button>
<button id="btn-answer">我是回應方，等對方的描述</button>
<p class="state" id="role-state">尚未選擇角色。</p>

<h2>二、本機描述</h2>
<p class="note">等 ICE 蒐集完成才會出現，所以不必再傳 candidate。整段複製給對方。</p>
<textarea id="local-sdp" readonly placeholder="按上面的按鈕產生"></textarea>
<button id="btn-copy">複製</button>
<table id="sdp-stats"><tbody></tbody></table>

<h2>三、對方的描述</h2>
<textarea id="remote-sdp" placeholder="貼上對方給的整段描述"></textarea>
<button id="btn-apply">套用</button>

<h2>四、連線狀態</h2>
<table><tbody id="conn-state"></tbody></table>

<h2>五、傳輸測試</h2>
<p class="note">選檔案，或用產生的測試資料。收到的一端會算 SHA-256 跟來源比對。</p>
<label>測試資料大小
  <select id="size">
    <option value="102400">100 KB</option>
    <option value="1048576" selected>1 MB</option>
    <option value="5242880">5 MB</option>
    <option value="20971520">20 MB</option>
  </select>
</label>
<button id="btn-send-generated">送出測試資料</button>
<input type="file" id="file">
<button id="btn-send-file">送出這個檔案</button>
<progress id="progress" max="100" value="0"></progress>
<table><tbody id="transfer-state"></tbody></table>

<h2>六、紀錄</h2>
<p class="note">匯出前會把 IP 與 mDNS 名稱遮掉，見 issue #553 的隱私那一節。</p>
<button id="btn-export">匯出紀錄</button>
<button id="btn-reset">重來</button>
<pre class="note" id="log"></pre>

<script>
(function () {
  "use strict";

  // QR 影格串流「中」檔位一張裝得下的位元組。qrstream.js 的 DENSITY 是 version 15
  // 配容錯度 M，扣掉標頭與 CRC 之後大約這個數字，跟 utils/qr-stream 那一頁寫的
  // 「512 KB 切成 1302 張」對得起來。中速是每秒 5 張。
  const QR_PAYLOAD_MEDIUM = 402;
  const QR_FRAMES_PER_SECOND = 5;

  // DataChannel 一次送多大。SCTP 的訊息上限各家實作不同，64 KB 是普遍安全的值。
  const CHUNK = 64 * 1024;
  // bufferedAmount 超過這個值就先停手，等它降下來再送，否則記憶體會被塞爆。
  const BUFFER_HIGH = 4 * 1024 * 1024;
  const BUFFER_LOW = 1 * 1024 * 1024;

  const el = (id) => document.getElementById(id);
  const log = [];

  function record(event, data) {
    const row = Object.assign({ at: new Date().toISOString(), event: event }, data || {});
    log.push(row);
    el("log").textContent = log.map((r) => JSON.stringify(r)).join("\n");
  }

  function rows(target, pairs) {
    target.innerHTML = "";
    for (const [k, v] of pairs) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = k;
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(th);
      tr.appendChild(td);
      target.appendChild(tr);
    }
  }

  // ---------------------------------------------------------------- SDP 量測

  // 只開 DataChannel 的描述裡，有幾行對這個用途沒有作用。量精簡後的大小是為了知道
  // 「真的要塞進 QR 的時候能壓到多小」，實際送出的仍然是原始描述。
  function trimSdp(sdp) {
    const drop = /^(a=msid-semantic|a=group:BUNDLE|a=extmap|a=rtcp-mux|a=ice-options)/;
    return sdp
      .split(/\r?\n/)
      .filter((line) => line.length > 0 && !drop.test(line))
      .join("\n");
  }

  async function gzipSize(text) {
    if (typeof CompressionStream !== "function") return null;
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
    const buffer = await new Response(stream).arrayBuffer();
    // QR 走的是文字，壓完還要 base64，換算成 4/3
    return { gzip: buffer.byteLength, base64: Math.ceil(buffer.byteLength / 3) * 4 };
  }

  async function showSdpStats(sdp) {
    const raw = new TextEncoder().encode(sdp).length;
    const trimmed = new TextEncoder().encode(trimSdp(sdp)).length;
    const packed = await gzipSize(trimSdp(sdp));
    const forQr = packed ? packed.base64 : trimmed;
    const frames = Math.ceil(forQr / QR_PAYLOAD_MEDIUM) + 1;
    const seconds = (frames / QR_FRAMES_PER_SECOND).toFixed(1);
    const pairs = [
      ["原始大小", raw + " B"],
      ["精簡後", trimmed + " B"],
      ["gzip", packed ? packed.gzip + " B" : "瀏覽器沒有 CompressionStream"],
      ["gzip 加 base64", packed ? packed.base64 + " B" : "n/a"],
      ["換算 QR 張數（中檔）", frames + " 張"],
      ["播完一輪", seconds + " 秒"],
      ["candidate 行數", (sdp.match(/^a=candidate/gm) || []).length],
    ];
    rows(el("sdp-stats").tBodies[0], pairs);
    record("sdp-stats", {
      raw: raw, trimmed: trimmed,
      gzip: packed ? packed.gzip : null,
      base64: packed ? packed.base64 : null,
      qrFrames: frames, qrSeconds: Number(seconds),
      candidates: (sdp.match(/^a=candidate/gm) || []).length,
    });
  }

  // 匯出前把位址遮掉。candidate 行裡有本機 IP 或 mDNS 名稱，兩者都指得回裝置。
  function maskSdp(sdp) {
    return sdp
      .replace(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.local/gi, "<mdns>.local")
      .replace(/\b\d{1,3}(\.\d{1,3}){3}\b/g, "<ipv4>")
      .replace(/\b(?:[0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}\b/gi, "<ipv6>");
  }

  // ---------------------------------------------------------------- 連線

  let pc = null;
  let channel = null;
  let role = null;
  let startedAt = 0;
  let openedAt = 0;
  const incoming = { chunks: [], size: 0, expect: null, startedAt: 0 };

  function newConnection() {
    // iceServers 留空是刻意的。這個實驗只處理同一個區網，不用 STUN 也不用 TURN，
    // 連得上就是靠 host candidate，連不上就是這個網路擋掉了裝置之間的連線。
    const conn = new RTCPeerConnection({ iceServers: [] });
    conn.addEventListener("connectionstatechange", updateState);
    conn.addEventListener("iceconnectionstatechange", updateState);
    conn.addEventListener("icegatheringstatechange", updateState);
    conn.addEventListener("datachannel", (event) => {
      channel = event.channel;
      wireChannel();
    });
    return conn;
  }

  function wireChannel() {
    channel.binaryType = "arraybuffer";
    channel.bufferedAmountLowThreshold = BUFFER_LOW;
    channel.addEventListener("open", () => {
      openedAt = performance.now();
      record("datachannel-open", { handshakeMs: Math.round(openedAt - startedAt) });
      updateState();
    });
    channel.addEventListener("close", () => { record("datachannel-close", {}); updateState(); });
    channel.addEventListener("message", onMessage);
  }

  async function updateState() {
    if (!pc) return;
    const pair = await selectedPair();
    rows(el("conn-state"), [
      ["角色", role || "未選"],
      ["connectionState", pc.connectionState],
      ["iceConnectionState", pc.iceConnectionState],
      ["iceGatheringState", pc.iceGatheringState],
      ["DataChannel", channel ? channel.readyState : "尚未建立"],
      ["握手耗時", openedAt ? Math.round(openedAt - startedAt) + " ms" : "未完成"],
      ["候選對", pair ? pair.local + " / " + pair.remote : "尚未選定"],
    ]);
  }

  // 走的是 host、srflx 還是 relay，決定了這條路在真實網路裡是怎麼通的。
  async function selectedPair() {
    if (!pc || !pc.getStats) return null;
    try {
      const stats = await pc.getStats();
      let pair = null;
      stats.forEach((report) => {
        if (report.type === "candidate-pair" && report.state === "succeeded" && report.nominated) pair = report;
      });
      if (!pair) return null;
      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      return {
        local: local ? local.candidateType : "?",
        remote: remote ? remote.candidateType : "?",
      };
    } catch (err) {
      return null;
    }
  }

  // ICE 蒐集完成才把描述交出去。實驗階段不做 trickle，因為 trickle 需要一條雙向
  // 且持續的通道，而手動貼上與 QR 都只能一次過一份。
  function waitForGathering(conn) {
    if (conn.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      const check = () => {
        if (conn.iceGatheringState === "complete") {
          conn.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      };
      conn.addEventListener("icegatheringstatechange", check);
      // 有些環境的 complete 不會來，給一個上限，拿到手上的 candidate 就先走
      setTimeout(resolve, 5000);
    });
  }

  el("btn-offer").addEventListener("click", async () => {
    role = "offerer";
    startedAt = performance.now();
    pc = newConnection();
    channel = pc.createDataChannel("bundle", { ordered: true });
    wireChannel();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForGathering(pc);
    el("local-sdp").value = JSON.stringify(pc.localDescription);
    await showSdpStats(pc.localDescription.sdp);
    el("role-state").textContent = "發起方。把上面的描述給對方，拿到回應之後貼進第三區。";
    updateState();
  });

  el("btn-answer").addEventListener("click", () => {
    role = "answerer";
    startedAt = performance.now();
    pc = newConnection();
    el("role-state").textContent = "回應方。把對方的描述貼進第三區按套用，再把產生的描述給回去。";
    updateState();
  });

  el("btn-apply").addEventListener("click", async () => {
    if (!pc) { el("role-state").textContent = "先選角色。"; return; }
    let desc;
    try {
      desc = JSON.parse(el("remote-sdp").value.trim());
    } catch (err) {
      el("role-state").textContent = "貼上的內容解不開，要整段 JSON。";
      return;
    }
    await pc.setRemoteDescription(desc);
    record("remote-description", { type: desc.type });
    if (role === "answerer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitForGathering(pc);
      el("local-sdp").value = JSON.stringify(pc.localDescription);
      await showSdpStats(pc.localDescription.sdp);
      el("role-state").textContent = "回應描述產生了，貼回給發起方。";
    }
    updateState();
  });

  el("btn-copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(el("local-sdp").value);
      el("role-state").textContent = "已複製。";
    } catch (err) {
      el("local-sdp").select();
      el("role-state").textContent = "瀏覽器不給用剪貼簿，已選取，自己按複製。";
    }
  });

  // ---------------------------------------------------------------- 傳輸

  async function sha256Hex(buffer) {
    const digest = await crypto.subtle.digest("SHA-256", buffer);
    return Array.from(new Uint8Array(digest))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  }

  function transferRows(pairs) {
    rows(el("transfer-state"), pairs);
  }

  async function sendBytes(bytes, name) {
    if (!channel || channel.readyState !== "open") {
      transferRows([["狀態", "還沒連上"]]);
      return;
    }
    const hash = await sha256Hex(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
    channel.send(JSON.stringify({ kind: "start", name: name, size: bytes.length, hash: hash }));
    record("send-start", { name: name, size: bytes.length });

    const began = performance.now();
    let sent = 0;
    while (sent < bytes.length) {
      if (channel.bufferedAmount > BUFFER_HIGH) {
        await new Promise((resolve) => {
          const once = () => { channel.removeEventListener("bufferedamountlow", once); resolve(); };
          channel.addEventListener("bufferedamountlow", once);
        });
      }
      const end = Math.min(sent + CHUNK, bytes.length);
      channel.send(bytes.subarray(sent, end));
      sent = end;
      el("progress").value = (sent / bytes.length) * 100;
    }
    channel.send(JSON.stringify({ kind: "end" }));

    const seconds = (performance.now() - began) / 1000;
    const mbps = (bytes.length / 1024 / 1024 / seconds).toFixed(2);
    transferRows([
      ["方向", "送出"],
      ["大小", bytes.length.toLocaleString() + " B"],
      ["耗時", seconds.toFixed(2) + " 秒"],
      ["吞吐", mbps + " MB/s"],
      ["SHA-256", hash.slice(0, 16) + "…"],
    ]);
    record("send-done", { size: bytes.length, seconds: Number(seconds.toFixed(2)), mbps: Number(mbps), hash: hash });
  }

  async function onMessage(event) {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);
      if (msg.kind === "start") {
        incoming.chunks = [];
        incoming.size = 0;
        incoming.expect = msg;
        incoming.startedAt = performance.now();
        record("recv-start", { name: msg.name, size: msg.size });
        transferRows([["方向", "接收中"], ["大小", msg.size.toLocaleString() + " B"]]);
        return;
      }
      if (msg.kind === "end") {
        const blob = new Blob(incoming.chunks);
        const buffer = await blob.arrayBuffer();
        const hash = await sha256Hex(buffer);
        const seconds = (performance.now() - incoming.startedAt) / 1000;
        const mbps = (incoming.size / 1024 / 1024 / seconds).toFixed(2);
        const ok = hash === incoming.expect.hash && incoming.size === incoming.expect.size;
        transferRows([
          ["方向", "接收"],
          ["大小", incoming.size.toLocaleString() + " B"],
          ["耗時", seconds.toFixed(2) + " 秒"],
          ["吞吐", mbps + " MB/s"],
          ["SHA-256 比對", ok ? "一致" : "不一致，這一次不算數"],
        ]);
        record("recv-done", {
          size: incoming.size, seconds: Number(seconds.toFixed(2)),
          mbps: Number(mbps), match: ok,
        });
        return;
      }
      return;
    }
    incoming.chunks.push(event.data);
    incoming.size += event.data.byteLength || event.data.size || 0;
    if (incoming.expect) el("progress").value = (incoming.size / incoming.expect.size) * 100;
  }

  el("btn-send-generated").addEventListener("click", async () => {
    const size = Number(el("size").value);
    // 用亂數填，避免 SCTP 或中間任何一層因為內容重複而壓縮，那會讓吞吐量失真
    const bytes = new Uint8Array(size);
    for (let at = 0; at < size; at += 65536) {
      crypto.getRandomValues(bytes.subarray(at, Math.min(at + 65536, size)));
    }
    await sendBytes(bytes, "generated-" + size);
  });

  el("btn-send-file").addEventListener("click", async () => {
    const file = el("file").files[0];
    if (!file) { transferRows([["狀態", "還沒選檔案"]]); return; }
    const buffer = await file.arrayBuffer();
    await sendBytes(new Uint8Array(buffer), file.name);
  });

  // ---------------------------------------------------------------- 紀錄

  el("btn-export").addEventListener("click", () => {
    const payload = {
      exportedAt: new Date().toISOString(),
      userAgent: navigator.userAgent,
      role: role,
      localSdp: pc && pc.localDescription ? maskSdp(pc.localDescription.sdp) : null,
      log: log,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "webrtc-lab-" + Date.now() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  el("btn-reset").addEventListener("click", () => location.reload());

  // 給自動化測試用的把手。人不會用到這幾個，CDP 驅動兩個分頁時需要它們。
  window.__lab = {
    offer: () => el("btn-offer").click(),
    answer: () => el("btn-answer").click(),
    apply: (text) => { el("remote-sdp").value = text; el("btn-apply").click(); },
    localSdp: () => el("local-sdp").value,
    state: () => ({
      connection: pc ? pc.connectionState : null,
      channel: channel ? channel.readyState : null,
      handshakeMs: openedAt ? Math.round(openedAt - startedAt) : null,
    }),
    send: (size) => { el("size").value = String(size); el("btn-send-generated").click(); },
    log: () => log,
  };
})();
</script>
</body>
</html>
