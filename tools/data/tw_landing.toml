# 台灣海纜登陸點：自建資料集
#
# 這份是人工維護的來源檔，每一筆都要標註可查證的出處。gen_tw_landing.py 讀這個檔，
# 再跟數位發展部的海纜清單合併，輸出地球儀用的 JSON。
#
# === 為什麼要自己建 ===
#
# 海纜登陸點座標從來沒有進過任何開放資料庫。OSM 查過，五個候選標籤全是 0 筆。
# Wikidata 的海底通訊電纜（Q506572）底下 190 個項目只有 1 個帶座標。唯一完整的是
# TeleGeography，而他們 2022 年底之後把資料收回，改成年費授權。
#
# 網路上流通的 CC BY-NC-SA 3.0 快照（stevesong/open_undersea_cable_map 是其中授權
# 主張最清楚的一份）只有台灣 6 個登陸點，現行版有 21 個，差的那 15 個正好是馬祖、
# 澎湖、金門這些離島。台灣海纜脆弱性最有話講的部分，剛好是那份快照沒有的。
#
# 所以這裡不碰 TeleGeography 的任何資料，從公開文獻與 OSM 自己建。範圍只有台灣，
# 量級是幾十個點而不是兩千個，做得完。
#
# === 精度標示（precision）===
#
#   站址   OSM 有明確標註為海纜站的建物或園區，且有海纜線段端點佐證
#   設施   OSM 標為電信機房且位置合理，但沒有標明是海纜站
#   端點   OSM 海纜線段的端點，但附近沒有對應的建物標註
#   里     只查到里級地名，座標取該里的中心
#   鄉鎮   只查到鄉鎮級地名，座標取該鄉鎮的中心
#
# 精度會原樣輸出到 JSON，畫面上要據此決定標示的口徑。站址等級可以說「登陸站」，
# 鄉鎮等級只能說「在這一帶登陸」。
#
# === 授權 ===
#
# OSM 來源採 ODbL，使用時標註「© OpenStreetMap contributors」。政府公告與新聞報導
# 引用的是其中的事實（哪條纜線連哪兩地），事實不受著作權保護。座標的彙整與精度判斷
# 是我們自己做的。

# === 已知缺口 ===
#
# 這份是 v1，不完整，補的時候照樣要標來源。目前缺的：
#
#   澎湖側的登陸點。臺澎二號、臺澎三號只查到台灣側（好美里、北門），澎湖那一端
#     還沒找到具體地名。澎金一號、澎金三號兩端都缺。
#   臺金二號的台灣側。OSM 的線段畫到 [24.4175, 118.9174] 就停在海上。
#   苑裡（苗栗）。文獻提到它是國內海纜登陸點之一，但沒查到是哪一條纜線。
#   大武（台東）。中央社提到它是登陸點，沒查到對應纜線與確切位置。
#   16 條國際海纜裡只有 APRICOT 對得上登陸站。其餘要逐條找 NCC 許可公告或
#     環評書件才能建立對應，那批文件多半是 PDF，得一份份讀。
#
# 補資料的順序建議照「對台灣的意義」排，離島優先於國際纜線，因為離島斷纜的
# 影響是整座島失聯，國際纜線斷掉多半只是繞路。

[meta]
updated = "2026-08-01"
note = "自建資料集，未使用 TeleGeography 的任何資料。v1 不完整，缺口見檔頭。"
osm_snapshot = "2026-06-01"


